name: Ranking pending retry 2026-11-02
on:
  push:
    branches: [main]
    paths: [.github/workflows/ranking-retry-once.yml]
permissions:
  contents: read
concurrency:
  group: weekly-swimmer-rankings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      SUPABASE_URL: ${{ secrets.SWIM_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SWIM_SUPABASE_SERVICE_ROLE_KEY }}
      RETRY_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/weekly-rankings.cjs
