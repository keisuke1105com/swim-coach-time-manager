name: Manual swimmer rankings
on:
  workflow_dispatch:
    inputs:
      retry_only:
        type: boolean
        default: false
        description: Retry pending events only
permissions:
  contents: read
concurrency:
  group: weekly-swimmer-rankings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      SUPABASE_URL: ${{ secrets.SWIM_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SWIM_SUPABASE_SERVICE_ROLE_KEY }}
      RETRY_ONLY: ${{ inputs.retry_only == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/weekly-rankings.cjs
