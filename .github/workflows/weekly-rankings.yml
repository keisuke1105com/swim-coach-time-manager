name: Read-only ranking probe
on:
  workflow_dispatch:
    inputs:
      retry_only:
        type: boolean
        default: false
        description: Retry pending events only
permissions:
  contents: read
concurrency:
  group: ranking-readonly-probe
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.SWIM_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SWIM_SUPABASE_SERVICE_ROLE_KEY }}
      RETRY_ONLY: ${{ github.event.schedule == '17 21 * * 4' || inputs.retry_only == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ranking-readonly-probe.cjs
