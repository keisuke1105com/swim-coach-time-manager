let sb=null,session=null,PLAYERS=[],records=[];let selectedPlayerId='',selectedStroke='自由形',selectedDistance=50,selectedCourse='長水路';
const VIEW_STATE_KEY='swimCloudViewState';
function saveViewState(tab,playerId=''){try{localStorage.setItem(VIEW_STATE_KEY,JSON.stringify({tab,playerId,ts:Date.now()}))}catch(e){}}
function getViewState(){try{return JSON.parse(localStorage.getItem(VIEW_STATE_KEY)||'{}')}catch(e){return {}}}
function restoreViewState(){const v=getViewState();const tab=['home','players','input','records','analysis'].includes(v.tab)?v.tab:'home';go(tab,false);if(tab==='players'&&v.playerId&&playerById(v.playerId))showPlayerDetail(v.playerId,false);}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const strokes=[...new Set(STANDARDS.map(x=>x.event))].filter(x=>!x.includes('リレー'));
const distances=[50,100,200,400,800,1500];
function setStatus(msg,type='notice'){ $('#status').innerHTML=msg?`<div class="${type}">${msg}</div>`:'' }
function configured(){return window.SUPABASE_URL&&window.SUPABASE_PUBLISHABLE_KEY&&!window.SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')}
function sec(t){
  t=String(t).trim();
  if(!t)return NaN;

  // 全角記号を半角へ
  t=t.replace(/：/g,':').replace(/。/g,'.');

  // iPhone入力対応
  // 例 1.13.64 → 1:13.64
  const dots=(t.match(/\./g)||[]).length;
  if(!t.includes(':') && dots===2){
    const p=t.split('.');
    t=p[0]+':'+p[1]+'.'+p[2];
  }

  // 1:13.64 → 秒へ変換
  let p=t.split(':');
  if(p.length===2){
    const m=Number(p[0]);
    const s=Number(p[1]);
    return Number.isFinite(m)&&Number.isFinite(s)
      ? m*60+s
      : NaN;
  }

  // 50mなど 32.45 はそのまま秒
  const n=Number(t);
  return Number.isFinite(n)?n:NaN;
}

function formatTimeInput(){
  const el=$('#itime');
  if(!el)return;

  let t=String(el.value||'').trim();
  if(!t)return;

  t=t.replace(/：/g,':').replace(/。/g,'.');

  // 1.13.64 → 1:13.64
  const dots=(t.match(/\./g)||[]).length;
  if(!t.includes(':') && dots===2){
    const p=t.split('.');
    if(p.length===3){
      el.value=p[0]+':'+p[1]+'.'+p[2];
    }
  }

  preview();
}

function fmt(v){if(v==null||isNaN(v))return '-';let m=Math.floor(v/60),s=v-m*60;return (m?m+':':'')+s.toFixed(2).padStart(m?5:0,'0')}
function playerById(id){return PLAYERS.find(x=>x.id===id)}
// 日本水泳連盟「Results of Japan Swimming」選手ページとの紐づけ
const JASF_ATHLETE_IDS={
  '龍田小春':'58337328'
};
function jasfAthleteIds(player){
  if(!player)return [];
  const ids=[];
  const add=v=>{
    const id=String(v||'').trim();
    if(/^\d+$/.test(id) && !ids.includes(id))ids.push(id);
  };
  if(Array.isArray(player.athlete_ids))player.athlete_ids.forEach(add);
  add(player.athlete_id||player.jasf_athlete_id);
  const key=String(player.name||'').replace(/[ 　]/g,'').trim();
  add(JASF_ATHLETE_IDS[key]);
  return ids;
}
function jasfAthleteId(player){return jasfAthleteIds(player)[0]||'';}
function jasfAthleteUrl(player){
  const athleteId=jasfAthleteId(player);
  return athleteId?`https://result.swim.or.jp/athletes/${athleteId}`:'';
}
function parseAthleteIds(value){
  return [...new Set(String(value||'').split(/[\s,、，]+/).map(v=>v.trim()).filter(Boolean))];
}

function jasfRecordDate(year,dateValue){
  const raw=String(dateValue||'').trim();
  let m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=raw.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(!m)return `${year}-04-01`;
  const month=Number(m[1]);
  const calendarYear=month<=3?Number(year)+1:Number(year);
  return `${calendarYear}-${String(month).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
}

// Results of Japan Swimming API のコード対応
const JASF_EVENTS=[
  {stroke:'自由形',styleCode:1,distances:[{m:50,code:2},{m:100,code:3},{m:200,code:4},{m:400,code:5},{m:800,code:6},{m:1500,code:7}]},
  {stroke:'背泳ぎ',styleCode:2,distances:[{m:50,code:2},{m:100,code:3},{m:200,code:4}]},
  {stroke:'平泳ぎ',styleCode:3,distances:[{m:50,code:2},{m:100,code:3},{m:200,code:4}]},
  {stroke:'バタフライ',styleCode:4,distances:[{m:50,code:2},{m:100,code:3},{m:200,code:4}]},
  {stroke:'個人メドレー',styleCode:5,distances:[{m:200,code:4},{m:400,code:5}]}
];

async function fetchJasfRecord(athleteId,year,waterwayCode,swimmingStyleCode,distanceCode){
  const base=String(window.SUPABASE_URL||'').replace(/\/$/,'');
  const res=await fetch(`${base}/functions/v1/jasf-test`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      athlete_id:String(athleteId),
      year:Number(year),
      waterway_code:Number(waterwayCode),
      swimming_style_code:Number(swimmingStyleCode),
      distance_code:Number(distanceCode)
    })
  });
  const json=await res.json();
  if(!res.ok||!json.success)throw new Error(json?.data?.message||json.error||`HTTP ${res.status}`);
  return json;
}

function jasfResultIdFromMemo(memo){
  const m=String(memo||'').match(/result_id:([^\s/]+)/);
  return m&&m[1]&&m[1]!=='-'?m[1]:'';
}


// 完全一致の重複判定：選手・日付・種目・距離・水路・タイムが同じ記録
function recordExactKey(r){
  const t=Number(r?.time_seconds);
  return `${r?.swimmer_id||''}|${r?.record_date||''}|${r?.stroke||''}|${Number(r?.distance)||0}|${r?.course||''}|${Number.isFinite(t)?t.toFixed(3):''}`;
}
function recordSourcePriority(r){
  const memo=String(r?.memo||''), meet=String(r?.meet_name||'');
  if(memo.includes('日本水泳連盟'))return 3;       // 公式を最優先
  if(memo.includes('スクリーンショット解析')||meet.includes('大会速報スクリーンショット'))return 2; // 速報
  return 1;                                         // 手入力
}
function chooseDuplicateKeeper(arr){
  return [...arr].sort((a,b)=>recordSourcePriority(b)-recordSourcePriority(a)
    || String(a.created_at||'').localeCompare(String(b.created_at||''))
    || String(a.id||'').localeCompare(String(b.id||'')))[0];
}
async function recalcPersonalBests(playerIds){
  for(const playerId of [...new Set(playerIds.map(String))]){
    const mine=records.filter(r=>String(r.swimmer_id)===playerId);
    const bestByEvent=new Map();
    mine.forEach(r=>{
      const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
      const t=Number(r.time_seconds); if(!Number.isFinite(t))return;
      const cur=bestByEvent.get(key);
      if(!cur||t<Number(cur.time_seconds)||(Math.abs(t-Number(cur.time_seconds))<0.001&&String(r.record_date||'')>String(cur.record_date||'')))bestByEvent.set(key,r);
    });
    const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
    if(clearErr)throw clearErr;
    for(const r of bestByEvent.values()){
      const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
      if(error)throw error;
    }
  }
}

async function cleanupExactDuplicatesForPlayerSilent(playerId){
  await loadCloud();
  const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
  const groups=new Map();
  mine.forEach(r=>{const k=recordExactKey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  const deleteIds=[];
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    const keep=chooseDuplicateKeeper(arr);
    arr.filter(r=>String(r.id)!==String(keep.id)).forEach(r=>deleteIds.push(r.id));
  }
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error)throw error;
  }
  if(deleteIds.length){
    await loadCloud();
    await recalcPersonalBests([String(playerId)]);
    await loadCloud();
  }
  return deleteIds.length;
}

async function cleanupAllExactDuplicates(){
  if(!confirm('全選手の完全一致した重複記録を整理します。\n\n同じ選手・日付・種目・距離・水路・タイムがすべて同じ記録だけが対象です。\n残す優先順位は「🇯🇵公式 ＞ 📱速報 ＞ 手入力」です。よろしいですか？'))return;
  await loadCloud();
  const groups=new Map();
  records.forEach(r=>{const k=recordExactKey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  const deleteIds=[], affectedPlayers=new Set();
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    const keep=chooseDuplicateKeeper(arr);
    arr.filter(r=>String(r.id)!==String(keep.id)).forEach(r=>{deleteIds.push(r.id);affectedPlayers.add(String(r.swimmer_id));});
  }
  if(!deleteIds.length){alert('完全一致する重複記録はありませんでした。');return;}
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('重複整理に失敗しました：'+error.message);return;}
  }
  await loadCloud();
  try{await recalcPersonalBests([...affectedPlayers]);}catch(e){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+String(e.message||e));}
  await loadCloud();renderHome();renderPlayers();renderAnalysis();
  alert(`重複整理が完了しました。\n削除：${deleteIds.length}件\n対象選手：${affectedPlayers.size}名\n\nタイムが違う同日記録は削除していません。`);
}

async function cleanupJasfDuplicates(playerId){
  const p=playerById(playerId);
  if(!p)return;
  if(!confirm(`${p.name} の日本水泳連盟から同期した重複記録を整理します。\n同じ result_id の公式記録だけを1件残し、手入力記録は削除しません。よろしいですか？`))return;
  await loadCloud();
  const rows=records.filter(r=>String(r.swimmer_id)===String(playerId) && String(r.memo||'').includes('日本水泳連盟'));
  const groups=new Map();
  rows.forEach(r=>{
    const rid=jasfResultIdFromMemo(r.memo);
    if(!rid)return;
    const key=`${playerId}|${rid}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(r);
  });
  const deleteIds=[];
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    arr.sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || String(a.id).localeCompare(String(b.id)));
    deleteIds.push(...arr.slice(1).map(r=>r.id));
  }
  if(!deleteIds.length){alert('整理する重複公式記録はありませんでした。');return;}
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('重複整理に失敗しました：'+error.message);return;}
  }
  await loadCloud();
  // この選手の自己ベスト印を整理し直す
  const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
  const bestByEvent=new Map();
  mine.forEach(r=>{
    const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
    const t=Number(r.time_seconds);
    if(!Number.isFinite(t))return;
    const cur=bestByEvent.get(key);
    if(!cur||t<Number(cur.time_seconds))bestByEvent.set(key,r);
  });
  const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
  if(clearErr){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+clearErr.message);await loadCloud();renderHome();return;}
  for(const r of bestByEvent.values()){
    const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
    if(error){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+error.message);break;}
  }
  await loadCloud();
  renderHome();
  renderPlayers();
  alert(`重複していた公式記録 ${deleteIds.length}件を削除しました。\n各公式記録は1件ずつ残しています。`);
}


async function cleanupAllJasfDuplicates(){
  if(!confirm(`全選手の日本水泳連盟から同期した重複公式記録を整理します。\n同じ選手・同じ result_id の公式記録だけを1件残します。\n手入力記録や result_id が異なる記録は削除しません。よろしいですか？`))return;
  await loadCloud();

  const official=records.filter(r=>String(r.memo||'').includes('日本水泳連盟'));
  const groups=new Map();
  official.forEach(r=>{
    const rid=jasfResultIdFromMemo(r.memo);
    if(!rid)return;
    const key=`${r.swimmer_id}|${rid}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(r);
  });

  const deleteIds=[];
  const affectedPlayers=new Set();
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    arr.sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || String(a.id).localeCompare(String(b.id)));
    arr.slice(1).forEach(r=>{deleteIds.push(r.id);affectedPlayers.add(String(r.swimmer_id));});
  }

  if(!deleteIds.length){
    alert('全選手を確認しましたが、整理する重複公式記録はありませんでした。');
    return;
  }

  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('全選手の重複整理に失敗しました：'+error.message);return;}
  }

  await loadCloud();

  // 重複があった選手だけ自己ベスト印を再計算
  for(const playerId of affectedPlayers){
    const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
    const bestByEvent=new Map();
    mine.forEach(r=>{
      const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
      const t=Number(r.time_seconds);
      if(!Number.isFinite(t))return;
      const cur=bestByEvent.get(key);
      if(!cur || t<Number(cur.time_seconds) || (Math.abs(t-Number(cur.time_seconds))<0.001 && String(r.record_date||'')>String(cur.record_date||''))) bestByEvent.set(key,r);
    });
    const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
    if(clearErr){alert(`重複は整理しましたが、${playerById(playerId)?.name||'選手'}のベスト印再計算でエラー：${clearErr.message}`);continue;}
    for(const r of bestByEvent.values()){
      const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
      if(error){alert(`重複は整理しましたが、${playerById(playerId)?.name||'選手'}のベスト印再計算でエラー：${error.message}`);break;}
    }
  }

  await loadCloud();
  renderHome();
  renderPlayers();
  renderAnalysis();
  alert(`全選手の重複整理が完了しました。\n削除した重複公式記録：${deleteIds.length}件\n対象選手：${affectedPlayers.size}名\n\n手入力記録と、result_id が異なる公式記録は残しています。`);
}

async function fetchJasfLatest(playerId){
  const p=playerById(playerId);
  const athleteIds=jasfAthleteIds(p);
  const box=$('#jasfLatestBox');
  if(!box)return;
  if(!athleteIds.length){
    box.innerHTML='<div class="notice">この選手の競技者IDはまだ登録されていません。</div>';
    return;
  }

  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=2024;y<=currentYear;y++)years.push(y);
  box.innerHTML=`<div class="notice">🇯🇵 日本水泳連盟から競技者ID ${athleteIds.join('・')} の${years[0]}〜${years[years.length-1]}年度記録を取得中…</div>`;

  try{
    const jobs=[];
    // period_code=4 は 2024年度以降の年度別データをまとめて返すため、
    // 年度ごとに同じAPIを繰り返し呼ばず、競技者ID×水路×種目×距離につき1回だけ取得する。
    athleteIds.forEach(athleteId=>[1,2].forEach(waterwayCode=>{
      JASF_EVENTS.forEach(ev=>ev.distances.forEach(d=>{
        jobs.push({
          athleteId,year:currentYear,course:waterwayCode===1?'長水路':'短水路',stroke:ev.stroke,distance:d.m,
          promise:fetchJasfRecord(athleteId,currentYear,waterwayCode,ev.styleCode,d.code)
        });
      }));
    }));

    const settled=await Promise.allSettled(jobs.map(j=>j.promise));
    const fetched=[];
    const errors=[];
    settled.forEach((r,i)=>{
      const job=jobs[i];
      if(r.status==='fulfilled'){
        const json=r.value;
        const groups=Array.isArray(json?.data?.result)?json.data.result:[];
        groups.forEach(g=>{
          const rows=Array.isArray(g?.data)?g.data:[];
          rows.forEach(x=>fetched.push({x,athleteId:job.athleteId,course:job.course,year:Number(g.year||json.year||job.year),stroke:job.stroke,distance:job.distance}));
        });
      }else{
        const msg=String(r.reason?.message||r.reason||'');
        // 記録なし等は大量表示せず、通信・API異常だけ後で確認できるよう保持
        if(!/invalid|422|記録がありません/i.test(msg))errors.push(`ID ${job.athleteId} / 2024年度以降 ${job.course} ${job.stroke}${job.distance}m: ${msg}`);
      }
    });

    if(!fetched.length)throw new Error('取得できる公式記録がありませんでした。競技者IDと年度を確認してください。');

    fetched.sort((a,b)=>a.year-b.year || String(a.x.result_date||'').localeCompare(String(b.x.result_date||'')));

    // 保存直前にクラウドを再読込し、別端末や直前の同期結果も含めて重複判定する。
    await loadCloud();
    const existingOfficialResultIds=new Set();
    const existingOfficialFallbackKeys=new Set();
    records.forEach(r=>{
      if(String(r.swimmer_id)!==String(playerId))return;
      if(!String(r.memo||'').includes('日本水泳連盟'))return;
      const rid=jasfResultIdFromMemo(r.memo);
      if(rid)existingOfficialResultIds.add(rid);
      existingOfficialFallbackKeys.add(`${r.stroke}|${Number(r.distance)}|${r.course}|${Number(r.time_seconds).toFixed(3)}|${r.record_date||''}`);
    });

    let saved=0,unchanged=0;
    const savedRows=[];

    for(const item of fetched){
      const x=item.x;
      const stroke=item.stroke;
      const distance=item.distance;
      const timeSeconds=sec(x.result_time);
      const recordDate=jasfRecordDate(item.year,x.result_date);
      const meetName=x.game_short_name||x.game_name||'日本水泳連盟公式記録';
      if(!Number.isFinite(timeSeconds))continue;

      const incomingResultId=String(x.result_id||'').trim();
      const fallbackKey=`${stroke}|${Number(distance)}|${item.course}|${Number(timeSeconds).toFixed(3)}|${recordDate}`;
      // result_id がある公式記録は result_id を最優先で判定。
      // result_id が無い場合だけ、公式記録同士の「種目・水路・タイム・日付」で判定する。
      // 手入力記録は重複判定の対象にしない。
      // 同じ result_id はもちろん、result_id が違っていても
      // 「種目・距離・水路・タイム・日付」が完全一致する公式記録は再登録しない。
      // これにより年度別ベスト同期を何度押しても同じ記録が増えない。
      const duplicate=(incomingResultId && existingOfficialResultIds.has(incomingResultId))
        || existingOfficialFallbackKeys.has(fallbackKey);

      // 同じ選手・日付・種目・距離・水路の「大会速報スクリーンショット」があれば、
      // 日本水泳連盟の公式記録を優先するため速報記録を削除する。
      // タイムが速報と公式で違っていても、公式側を正として置き換える。
      const provisionalRows=records.filter(r=>
        String(r.swimmer_id)===String(playerId) &&
        String(r.record_date||'')===String(recordDate) &&
        r.stroke===stroke && Number(r.distance)===Number(distance) && r.course===item.course &&
        (String(r.memo||'').includes('スクリーンショット解析から登録') || String(r.meet_name||'').includes('大会速報スクリーンショット'))
      );
      if(provisionalRows.length){
        const ids=provisionalRows.map(r=>r.id).filter(Boolean);
        if(ids.length){
          const {error:delError}=await sb.from('swim_records').delete().in('id',ids);
          if(delError)throw delError;
        }
        for(const pr of provisionalRows){
          const idx=records.findIndex(r=>String(r.id)===String(pr.id));
          if(idx>=0)records.splice(idx,1);
        }
      }

      // 公式記録が既に保存済みなら、速報だけ整理して新規追加はしない。
      if(duplicate){unchanged++;continue;}

      const currentBest=best(playerId,stroke,distance,item.course);
      const isBest=currentBest==null||timeSeconds<Number(currentBest)-0.001;
      const meet=joMeetInfo(recordDate);
      const st=standard(playerId,stroke,distance,item.course,meet?.date||null);
      const jo=st!=null&&timeSeconds<=st;

      if(isBest&&currentBest!=null){
        const {error:clearError}=await sb.from('swim_records').update({is_personal_best:false})
          .eq('swimmer_id',playerId).eq('stroke',stroke).eq('distance',distance).eq('course',item.course).eq('is_personal_best',true);
        if(clearError)throw clearError;
      }

      const payload={
        swimmer_id:playerId,stroke,distance,course:item.course,time_seconds:timeSeconds,meet_name:meetName,record_date:recordDate,
        memo:`日本水泳連盟 ID:${item.athleteId} / ${item.year}年度 / result_id:${x.result_id||'-'}`,
        is_personal_best:isBest,is_jo_qualified:jo
      };
      const {error}=await sb.from('swim_records').insert(payload);
      if(error)throw error;
      saved++;
      savedRows.push(`${item.year}年度 ${stroke} ${distance}m・${item.course} ${x.result_time}`);
      records.push({...payload,id:`jasf-temp-${Date.now()}-${saved}`});
      if(incomingResultId)existingOfficialResultIds.add(incomingResultId);
      existingOfficialFallbackKeys.add(fallbackKey);
    }

    // 同期完了時に、この選手の完全一致重複を自動整理する。
    // 公式 ＞ 速報 ＞ 手入力の優先順位で1件だけ残す。
    const autoCleaned=await cleanupExactDuplicatesForPlayerSilent(playerId);
    await loadCloud();
    const yearGroups=years.map(year=>{
      const rows=fetched.filter(v=>v.year===year);
      if(!rows.length)return '';
      return `<div class="result" style="margin-top:12px"><b>📅 ${year}年度 公式記録</b>${rows.map(({x,stroke,distance,course})=>`
        <div class="row"><div><b>${stroke} ${distance}m</b><br><span class="muted">${course} ／ ${x.result_date||''} ${x.game_name||''}</span></div>
        <div style="text-align:right"><b style="font-size:20px">${x.result_time||'-'}</b><br><span class="muted">${x.division?.name||''}${x.is_best_record?' ★':''}</span></div></div>`).join('')}</div>`;
    }).join('');

    box.innerHTML=`<div class="result good"><b>✅ 日本水泳連盟との同期が完了しました</b><br><span class="small">競技者ID：${athleteIds.join('・')} ／ 新規公式記録：${saved}件 ／ 登録済み：${unchanged}件 ／ 重複整理：${autoCleaned}件</span>${saved===0?`<div class="small" style="margin-top:8px">✨ 新しい公式記録はありません。登録済みデータは増やしていません。</div>`:''}${savedRows.length?`<div class="small" style="margin-top:8px">保存：${savedRows.join('、')}</div>`:''}</div>${yearGroups}${errors.length?`<div class="notice small" style="margin-top:10px">一部取得エラー：<br>${errors.slice(0,10).join('<br>')}</div>`:''}`;
    renderHome();
  }catch(e){
    await loadCloud();
    box.innerHTML=`<div class="error">公式記録の同期に失敗しました。<br><span class="small">${String(e.message||e)}</span></div>`;
  }
}

function ageOnDate(birthDate, targetDate){
  if(!birthDate || !targetDate) return null;

  const b = new Date(birthDate + 'T00:00:00');
  const d = new Date(targetDate + 'T00:00:00');

  if(isNaN(b) || isNaN(d)) return null;

  let age = d.getFullYear() - b.getFullYear();

  const birthdayPassed =
    d.getMonth() > b.getMonth() ||
    (d.getMonth() === b.getMonth() && d.getDate() >= b.getDate());

  if(!birthdayPassed) age--;

  return age;
}

function joMeetInfo(recordDate){
  const raw=recordDate||new Date().toISOString().slice(0,10);
  const d=new Date(raw+'T00:00:00');
  if(isNaN(d))return null;
  const y=d.getFullYear(),m=d.getMonth()+1;
  const seasonYear=m>=4?y:y-1;
  const schedules={2026:{summer:'2026-08-22',spring:'2027-03-27'}};
  const sc=schedules[seasonYear];
  if(!sc)return null;
  const summerDate=new Date(sc.summer+'T00:00:00');
  return d<=summerDate
    ? {name:`${seasonYear}年夏季JO`,date:sc.summer}
    : {name:`${seasonYear+1}年春季JO`,date:sc.spring};
}

function joDivisionFor(player,stroke,distance,meetDate){
  if(!player)return null;
  let age=null,division=player.age_group;
  if(player.birth_date&&meetDate)age=ageOnDate(player.birth_date,meetDate);
  if(age!==null){
    if(age<=9)division='9歳以下';
    else if(age===10)division='10歳';
    else if(age===11)division='11歳';
    else if(age===12)division='12歳';
    else if(age===13)division='13歳';
    else if(age===14)division='14歳';
    else if(age===15||age===16)division='15〜16歳';
    else if(age>=17)division='CS';
  }
  if(division==='17-18歳'||division==='17～18歳')division='CS';
  // JO特例：13歳以上の50m背泳ぎ・平泳ぎ・バタフライはCS標準を使用。
  // meetDateが渡されない詳細画面・グラフ等でも、登録済み年齢区分から同じ特例を適用する。
  const cs50AgeDivision=['13歳','14歳','15〜16歳','15～16歳','17-18歳','17～18歳','CS'].includes(String(division||'').trim());
  if(Number(distance)===50 && ['背泳ぎ','平泳ぎ','バタフライ'].includes(stroke) && ((age!==null&&age>=13)||cs50AgeDivision))division='CS';
  return {age,division};
}

function standard(playerId,stroke,distance,course,targetDate=null){
  const p=playerById(playerId);
  if(!p)return null;
  const divInfo=joDivisionFor(p,stroke,distance,targetDate);
  const division=divInfo?.division||p.age_group;
  const x=STANDARDS.find(x=>x.event===stroke&&parseInt(x.distance)===Number(distance)&&x.division===division);
  if(!x)return null;
  return p.gender==='男子'?(course==='長水路'?x.maleLC:x.maleSC):(course==='長水路'?x.femaleLC:x.femaleSC);
}

const TOKYO_SC_MEET_DATE='2026-10-30';

function tokyoScInfo(playerId,stroke,distance){
  const p=playerById(playerId);
  const age=p?.birth_date ? ageOnDate(p.birth_date,TOKYO_SC_MEET_DATE) : null;
  if(!p || !Array.isArray(window.TOKYO_SC_STANDARDS)){
    return {date:TOKYO_SC_MEET_DATE,age,ageKey:null,standard:null};
  }

  const g=String(p.gender||'').trim();
  const gender=g.includes('女')?'女子':g.includes('男')?'男子':g;

  // 要項どおり、本大会第1日目 2026/10/30 の満年齢で参加年齢を決定する。
  // 生年月日が未登録の選手だけ、従来の年齢区分をフォールバックとして使う。
  let ageKey=null;
  if(age!==null){
    ageKey=age<=8?'8歳以下':age>=19?'19歳以上':`${age}歳`;
  }else{
    const ageRaw=String(p.age_group||'').trim();
    const ageMatch=ageRaw.match(/\d+/);
    if(ageMatch){
      const n=Number(ageMatch[0]);
      ageKey=n<=8?'8歳以下':n>=19?'19歳以上':`${n}歳`;
    }
  }

  if(!ageKey)return {date:TOKYO_SC_MEET_DATE,age,ageKey:null,standard:null};

  const event=String(stroke||'').trim();
  const dist=Number(distance);
  const x=window.TOKYO_SC_STANDARDS.find(r=>
    String(r.gender).trim()===gender &&
    String(r.age).trim()===ageKey &&
    String(r.event).trim()===event &&
    Number(r.distance)===dist
  );

  return {date:TOKYO_SC_MEET_DATE,age,ageKey,standard:x?Number(x.standard):null};
}

function tokyoScStandard(playerId,stroke,distance){
  return tokyoScInfo(playerId,stroke,distance).standard;
}

function schoolGrade2027(player){
  if(!player?.birth_date)return null;
  const ageApr1=ageOnDate(player.birth_date,'2027-04-01');

  let label=n<=6?`小${n}`:n<=9?`中${n-6}`:n<=12?`高${n-9}`:'大学生以上';

async function fetchAllRows(table,buildQuery,pageSize=1000){
  const all=[];
  for(let from=0;;from+=pageSize){
    let q=sb.from(table).select('*');
    if(buildQuery)q=buildQuery(q);
    const {data,error}=await q.range(from,from+pageSize-1);
    if(error)throw error;
    const rows=data||[];
    all.push(...rows);
    if(rows.length<pageSize)break;
  }
  return all;
}

  function swimFiscalYear(dateValue){
  const m=String(dateValue||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return null;
  const y=Number(m[1]), month=Number(m[2]);
  return month>=4?y:y-1;
}

function renderTrendChart(playerId){
  const select=$('#trendSelect');
  const chart=$('#trendChart');
  if(!select || !chart)return;
  const key=select.value;if(!key)return;
  const [stroke,distance,course]=key.split('|');
  const data=records.filter(r=>String(r.swimmer_id)===String(playerId)&&r.stroke===stroke&&Number(r.distance)===Number(distance)&&r.course===course&&Number.isFinite(Number(r.time_seconds)))
    .sort((a,b)=>String(a.record_date||'').localeCompare(String(b.record_date||'')));
  if(!data.length){chart.innerHTML='<p class="muted">グラフにできる記録がありません。</p>';return;}

  const years=[...new Set(data.map(r=>swimFiscalYear(r.record_date)).filter(y=>y!=null))].sort((a,b)=>a-b);
  const currentFY=swimFiscalYear(new Date().toISOString().slice(0,10));
  const defaultFY=years.includes(currentFY)?currentFY:years[years.length-1];
  chart.innerHTML=`
    <div class="actions" style="margin:8px 0 12px">
      <button id="trendAnnualBtn" onclick="renderTrendMode('${playerId}','annual')">🏅 年度ベスト推移</button>

    <div id="trendModeChart"></div>`;
  renderTrendMode(playerId,'annual');
}

function renderTrendMode(playerId,mode){
  const select=$('#trendSelect'), box=$('#trendModeChart');if(!select||!box)return;
  const [stroke,distance,course]=select.value.split('|');
  const all=records.filter(r=>String(r.swimmer_id)===String(playerId)&&r.stroke===stroke&&Number(r.distance)===Number(distance)&&r.course===course&&Number.isFinite(Number(r.time_seconds)))

    graphData=Object.entries(byYear).sort((a,b)=>Number(a[0])-Number(b[0])).map(([fy,v])=>({label:`${fy}年度`,time:v.time,date:v.date,meet:v.meet}));

    title=`🏊 ${fy}年度 レース推移`;footer=`${fy}/4/1〜${fy+1}/3/31 のレース推移（表示 ${graphData.length}点／保存 ${raceRows.length}記録）`;

// 選手別・同学年ランキング自動照合
function jasfEventCodes(stroke,distance){
  const ev=JASF_EVENTS.find(x=>x.stroke===stroke);
  const d=ev?.distances?.find(x=>Number(x.m)===Number(distance));
  return ev&&d?{styleCode:ev.styleCode,distanceCode:d.code}:null;
}
function jasfGenderCode(player){return String(player?.gender||'').includes('女')?2:1;}
function normalizeJasfName(v){return String(v||'').normalize('NFKC').replace(/[\s　]/g,'').trim();}
async function fetchJasfRankingPage(player,stroke,distance,course,year=2026,schoolClassCode='99',schoolGrade='99',swimmerName='',page=1){
  const codes=jasfEventCodes(stroke,distance);
  if(!codes)throw new Error(`${stroke}${distance}m はランキングAPIのコード対応がありません。`);
  const params=new URLSearchParams({year:String(year),waterway_code:course==='短水路'?'2':'1',gender_code:String(jasfGenderCode(player)),distance_code:String(codes.distanceCode),swimming_style_code:String(codes.styleCode),school_class_code:String(schoolClassCode??99),school_grade:String(schoolGrade??99),swimmer_name:swimmerName,page:String(page)});
  const url=`https://result.swim.or.jp/api/v1/rankings/results?${params.toString()}`;
  let lastError=null;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),15000);
      const res=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal});
      clearTimeout(timer);
      const text=await res.text();let json=null;try{json=JSON.parse(text)}catch(e){}
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      if(!json)throw new Error('ランキングAPIの応答をJSONとして読み取れませんでした。');
      return Array.isArray(json.data)?json.data:Array.isArray(json?.data?.data)?json.data.data:[];
    }catch(e){
      lastError=e;
      if(attempt<3)await new Promise(r=>setTimeout(r,500*attempt));
    }
  }
  throw lastError||new Error('ランキングAPI取得失敗');
}
function jasfSchoolInfo(x){
  const sc=x?.swimmers?.school_class||x?.school_class||{};
  let grade=x?.swimmers?.school_grade??x?.school_grade??null;
  if(grade&&typeof grade==='object')grade=grade.code??grade.value??grade.id??null;
  const gs=x?.swimmers?.school_grades||x?.school_grades;
  if((grade==null||grade==='')&&Array.isArray(gs)){const g=gs.find(Boolean);grade=typeof g==='object'?(g.code??g.value??g.id):g;}
  return {schoolClassCode:sc?.code??99,schoolClassName:sc?.name||'',schoolGrade:grade??99};
}
function jasfPrefInfo(x){
  const s=x?.swimmers||x||{};
  // APIの版によって都道府県情報の格納場所が異なるため候補を順に確認する。
  const candidates=[s.prefecture,s.prefectures,s.entry_group?.prefecture,s.non_entry_group?.prefecture,s.non_entry_group?.member_group,s.entry_group?.member_group];
  for(const c of candidates){
    if(c&&typeof c==='object'&&(c.code!=null||c.id!=null||c.name))return {code:c.code??c.id??'',name:c.name||c.prefecture_name||''};
  }
  return {code:'',name:''};
}
function jasfGradeFromBirthDate(player,year=2026){
  if(!player?.birth_date)return null;
  // 日本の学年は年度開始時点（4/1）の年齢から算出。小1=1 … 高3=12。
  const ageApr1=ageOnDate(player.birth_date,`${year}-04-01`);
  if(ageApr1==null)return null;
  const n=ageApr1-5;
  if(n>=1&&n<=6)return {schoolClassCode:1,schoolClassName:'小学',schoolGrade:n,label:`小学${n}年`};
  if(n>=7&&n<=9)return {schoolClassCode:2,schoolClassName:'中学',schoolGrade:n-6,label:`中学${n-6}年`};
  if(n>=10&&n<=12)return {schoolClassCode:3,schoolClassName:'高校',schoolGrade:n-9,label:`高校${n-9}年`};
  return null;
}
function jasfSameSwimmer(row,player,athleteIds=[]){
  const name=normalizeJasfName(row?.swimmers?.swimmer_name||row?.swimmer_name);
  const playerName=normalizeJasfName(player?.name);
  if(name && playerName && name===playerName)return true;
  const code=String(row?.swimmers?.swimmer_code||row?.swimmer_code||'').replace(/\D/g,'');
  const ids=(athleteIds||[]).map(v=>String(v||'').replace(/\D/g,'')).filter(Boolean);
  return !!code && ids.includes(code);
}

function jasfSleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function withJasfRetry(task,{retries=2,baseDelay=1800}={}){
  let lastError=null;
  for(let attempt=0;attempt<=retries;attempt++){
    try{return await task();}
    catch(e){
      lastError=e;
      if(attempt>=retries)break;
      await jasfSleep(baseDelay*(attempt+1));
    }
  }
  throw lastError||new Error('ランキング通信に失敗しました');
}

async function safeFetchJasfRankingPage(...args){
  return withJasfRetry(()=>fetchJasfRankingPage(...args),{retries:2,baseDelay:1800});
}
async function fetchJasfRankingForPlayer(player,stroke,distance,course,year=2026){
  const target=normalizeJasfName(player.name), athleteIds=jasfAthleteIds(player);
  const derived=jasfGradeFromBirthDate(player,year);

  // まず「同学年＋氏名」で本人を直接検索する。
  // 全順位を500ページ走査する方式をやめ、iPhoneでも止まりにくくする。
  let schoolClassCode=derived?.schoolClassCode??null;
  let schoolGrade=derived?.schoolGrade??null;
  let schoolClassName=derived?.schoolClassName||'';

  // 生年月日から学年が出せない場合だけ、全体の氏名検索から学校区分を補完。
  let base=null;
  if(schoolClassCode==null||schoolGrade==null){
    const overall=await safeFetchJasfRankingPage(player,stroke,distance,course,year,'99','99',target,1);
    base=overall.find(x=>jasfSameSwimmer(x,player,athleteIds))||null;
    if(!base)return {rows:overall,matched:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'not_listed'};
    const apiSchool=jasfSchoolInfo(base);
    schoolClassCode=String(apiSchool.schoolClassCode)!=='99'?apiSchool.schoolClassCode:null;
    schoolGrade=String(apiSchool.schoolGrade)!=='99'?apiSchool.schoolGrade:null;
    schoolClassName=apiSchool.schoolClassName||'';
  }
  if(schoolClassCode==null||schoolGrade==null){
    return {rows:[],matched:base?[base]:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'grade_unavailable'};
  }

  const named=await safeFetchJasfRankingPage(player,stroke,distance,course,year,schoolClassCode,schoolGrade,target,1);
  let self=named.find(x=>jasfSameSwimmer(x,player,athleteIds))||null;

  // 表記ゆれ対策として、見つからない場合だけ全体氏名検索を1回補助的に使う。
  if(!self){
    const overall=await safeFetchJasfRankingPage(player,stroke,distance,course,year,'99','99',target,1);
    base=overall.find(x=>jasfSameSwimmer(x,player,athleteIds))||null;
    if(base){
      const apiSchool=jasfSchoolInfo(base);
      const sc=String(apiSchool.schoolClassCode)!=='99'?apiSchool.schoolClassCode:schoolClassCode;
      const sg=String(apiSchool.schoolGrade)!=='99'?apiSchool.schoolGrade:schoolGrade;
      const retry=await safeFetchJasfRankingPage(player,stroke,distance,course,year,sc,sg,target,1);
      self=retry.find(x=>jasfSameSwimmer(x,player,athleteIds))||null;
      if(self){schoolClassCode=sc;schoolGrade=sg;schoolClassName=apiSchool.schoolClassName||schoolClassName;}
    }
  }
  if(!self){
    return {rows:named,matched:base?[base]:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'not_listed'};
  }

  const gradeRank=Number(self?.ranking??self?.ranking_in_overall??0)||null;
  const pi=jasfPrefInfo(self);
  let prefRank=null;
  let prefStatus=(pi.code!==''||pi.name)?'pending':'pref_unknown';

  // 都道府県順位は全国順位とは独立して計算。
  // 本人の全国同学年順位までに必要なページだけ取得する（最大40ページ=約2000位まで）。
  // それより下位でも全国順位は表示し、県順位だけ「取得待ち」にする。
  if((pi.code!==''||pi.name) && gradeRank){
    const pageSize=50;
    const neededPages=Math.max(1,Math.ceil(gradeRank/pageSize));
    const maxPrefPages=40;
    const pagesToFetch=Math.min(neededPages,maxPrefPages);
    let samePrefCount=0;
    let reachedSelf=false;

    // 県順位の通信だけ失敗しても、ここまで取得済みの全国順位は必ず返す。
    try{
      for(let page=1;page<=pagesToFetch;page++){
        const rows=await safeFetchJasfRankingPage(player,stroke,distance,course,year,schoolClassCode,schoolGrade,'',page);
        if(!rows.length)break;
        for(const row of rows){
          const rr=Number(row?.ranking??row?.ranking_in_overall??0)||0;
          if(rr && rr>gradeRank){reachedSelf=true;break;}
          const rpi=jasfPrefInfo(row);
          const samePref=pi.code!=='' ? String(rpi.code)===String(pi.code) : (!!pi.name&&rpi.name===pi.name);
          if(samePref)samePrefCount++;
          if(jasfSameSwimmer(row,player,athleteIds)){reachedSelf=true;break;}
        }
        if(reachedSelf)break;
        if(rows.length<pageSize)break;
        await jasfSleep(650);
      }
      if(reachedSelf && samePrefCount>0){
        prefRank=samePrefCount;
        prefStatus='found';
      }else if(neededPages>maxPrefPages){
        prefStatus='too_deep';
      }else{
        prefStatus='not_found';
      }
    }catch(prefError){
      console.warn('都道府県順位取得失敗（全国順位は保持）',player?.name,stroke,distance,course,prefError);
      prefStatus='error';
    }
  }

  return {
    rows:named,matched:base?[base]:[self],gradeMatched:[self],
    gradeRank,prefRank,prefName:pi.name||'',
    schoolClassName,schoolGrade,
    gradeLabel:derived?.label||`${schoolClassName}${schoolGrade}年`,
    status:'found',prefStatus
  };
}

    box.innerHTML=`<div class="result good"><b>✅ 同学年ランキングを更新しました</b><br><span class="small">${year}年度 ／ ${found}/${results.length}種目で同学年順位を確認</span></div><div class="result" style="margin-top:10px">${rows}</div>`;
  }

}

function rankingCacheSnapshot(year=2026){

    const key=nationalRankCacheKey(p.id,r.stroke,r.distance,r.course,year);
    try{const raw=localStorage.getItem(key);if(raw)cache[key]=JSON.parse(raw);}catch(e){}
  }));
  return cache;
}
function applyRankingCacheSnapshot(cache){
  if(!cache||typeof cache!=='object')return;
  Object.entries(cache).forEach(([key,value])=>{
    if(!key.startsWith('nationalRank|'))return;
    try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}

}
async function loadSharedRankingBulkProgress(){

async function saveSharedRankingBulkProgress(v){

function sameGradeRankingSummaryHtml(year=2026,limit=30){

  return top.map((x,i)=>{
    const pref=x.c.prefRank?` ／ 🗻 ${x.c.prefName||'都道府県内'} ${x.c.prefRank}位`:'';

function rankingBestRecordsForPlayer(p){
  const mine=records.filter(r=>String(r.swimmer_id)===String(p.id)&&Number.isFinite(Number(r.time_seconds)));
  const best=new Map();
  mine.forEach(r=>{
    if(!jasfEventCodes(r.stroke,r.distance))return;
    const k=`${r.stroke}|${Number(r.distance)}|${r.course}`;
    const old=best.get(k);
    if(!old||Number(r.time_seconds)<Number(old.time_seconds))best.set(k,r);
  });
  return [...best.values()];
}

function rankingPlayerNeedsUpdate(p,year=2026){
  return rankingBestRecordsForPlayer(p).some(r=>{
    const c=getNationalRankCache(p.id,r.stroke,r.distance,r.course,year);
    return !c || c.error || (c.found && ['error','not_found','pending'].includes(c.prefStatus));
  });
}

function rankingFailedEvents(allTargets,year=2026){
  const failed=[];
  allTargets.forEach(p=>{
    rankingBestRecordsForPlayer(p).forEach(r=>{
      const c=getNationalRankCache(p.id,r.stroke,r.distance,r.course,year);
      if(c?.error || (c?.found && c?.prefStatus==='error')){
        failed.push({playerId:p.id,playerName:p.name,stroke:r.stroke,distance:r.distance,course:r.course});
      }
    });
  });
  return failed;
}

async function retryOneRankingEvent(item,year=2026){
  const p=playerById(item.playerId);
  if(!p)return false;
  try{
    const q=await fetchJasfRankingForPlayer(p,item.stroke,item.distance,item.course,year);
    const x=q.gradeMatched?.[0]||null;
    const previous=getNationalRankCache(item.playerId,item.stroke,item.distance,item.course,year)||{};
    const data=x?{
      ...previous,
      found:true,error:false,errorMessage:'',
      rank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||previous.rank||'-'),
      gradeRank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||previous.gradeRank||'-'),
      prefRank:q.prefRank||previous.prefRank||null,
      prefName:q.prefName||previous.prefName||'',
      prefStatus:q.prefStatus||previous.prefStatus||'pending',
      officialTime:x?.record?.record||x?.record||previous.officialTime||'-',
      swimmerCode:x?.swimmers?.swimmer_code||x?.swimmer_code||previous.swimmerCode||'-',
      updatedAt:new Date().toISOString()
    }:{
      ...previous,found:false,error:false,errorMessage:'',
      status:q?.status||'not_listed',updatedAt:new Date().toISOString()
    };
    setNationalRankCache(item.playerId,item.stroke,item.distance,item.course,data,year);
    return true;
  }catch(e){
    const previous=getNationalRankCache(item.playerId,item.stroke,item.distance,item.course,year)||{};
    // すでに全国順位がある場合は絶対に消さない。
    const data=previous.found
      ? {...previous,error:false,prefStatus:'error',updatedAt:new Date().toISOString()}
      : {...previous,found:false,error:true,errorMessage:String(e?.message||e),updatedAt:new Date().toISOString()};
    setNationalRankCache(item.playerId,item.stroke,item.distance,item.course,data,year);
    return false;
  }
}

async function updateAllPlayersSameGradeRankings(){
  const box=$('#allPlayersRankingUpdateBox');
  const allTargets=PLAYERS.filter(p=>jasfAthleteIds(p).length>0);
  if(!allTargets.length){
    if(box)box.innerHTML='<div class="notice">競技者IDが登録されている選手がいません。</div>';
    return;
  }

  const btn=$('#allPlayersRankingUpdateBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ 更新中…';}

  const signature=allTargets.map(p=>String(p.id)).join('|');
  let progress=await loadSharedRankingBulkProgress();
  if(!progress || progress.signature!==signature || progress.completed){
    progress={signature,phase:'first',index:0,retryIndex:0,completed:false,startedAt:new Date().toISOString()};
    progress=await saveSharedRankingBulkProgress(progress);
  }

  try{
    // 第1段階：エラーを追いかけず、とにかく全選手を最後まで一巡する。
    if(progress.phase==='first'){
      while(progress.index<allTargets.length){
        const p=allTargets[progress.index];
        if(box)box.innerHTML=`<div class="notice">🏊 第1段階：全${allTargets.length}名を最後まで更新中…<br><b>${progress.index} / ${allTargets.length}名</b> 完了<br><span class="small">通信エラーはここでは追いかけず、最後にまとめて再試行します。1種目ごとに保存します。</span></div>`;

        try{
          if(rankingPlayerNeedsUpdate(p,2026)){
            await updatePlayerSameGradeRankings(p.id,{skipCached:true,silent:true});
          }
        }catch(e){
          console.warn('第1段階ランキング更新:',p?.name,e);
        }

        progress.index++;
        progress=await saveSharedRankingBulkProgress(progress);
        if(box)box.innerHTML=`<div class="notice">🏊 第1段階：全選手を一巡中…<br><b>${progress.index} / ${allTargets.length}名</b>　${p.name} まで保存済み</div>`;
        await jasfSleep(900);
      }

      progress.phase='retry';
      progress.retryIndex=0;
      progress=await saveSharedRankingBulkProgress(progress);
    }

    // 第2段階：第1段階で通信エラーになった種目だけ再試行。
    if(progress.phase==='retry'){
      const failed=rankingFailedEvents(allTargets,2026);
      if(!failed.length){
        progress.phase='done';
      }else{
        while(progress.retryIndex<failed.length){
          const item=failed[progress.retryIndex];
          if(box)box.innerHTML=`<div class="notice">🔁 第2段階：通信エラーの種目だけ再試行中…<br><b>${progress.retryIndex} / ${failed.length}種目</b><br><span class="small">${item.playerName} ／ ${item.stroke} ${item.distance}m ${item.course}</span></div>`;

          await retryOneRankingEvent(item,2026);
          progress.retryIndex++;
          progress=await saveSharedRankingBulkProgress(progress);
          await jasfSleep(1800);
        }
        progress.phase='done';
      }
    }

    progress.completed=true;
    progress.finishedAt=new Date().toISOString();
    progress=await saveSharedRankingBulkProgress(progress);

    const remaining=rankingFailedEvents(allTargets,2026);
    renderAnalysis();
    const finalBox=$('#allPlayersRankingUpdateBox');
    if(finalBox){
      finalBox.innerHTML=remaining.length
        ? `<div class="result"><b>✅ 全${allTargets.length}名の一巡と再試行が完了しました</b><br><span class="small">残り ${remaining.length}種目は通信状況により未取得です。取得済みの全国順位・県順位は保持されています。もう一度押すと未取得分だけ再試行できます。</span></div>`
        : `<div class="result good"><b>✅ 全${allTargets.length}名の同学年ランキング更新が完了しました</b><br><span class="small">全国順位と都道府県内順位を保存しました。</span></div>`;
    }
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🏆 全選手の同学年ランキングを一括更新';}
  }
}

let screenshotOcrReady=false, screenshotRows=[], screenshotEvent={stroke:'',distance:null,course:'長水路'};
async function ensureTesseract(){
  if(window.Tesseract){screenshotOcrReady=true;return;}

  await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);});
  screenshotOcrReady=true;

function normalizeOcrText(t){return String(t||'').replace(/[：]/g,':').replace(/[。]/g,'.').replace(/\s+/g,' ').trim();}
function fixShotTime(time,distance){
  let x=normalizeOcrText(time);
  // OCRで 1:19.90 → 19.90 のように分が落ちるケースを安全側で補正
  if(Number(distance)>=100 && /^\d{1,2}\.\d{2}$/.test(x)){
    const v=Number(x); if(Number.isFinite(v) && v<20) x='1:'+x.padStart(5,'0');
  }
  return x;
}
function detectShotEvent(text){
  const t=normalizeOcrText(text);
  const aliases={
    '個人メドレー':['個人メドレー','個メ'],
    '自由形':['自由形','フリー'],
    '背泳ぎ':['背泳ぎ','背泳','バック'],
    '平泳ぎ':['平泳ぎ','平泳','ブレ'],
    'バタフライ':['バタフライ','バッタ','Fly','FLY']
  };
  // 種目名と距離が近接している表記を最優先。画面内の別種目名の混入に引っ張られにくくする。
  for(const [stroke,names] of Object.entries(aliases)){
    for(const name of names){
      const esc=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      let m=t.match(new RegExp(`(50|100|200|400|800|1500)\\s*m?\\s*${esc}`,'i'));
      if(m)return {stroke,distance:Number(m[1])};
      m=t.match(new RegExp(`${esc}\\s*(50|100|200|400|800|1500)\\s*m?`,'i'));
      if(m)return {stroke,distance:Number(m[1])};
    }
  }
  // 近接表記が無い場合は誤判定を避け、保存前の共通種目指定を使う。
  return {stroke:'',distance:null};
}
function parseShotRows(text){
  const event=detectShotEvent(text); screenshotEvent={stroke:event.stroke||'',distance:event.distance||null,course:'長水路'}; const lines=String(text||'').split(/\n+/).map(normalizeOcrText).filter(Boolean); const out=[];
  const timeRe=/(\d{1,2}:\d{2}\.\d{1,2}|\d{2,3}\.\d{1,2})/;
  for(const line of lines){
    const tm=line.match(timeRe); if(!tm)continue; const time=tm[1];
    if(/\[/.test(line)&&line.indexOf('[')<line.indexOf(time))continue;
    let before=line.slice(0,line.indexOf(time)).replace(/^\s*\d+\s*/,'').trim();
    before=before.replace(/[★☆].*$/,'').trim();
    const player=PLAYERS.find(p=>{const n=String(p.name||'').replace(/[ 　]/g,'');const b=before.replace(/[ 　]/g,'');return n&&b.includes(n);});
    let name=player?.name||before.replace(/\([^)]*\).*$/,'').replace(/（[^）]*）.*$/,'').trim();
    if(!name||name.length>24)continue;
    const fixedTime=fixShotTime(time,event.distance);
    out.push({playerId:player?.id||'',name,time:fixedTime,stroke:event.stroke,distance:event.distance,course:'長水路',save:!!player});
  }
  return out;
}

async function analyzeScreenshot(){

  try{await ensureTesseract(); const box=$('#screenshotStatus'); box.innerHTML='<div class="notice">🔎 スクリーンショットを解析中… 端末によって30秒ほどかかる場合があります。</div>';
    const result=await Tesseract.recognize(file,'jpn+eng',{logger:m=>{if(box&&m.status==='recognizing text')box.innerHTML=`<div class="notice">🔎 文字認識中… ${Math.round((m.progress||0)*100)}%</div>`;}});

  }catch(e){$('#screenshotStatus').innerHTML=`<div class="error">解析に失敗しました：${String(e.message||e)}</div>`;}

async function saveScreenshotRows(){
  // 画面に現在表示されている値を保存直前に直接読み直す。
  // OCR内部値とSafari/iPhoneのselect表示がずれても、画面の選択内容を正として保存する。
  document.querySelectorAll('.shotTable tbody tr').forEach((tr,i)=>{
    const r=screenshotRows[i]; if(!r)return;
    const check=tr.querySelector('.shotSaveCheck');
    const selects=tr.querySelectorAll('select');
    const inputs=tr.querySelectorAll('input');
    r.save=!!check?.checked;
    if(selects[0]){r.playerId=selects[0].value; r.name=selects[0].options[selects[0].selectedIndex]?.text||r.name;}
    if(selects[1])r.stroke=selects[1].value;
    if(selects[2])r.course=selects[2].value;
    const distanceInput=[...inputs].find(el=>el.type==='number');
    const timeInput=[...inputs].find(el=>el.type!=='checkbox'&&el.type!=='number');
    if(distanceInput)r.distance=Number(distanceInput.value);
    if(timeInput)r.time=fixShotTime(timeInput.value,r.distance);
  });
  const checked=screenshotRows.filter(r=>r.save);
  if(!checked.length){alert('保存する記録にチェックを入れてください。');return;}
  // 1画面＝同一種目。上部の共通指定を保存時の最優先値にする。
  const commonStroke=$('#shotCommonStroke')?.value||screenshotEvent.stroke||'';
  const commonDistance=Number($('#shotCommonDistance')?.value||screenshotEvent.distance)||null;
  const commonCourse=$('#shotCommonCourse')?.value||screenshotEvent.course||'長水路';
  checked.forEach(r=>{r.stroke=commonStroke;r.distance=commonDistance;r.course=commonCourse;r.time=fixShotTime(r.time,commonDistance);});

  // OCRで一部行だけ距離・種目が空欄になった場合、同じスクショ内の他行から補完する。
  // Swim Record Mobile は1画面＝同一種目なので、この補完が安全に使える。
  const knownDistances=screenshotRows.map(r=>Number(r.distance)).filter(v=>Number.isFinite(v)&&v>0);
  const fallbackDistance=knownDistances.length ? knownDistances.sort((a,b)=>knownDistances.filter(x=>x===b).length-knownDistances.filter(x=>x===a).length)[0] : null;
  const knownStrokes=screenshotRows.map(r=>r.stroke).filter(Boolean);
  const fallbackStroke=knownStrokes.length ? knownStrokes.sort((a,b)=>knownStrokes.filter(x=>x===b).length-knownStrokes.filter(x=>x===a).length)[0] : '';
  checked.forEach(r=>{
    if(!r.distance && fallbackDistance) r.distance=fallbackDistance;
    if(!r.stroke && fallbackStroke) r.stroke=fallbackStroke;
    if(!r.course) r.course='長水路';
    r.time=fixShotTime(r.time,r.distance);
  });
  renderScreenshotRows();

  const invalid=checked.filter(r=>!r.playerId||!Number.isFinite(sec(r.time))||!r.stroke||!r.distance);
  if(invalid.length){
    const details=invalid.map(r=>{const miss=[];if(!r.playerId)miss.push('選手');if(!r.stroke)miss.push('種目');if(!r.distance)miss.push('距離');if(!Number.isFinite(sec(r.time)))miss.push('タイム');return `${r.name||'選択中の記録'}：${miss.join('・')}`;}).join('\n');
    alert(`保存できない項目があります。\n${details}`);return;
  }
  const rows=checked.map(r=>({...r,time:fixShotTime(r.time,r.distance)}));
  if(!confirm(`${rows.length}件をタイム管理Cloudへ保存します。よろしいですか？`))return;
  const today=new Date().toISOString().slice(0,10); let saved=0, skippedDuplicate=0;
  await loadCloud();
  for(const r of rows){const timeSeconds=sec(r.time); const meet=joMeetInfo(today); const st=standard(r.playerId,r.stroke,r.distance,r.course,meet?.date||null); const currentBest=best(r.playerId,r.stroke,r.distance,r.course); const isBest=currentBest==null||timeSeconds<Number(currentBest)-0.001;
    if(isBest&&currentBest!=null)await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',r.playerId).eq('stroke',r.stroke).eq('distance',r.distance).eq('course',r.course).eq('is_personal_best',true);
    const payload={swimmer_id:r.playerId,stroke:r.stroke,distance:r.distance,course:r.course,time_seconds:timeSeconds,meet_name:'大会速報スクリーンショット',record_date:today,memo:'📱速報 / スクリーンショット解析から登録 / 日本水泳連盟公式記録取得時に自動置換',is_personal_best:isBest,is_jo_qualified:st!=null&&timeSeconds<=st}; const existing=records.find(x=>recordExactKey(x)===recordExactKey(payload)); if(existing){ if(recordSourcePriority(existing)>=recordSourcePriority(payload)){skippedDuplicate++;continue;} const {error:delDupErr}=await sb.from('swim_records').delete().eq('id',existing.id); if(delDupErr){alert('重複整理エラー：'+delDupErr.message);return;} records=records.filter(x=>String(x.id)!==String(existing.id)); } const {data:inserted,error}=await sb.from('swim_records').insert(payload).select('id,swimmer_id,stroke,distance,course,time_seconds').single(); if(error){alert('保存エラー：'+error.message);return;} if(!inserted?.id){alert('保存確認に失敗しました。データベースへの追加を確認できませんでした。');return;} saved++;}
  await loadCloud();renderHome();renderPlayers();renderAnalysis();const savedPlayerIds=[...new Set(rows.map(r=>r.playerId).filter(Boolean))];if(savedPlayerIds.length===1){showPlayerDetail(savedPlayerIds[0]);}alert(`${saved}件を保存しました！${skippedDuplicate?`\n完全一致の重複 ${skippedDuplicate}件は保存しませんでした。`:''}\nデータベースへの保存確認も完了しました。`);
}

function renderAnalysis(){
  let jo=records.filter(r=>r.is_jo_qualified).length;
  let bestRecords=records.filter(r=>r.is_personal_best).length;

  let counts={};
  records.forEach(r=>{
    counts[r.swimmer_id]=(counts[r.swimmer_id]||0)+1;
  });

  let ranking=Object.entries(counts)
    .sort((a,b)=>b[1]-a[1]);

  // JOに近い選手・種目ランキングを作成

  let joBestMap={};
  const rankingToday=new Date().toISOString().slice(0,10);
  const rankingMeet=joMeetInfo(rankingToday);
  const rankingMeetDate=rankingMeet?.date||null;

  records.forEach(r=>{
    let player=playerById(r.swimmer_id);
    if(!player)return;

    let st=standard(
      r.swimmer_id,

      r.distance,
      r.course,

    if(st==null)return;

    if(!Number.isFinite(time) || time<=0)return;

    let key=`${r.swimmer_id}|${r.stroke}|${r.distance}|${r.course}`;

    if(!joBestMap[key] || time<joBestMap[key].time){
      joBestMap[key]={
        player,
        stroke:r.stroke,

let joRanking=Object.values(
  Object.values(joBestMap).reduce((best,x)=>{
    const id=String(x.player.id);

        ...x,
        swimmer_id:x.player.id,
        rate:rate,
        diff:x.time-x.standard,
        qualified:x.time<=x.standard
      };
    }

    return best;
  },{})

}).slice(0,30);

  let joRankingHtml=joRanking.length

      }).join('')
    : '<p class="muted">JO標準と比較できる記録がまだありません。</p>';


  // 東京SC招待・ゆめカップ突破者（複数種目をすべて表示）
  function buildQualifiers(kind){
    const map={};
    records.forEach(r=>{

      const st=info.standard; if(st==null||time>st)return;
      // ゆめカップは長短同一標準なので、水路をまたいで同一種目の最速記録だけを表示。
      const key=kind==='yume'?`${r.swimmer_id}|${r.stroke}|${r.distance}`:`${r.swimmer_id}|${r.stroke}|${r.distance}|${r.course}`;
      if(!map[key]||time<map[key].time)map[key]={player:p,stroke:r.stroke,distance:r.distance,course:r.course,time,standard:st,info};
    });
    return Object.values(map).sort((a,b)=>a.player.name.localeCompare(b.player.name,'ja')||a.stroke.localeCompare(b.stroke,'ja')||a.distance-b.distance);
  }
  const tokyoQual=buildQualifiers('tokyo'),yumeQual=buildQualifiers('yume');
  const tokyoQualifiedPlayers=new Set(tokyoQual.map(x=>String(x.player.id))).size;
  const yumeQualifiedPlayers=new Set(yumeQual.map(x=>String(x.player.id))).size;
  function qualifierHtml(items,kind){
    if(!items.length)return '<p class="muted">現在、突破記録はありません。</p>';

    return items.map(x=>{
      const head=last!==String(x.player.id)?`<div style="margin-top:12px"><b>🏊 ${x.player.name}</b></div>`:''; last=String(x.player.id);
      const sub=kind==='yume'?`${x.info.grade}・${x.info.division}区分`:`基準日年齢 ${x.info.age!=null?x.info.age+'歳':x.info.ageKey||'-'}`;
      return `${head}<div class="row"><div><span>${x.stroke} ${x.distance}m・${x.course}</span><br><span class="muted">${sub}</span></div><div style="text-align:right"><b>🏆 ${fmt(x.time)}</b><br><span class="muted">標準 ${fmt(x.standard)}</span></div></div>`;
    }).join('');
  }

  $('#analysis').innerHTML=`
    <div class="grid">
      <div class="card">
        <div class="label">記録件数</div>

      </div>

        <div class="label">🗼 東京SC招待 突破者数</div>
        <div class="stat">${tokyoQualifiedPlayers}<span class="small">名</span></div>
        <div class="muted small">延べ ${tokyoQual.length}種目</div>
      </div>

      <div class="card" role="button" tabindex="0" onclick="document.getElementById('yume-qualifiers')?.scrollIntoView({behavior:'smooth',block:'start'})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('yume-qualifiers')?.scrollIntoView({behavior:'smooth',block:'start'})}" style="cursor:pointer">
        <div class="label">🌈 ゆめカップ2027（予定） 突破者数</div>
        <div class="stat">${yumeQualifiedPlayers}<span class="small">名</span></div>
        <div class="muted small">延べ ${yumeQual.length}種目</div>
      </div>

      <div class="card">
        <div class="label">ベスト更新</div>
        <div class="stat">${bestRecords}</div>

    </div>

    ${screenshotAnalysisCard()}

    <div class="card">

    </div>

    <div class="card">

      <p class="muted">

async function migrateLocalV3(){
  let old=[];
  try{
    old=JSON.parse(localStorage.getItem('swimCoachRecordsV3')||'[]');
  }catch{}

  if(!old.length){
    alert('この端末に旧v3記録はありません。');
    return;
  }

  let byName=Object.fromEntries(PLAYERS.map(p=>[p.name,p]));
  let payload=[];
  let skipped=0;

  for(let r of old){
    let p=byName[r.player];
    if(!p)continue;

    let candidate={
      swimmer_id:p.id,
      stroke:r.event,
      distance:parseInt(r.distance),
      course:r.pool,
      time_seconds:+r.seconds,
      meet_name:r.memo||null,
      record_date:r.date||new Date().toISOString().slice(0,10),
      memo:null,
      is_personal_best:!!r.isBest,
      is_jo_qualified:!!r.jo
    };

    let duplicate=records.some(x=>
      x.swimmer_id===candidate.swimmer_id &&
      x.stroke===candidate.stroke &&
      Number(x.distance)===Number(candidate.distance) &&
      x.course===candidate.course &&
      Math.abs(Number(x.time_seconds)-Number(candidate.time_seconds))<0.001 &&
      x.record_date===candidate.record_date
    );

    if(duplicate){
      skipped++;
    }else{
      payload.push(candidate);
    }
  }

  if(!payload.length){
    alert(
      skipped
        ? `移行対象はすべて登録済みです。（重複 ${skipped}件をスキップ）`
        : '選手名が一致する旧記録がありません。'
    );
    return;
  }

  let {error}=await sb.from('swim_records').insert(payload);

  if(error){
    alert(error.message);
    return;
  }

  await loadCloud();

  alert(
    `${payload.length}件をクラウドへ移行しました。` +
    (skipped ? `\n重複 ${skipped}件はスキップしました。` : '')
  );

  renderAnalysis();
  renderHome();
}

const APP_BUILD_VERSION='20261005-1220';
let __versionCheckBusy=false;
async function checkForAppUpdate(){
  if(__versionCheckBusy||!navigator.onLine)return;
  __versionCheckBusy=true;
  try{
    const base=location.href.split('#')[0].split('?')[0];
    const res=await fetch(base+'?__version_check='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/APP_BUILD_VERSION=['\"]([^'\"]+)/);
    if(m&&m[1]!==APP_BUILD_VERSION){
      const u=new URL(location.href);
      u.searchParams.set('v',m[1]);
      location.replace(u.toString());
    }
  }catch(e){console.log('version check skipped',e)}
  finally{__versionCheckBusy=false}
}
