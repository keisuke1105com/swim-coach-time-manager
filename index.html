}

function rankingBestRecordsForPlayer(p){
  const mine=records.filter(r=>String(r.swimmer_id)===String(p.id)&&Number.isFinite(Number(r.time_seconds)));
  const best=new Map();
  mine.forEach(r=>{
    if(!jasfEventCodes(r.stroke,r.distance))return;
    const k=`${r.stroke}|${Number(r.distance)}|${r.course}`;
    const old=best.get(k);
    if(!old||Number(r.time_seconds)<Number(old.time_seconds))best.set(k,r);
  });
  return [...best.values()];
}

function rankingPlayerNeedsUpdate(p,year=2026){
  return rankingBestRecordsForPlayer(p).some(r=>{
    const c=getNationalRankCache(p.id,r.stroke,r.distance,r.course,year);
    return !c || c.error || (c.found && ['error','not_found','pending'].includes(c.prefStatus));
  });
}

function rankingFailedEvents(allTargets,year=2026){
  const failed=[];
  allTargets.forEach(p=>{
    rankingBestRecordsForPlayer(p).forEach(r=>{
      const c=getNationalRankCache(p.id,r.stroke,r.distance,r.course,year);
      if(c?.error || (c?.found && c?.prefStatus==='error')){
        failed.push({playerId:p.id,playerName:p.name,stroke:r.stroke,distance:r.distance,course:r.course});
      }
    });
  });
  return failed;
}

async function retryOneRankingEvent(item,year=2026){
  const p=playerById(item.playerId);
  if(!p)return false;
  try{
    const q=await fetchJasfRankingForPlayer(p,item.stroke,item.distance,item.course,year);
    const x=q.gradeMatched?.[0]||null;
    const previous=getNationalRankCache(item.playerId,item.stroke,item.distance,item.course,year)||{};
    const data=x?{
      ...previous,
      found:true,error:false,errorMessage:'',
      rank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||previous.rank||'-'),
      gradeRank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||previous.gradeRank||'-'),
      prefRank:q.prefRank??null,
      prefName:q.prefName||'',
      prefStatus:q.prefStatus||'pref_unknown',
      officialTime:x?.record?.record||x?.record||previous.officialTime||'-',
      swimmerCode:x?.swimmers?.swimmer_code||x?.swimmer_code||previous.swimmerCode||'-',
      updatedAt:new Date().toISOString()
    }:{
      ...previous,found:false,error:false,errorMessage:'',
      status:q?.status||'not_listed',updatedAt:new Date().toISOString()
    };
    setNationalRankCache(item.playerId,item.stroke,item.distance,item.course,data,year);
    return true;
  }catch(e){
    const previous=getNationalRankCache(item.playerId,item.stroke,item.distance,item.course,year)||{};
    // すでに全国順位がある場合は絶対に消さない。
    const data=previous.found
      ? {...previous,error:false,prefStatus:'error',updatedAt:new Date().toISOString()}
      : {...previous,found:false,error:true,errorMessage:String(e?.message||e),updatedAt:new Date().toISOString()};
    setNationalRankCache(item.playerId,item.stroke,item.distance,item.course,data,year);
    return false;
  }
}

async function updateAllPlayersSameGradeRankings(){
  const box=$('#allPlayersRankingUpdateBox');
  const allTargets=PLAYERS.filter(p=>jasfAthleteIds(p).length>0);
  if(!allTargets.length){
    if(box)box.innerHTML='<div class="notice">競技者IDが登録されている選手がいません。</div>';
    return;
  }

  const btn=$('#allPlayersRankingUpdateBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ 更新中…';}

  const signature=allTargets.map(p=>String(p.id)).join('|');
  let progress=await loadSharedRankingBulkProgress();
  if(!progress || progress.signature!==signature || progress.completed){
    progress={signature,phase:'first',index:0,retryIndex:0,completed:false,startedAt:new Date().toISOString()};
    progress=await saveSharedRankingBulkProgress(progress);
  }

  try{
    // 第1段階：エラーを追いかけず、とにかく全選手を最後まで一巡する。
    if(progress.phase==='first'){
      while(progress.index<allTargets.length){
        const p=allTargets[progress.index];
        if(box)box.innerHTML=`<div class="notice">🏊 第1段階：全${allTargets.length}名を最後まで更新中…<br><b>${progress.index} / ${allTargets.length}名</b> 完了<br><span class="small">通信エラーはここでは追いかけず、最後にまとめて再試行します。1種目ごとに保存します。</span></div>`;

        try{
          if(rankingPlayerNeedsUpdate(p,2026)){
            await updatePlayerSameGradeRankings(p.id,{skipCached:true,silent:true});
          }
        }catch(e){
          console.warn('第1段階ランキング更新:',p?.name,e);
        }

        progress.index++;
        progress=await saveSharedRankingBulkProgress(progress);
        if(box)box.innerHTML=`<div class="notice">🏊 第1段階：全選手を一巡中…<br><b>${progress.index} / ${allTargets.length}名</b>　${p.name} まで保存済み</div>`;
        await jasfSleep(900);
      }

      progress.phase='retry';
      progress.retryIndex=0;
      progress=await saveSharedRankingBulkProgress(progress);
    }

    // 第2段階：第1段階で通信エラーになった種目だけ再試行。
    if(progress.phase==='retry'){
      const failed=rankingFailedEvents(allTargets,2026);
      if(!failed.length){
        progress.phase='done';
      }else{
        while(progress.retryIndex<failed.length){
          const item=failed[progress.retryIndex];
          if(box)box.innerHTML=`<div class="notice">🔁 第2段階：通信エラーの種目だけ再試行中…<br><b>${progress.retryIndex} / ${failed.length}種目</b><br><span class="small">${item.playerName} ／ ${item.stroke} ${item.distance}m ${item.course}</span></div>`;

          await retryOneRankingEvent(item,2026);
          progress.retryIndex++;
          progress=await saveSharedRankingBulkProgress(progress);
          await jasfSleep(1800);
        }
        progress.phase='done';
      }
    }

    progress.completed=true;
    progress.finishedAt=new Date().toISOString();
    progress=await saveSharedRankingBulkProgress(progress);

    const remaining=rankingFailedEvents(allTargets,2026);
    renderAnalysis();
    const finalBox=$('#allPlayersRankingUpdateBox');
    if(finalBox){
      finalBox.innerHTML=remaining.length
        ? `<div class="result"><b>✅ 全${allTargets.length}名の一巡と再試行が完了しました</b><br><span class="small">残り ${remaining.length}種目は通信状況により未取得です。取得済みの全国順位・県順位は保持されています。もう一度押すと未取得分だけ再試行できます。</span></div>`
        : `<div class="result good"><b>✅ 全${allTargets.length}名の同学年ランキング更新が完了しました</b><br><span class="small">全国順位と都道府県内順位を保存しました。</span></div>`;
    }
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🏆 全選手の同学年ランキングを一括更新';}
  }
}



// 大会速報スクリーンショット解析（端末内OCR）
let screenshotOcrReady=false, screenshotRows=[], screenshotEvent={stroke:'',distance:null,course:'長水路'};
async function ensureTesseract(){
  if(window.Tesseract){screenshotOcrReady=true;return;}
  const box=$('#screenshotStatus'); if(box)box.innerHTML='<div class="notice">文字認識機能を読み込み中…</div>';
  await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);});
  screenshotOcrReady=true;
}
function normalizeOcrText(t){return String(t||'').replace(/[：]/g,':').replace(/[。]/g,'.').replace(/\s+/g,' ').trim();}
function fixShotTime(time,distance){
  let x=normalizeOcrText(time);
  // OCRで 1:19.90 → 19.90 のように分が落ちるケースを安全側で補正
  if(Number(distance)>=100 && /^\d{1,2}\.\d{2}$/.test(x)){
    const v=Number(x); if(Number.isFinite(v) && v<20) x='1:'+x.padStart(5,'0');
  }
  return x;
}
function detectShotEvent(text){
  const t=normalizeOcrText(text);
  const aliases={
    '個人メドレー':['個人メドレー','個メ'],
    '自由形':['自由形','フリー'],
    '背泳ぎ':['背泳ぎ','背泳','バック'],
    '平泳ぎ':['平泳ぎ','平泳','ブレ'],
    'バタフライ':['バタフライ','バッタ','Fly','FLY']
  };
  // 種目名と距離が近接している表記を最優先。画面内の別種目名の混入に引っ張られにくくする。
  for(const [stroke,names] of Object.entries(aliases)){
    for(const name of names){
      const esc=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      let m=t.match(new RegExp(`(50|100|200|400|800|1500)\\s*m?\\s*${esc}`,'i'));
      if(m)return {stroke,distance:Number(m[1])};
      m=t.match(new RegExp(`${esc}\\s*(50|100|200|400|800|1500)\\s*m?`,'i'));
      if(m)return {stroke,distance:Number(m[1])};
    }
  }
  // 近接表記が無い場合は誤判定を避け、保存前の共通種目指定を使う。
  return {stroke:'',distance:null};
}
function parseShotRows(text){
  const event=detectShotEvent(text); screenshotEvent={stroke:event.stroke||'',distance:event.distance||null,course:'長水路'}; const lines=String(text||'').split(/\n+/).map(normalizeOcrText).filter(Boolean); const out=[];
  const timeRe=/(\d{1,2}:\d{2}\.\d{1,2}|\d{2,3}\.\d{1,2})/;
  for(const line of lines){
    const tm=line.match(timeRe); if(!tm)continue; const time=tm[1];
    if(/\[/.test(line)&&line.indexOf('[')<line.indexOf(time))continue;
    let before=line.slice(0,line.indexOf(time)).replace(/^\s*\d+\s*/,'').trim();
    before=before.replace(/[★☆].*$/,'').trim();
    const player=PLAYERS.find(p=>{const n=String(p.name||'').replace(/[ 　]/g,'');const b=before.replace(/[ 　]/g,'');return n&&b.includes(n);});
    let name=player?.name||before.replace(/\([^)]*\).*$/,'').replace(/（[^）]*）.*$/,'').trim();
    if(!name||name.length>24)continue;
    const fixedTime=fixShotTime(time,event.distance);
    out.push({playerId:player?.id||'',name,time:fixedTime,stroke:event.stroke,distance:event.distance,course:'長水路',save:!!player});
  }
  return out;
}
function applyScreenshotEvent(){
  const stroke=$('#shotCommonStroke')?.value||'';
  const distance=Number($('#shotCommonDistance')?.value)||null;
  const course=$('#shotCommonCourse')?.value||'長水路';
  screenshotEvent={stroke,distance,course};

  renderScreenshotRows();
}
function shotEvaluation(row){
  const p=playerById(row.playerId); const t=sec(row.time); if(!p||!Number.isFinite(t)||!row.stroke||!row.distance)return {html:'選手・種目を確認してください'};
  const meet=joMeetInfo(new Date().toISOString().slice(0,10)); const st=standard(p.id,row.stroke,row.distance,row.course,meet?.date||null);
  const tok=tokyoScInfo(p.id,row.stroke,row.distance).standard; const yum=yumeCupInfo(p.id,row.stroke,row.distance).standard;
  let parts=[];
  if(st!=null){const diff=t-st,rate=st/t*100;parts.push(diff<=0?`<span class="shotGood">🏆 JO突破 ${rate.toFixed(1)}%</span>`:`<span class="shotBad">JOまであと ${diff.toFixed(2)}秒 ${rate.toFixed(1)}%</span>`);}
  if(tok!=null)parts.push(t<=tok?'<span class="shotGood">🗼東京SC突破</span>':`東京SCまで ${(t-tok).toFixed(2)}秒`);
  if(yum!=null)parts.push(t<=yum?'<span class="shotGood">🌈ゆめカップ突破</span>':`ゆめまで ${(t-yum).toFixed(2)}秒`);
  return {html:parts.join(' ／ ')||'比較できる標準記録なし'};
}
function renderScreenshotRows(){
  const box=$('#screenshotResults'); if(!box)return;

async function saveScreenshotRows(){
  // 画面に現在表示されている値を保存直前に直接読み直す。
  // OCR内部値とSafari/iPhoneのselect表示がずれても、画面の選択内容を正として保存する。
  document.querySelectorAll('.shotTable tbody tr').forEach((tr,i)=>{
    const r=screenshotRows[i]; if(!r)return;
    const check=tr.querySelector('.shotSaveCheck');
    const selects=tr.querySelectorAll('select');
    const inputs=tr.querySelectorAll('input');
    r.save=!!check?.checked;
    if(selects[0]){r.playerId=selects[0].value; r.name=selects[0].options[selects[0].selectedIndex]?.text||r.name;}
    if(selects[1])r.stroke=selects[1].value;
    if(selects[2])r.course=selects[2].value;
    const distanceInput=[...inputs].find(el=>el.type==='number');
    const timeInput=[...inputs].find(el=>el.type!=='checkbox'&&el.type!=='number');
    if(distanceInput)r.distance=Number(distanceInput.value);
    if(timeInput)r.time=fixShotTime(timeInput.value,r.distance);
  });
  const checked=screenshotRows.filter(r=>r.save);
  if(!checked.length){alert('保存する記録にチェックを入れてください。');return;}
  // 1画面＝同一種目。上部の共通指定を保存時の最優先値にする。
  const commonStroke=$('#shotCommonStroke')?.value||screenshotEvent.stroke||'';
  const commonDistance=Number($('#shotCommonDistance')?.value||screenshotEvent.distance)||null;
  const commonCourse=$('#shotCommonCourse')?.value||screenshotEvent.course||'長水路';
  checked.forEach(r=>{r.stroke=commonStroke;r.distance=commonDistance;r.course=commonCourse;r.time=fixShotTime(r.time,commonDistance);});

  // OCRで一部行だけ距離・種目が空欄になった場合、同じスクショ内の他行から補完する。
  // Swim Record Mobile は1画面＝同一種目なので、この補完が安全に使える。
  const knownDistances=screenshotRows.map(r=>Number(r.distance)).filter(v=>Number.isFinite(v)&&v>0);
  const fallbackDistance=knownDistances.length ? knownDistances.sort((a,b)=>knownDistances.filter(x=>x===b).length-knownDistances.filter(x=>x===a).length)[0] : null;
  const knownStrokes=screenshotRows.map(r=>r.stroke).filter(Boolean);
  const fallbackStroke=knownStrokes.length ? knownStrokes.sort((a,b)=>knownStrokes.filter(x=>x===b).length-knownStrokes.filter(x=>x===a).length)[0] : '';
  checked.forEach(r=>{
    if(!r.distance && fallbackDistance) r.distance=fallbackDistance;
    if(!r.stroke && fallbackStroke) r.stroke=fallbackStroke;
    if(!r.course) r.course='長水路';
    r.time=fixShotTime(r.time,r.distance);
  });
  renderScreenshotRows();

  const invalid=checked.filter(r=>!r.playerId||!Number.isFinite(sec(r.time))||!r.stroke||!r.distance);
  if(invalid.length){
    const details=invalid.map(r=>{const miss=[];if(!r.playerId)miss.push('選手');if(!r.stroke)miss.push('種目');if(!r.distance)miss.push('距離');if(!Number.isFinite(sec(r.time)))miss.push('タイム');return `${r.name||'選択中の記録'}：${miss.join('・')}`;}).join('\n');
    alert(`保存できない項目があります。\n${details}`);return;
  }
  const rows=checked.map(r=>({...r,time:fixShotTime(r.time,r.distance)}));
  if(!confirm(`${rows.length}件をタイム管理Cloudへ保存します。よろしいですか？`))return;
  const today=new Date().toISOString().slice(0,10); let saved=0, skippedDuplicate=0;
  await loadCloud();
  for(const r of rows){const timeSeconds=sec(r.time); const meet=joMeetInfo(today); const st=standard(r.playerId,r.stroke,r.distance,r.course,meet?.date||null); const currentBest=best(r.playerId,r.stroke,r.distance,r.course); const isBest=currentBest==null||timeSeconds<Number(currentBest)-0.001;
    if(isBest&&currentBest!=null)await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',r.playerId).eq('stroke',r.stroke).eq('distance',r.distance).eq('course',r.course).eq('is_personal_best',true);
    const payload={swimmer_id:r.playerId,stroke:r.stroke,distance:r.distance,course:r.course,time_seconds:timeSeconds,meet_name:'大会速報スクリーンショット',record_date:today,memo:'📱速報 / スクリーンショット解析から登録 / 日本水泳連盟公式記録取得時に自動置換',is_personal_best:isBest,is_jo_qualified:st!=null&&timeSeconds<=st}; const existing=records.find(x=>recordExactKey(x)===recordExactKey(payload)); if(existing){ if(recordSourcePriority(existing)>=recordSourcePriority(payload)){skippedDuplicate++;continue;} const {error:delDupErr}=await sb.from('swim_records').delete().eq('id',existing.id); if(delDupErr){alert('重複整理エラー：'+delDupErr.message);return;} records=records.filter(x=>String(x.id)!==String(existing.id)); } const {data:inserted,error}=await sb.from('swim_records').insert(payload).select('id,swimmer_id,stroke,distance,course,time_seconds').single(); if(error){alert('保存エラー：'+error.message);return;} if(!inserted?.id){alert('保存確認に失敗しました。データベースへの追加を確認できませんでした。');return;} saved++;}
  await loadCloud();renderHome();renderPlayers();renderAnalysis();const savedPlayerIds=[...new Set(rows.map(r=>r.playerId).filter(Boolean))];if(savedPlayerIds.length===1){showPlayerDetail(savedPlayerIds[0]);}alert(`${saved}件を保存しました！${skippedDuplicate?`\n完全一致の重複 ${skippedDuplicate}件は保存しませんでした。`:''}\nデータベースへの保存確認も完了しました。`);
}

function renderAnalysis(){
  let jo=records.filter(r=>r.is_jo_qualified).length;
  let bestRecords=records.filter(r=>r.is_personal_best).length;

  let counts={};
  records.forEach(r=>{
    counts[r.swimmer_id]=(counts[r.swimmer_id]||0)+1;
  });

  let ranking=Object.entries(counts)
    .sort((a,b)=>b[1]-a[1]);

  // JOに近い選手・種目ランキングを作成
  // ランキングは記録日ではなく「今日から見た次のJO大会」の基準日で全選手を統一して比較する。
  // 例：2026/09/22 時点なら 2027年春季JO（基準日 2027/03/27）。
  let joBestMap={};
  const rankingToday=new Date().toISOString().slice(0,10);
  const rankingMeet=joMeetInfo(rankingToday);
  const rankingMeetDate=rankingMeet?.date||null;

  records.forEach(r=>{
    let player=playerById(r.swimmer_id);
    if(!player)return;

    let st=standard(
      r.swimmer_id,
      r.stroke,
      r.distance,
      r.course,
      rankingMeetDate
    );

    if(st==null)return;

    let time=Number(r.time_seconds);
    if(!Number.isFinite(time) || time<=0)return;

    let key=`${r.swimmer_id}|${r.stroke}|${r.distance}|${r.course}`;

    if(!joBestMap[key] || time<joBestMap[key].time){
      joBestMap[key]={
        player,
        stroke:r.stroke,
        distance:r.distance,
        course:r.course,
        time,
        standard:st
      };
    }
  });

let joRanking=Object.values(
  Object.values(joBestMap).reduce((best,x)=>{
    const id=String(x.player.id);
    const rate=(x.standard/x.time)*100;

    if(!best[id] || rate>best[id].rate){
      best[id]={
        ...x,
        swimmer_id:x.player.id,
        rate:rate,
        diff:x.time-x.standard,
        qualified:x.time<=x.standard
      };
    }

    return best;
  },{})
).sort((a,b)=>{
  // JO突破済みを先頭、その後は達成率が高い順
  if(a.qualified!==b.qualified){
    return a.qualified ? -1 : 1;
  }
  return b.rate-a.rate;
}).filter(x=>x.rate>=90).slice(0,20);

  let joRankingHtml=joRanking.length
    ? joRanking.map((x,i)=>{
        let medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}位`;

        let status=x.qualified
          ? `🏆 JO突破！ 達成率 ${x.rate.toFixed(1)}%`
          : `JOまであと ${x.diff.toFixed(2)}秒　達成率 ${x.rate.toFixed(1)}%`;

        return `
          <div class="row">
            <div>
              <b>${medal} ${x.player.name}</b><br>
              <span class="muted">
                ${x.stroke} ${x.distance}m・${x.course}
              </span><br>
              <span class="analysis-target">${x.qualified?'🏆 JO突破！':`JOまであと ${x.diff.toFixed(2)}秒`}</span><br><span class="muted small">達成率 ${x.rate.toFixed(1)}%</span>
            </div>

            <div style="text-align:right">
              <b>${fmt(x.time)}</b><br>
              <span class="muted">JO ${fmt(x.standard)}</span>
            </div>
          </div>
        `;
      }).join('')
    : '<p class="muted">JO標準と比較できる達成率90%以上の選手はまだいません。</p>';


  // 東京SC招待・ゆめカップ突破者（複数種目をすべて表示）
  function buildQualifiers(kind){
    const map={};
    records.forEach(r=>{
      const p=playerById(r.swimmer_id); if(!p)return;
      const time=Number(r.time_seconds); if(!Number.isFinite(time)||time<=0)return;
      if(kind==='yume' && r.record_date && r.record_date<YUME_CUP_VALID_FROM)return;
      const info=kind==='tokyo'?tokyoScInfo(r.swimmer_id,r.stroke,r.distance,TOKYO_SC_NEXT_MEET_DATE):yumeCupInfo(r.swimmer_id,r.stroke,r.distance);
      const st=info.standard; if(st==null||time>st)return;
      // ゆめカップは長短同一標準なので、水路をまたいで同一種目の最速記録だけを表示。
      const key=kind==='yume'?`${r.swimmer_id}|${r.stroke}|${r.distance}`:`${r.swimmer_id}|${r.stroke}|${r.distance}|${r.course}`;
      if(!map[key]||time<map[key].time)map[key]={player:p,stroke:r.stroke,distance:r.distance,course:r.course,time,standard:st,info};
    });
    return Object.values(map).sort((a,b)=>a.player.name.localeCompare(b.player.name,'ja')||a.stroke.localeCompare(b.stroke,'ja')||a.distance-b.distance);
  }
  function schoolGrade2026(player){
    if(!player?.birth_date)return null;
    const age=ageOnDate(player.birth_date,'2026-04-01');
    if(age==null)return null;
    const n=age-5;
    if(n===12)return '高3'; if(n===11)return '高2'; if(n===10)return '高1';
    if(n===9)return '中3'; if(n===8)return '中2'; if(n===7)return '中1';
    return null;
  }
  // 県強化の標準記録は10分の1秒単位。記録も10分の1秒へ切り捨てて判定する。
  // 例: 標準 1:06.0 は、記録 1:06.09 までを突破とする。
  const yamanashiTenth=value=>Math.floor((Number(value)+1e-9)*10);
  const meetsYamanashiStandard=(time,standard)=>
    Number.isFinite(Number(time))&&Number.isFinite(Number(standard))&&
    yamanashiTenth(time)<=yamanashiTenth(standard);
  const yamanashiGap=(time,standard)=>Math.max(0,(yamanashiTenth(time)-yamanashiTenth(standard))/10);
  const fmtYamanashiTenth=value=>{
    const seconds=yamanashiTenth(value)/10,minutes=Math.floor(seconds/60),rest=seconds-minutes*60;
    return minutes?`${minutes}:${rest.toFixed(1).padStart(4,'0')}`:rest.toFixed(1);
  };
  const yamanashiBestMap=new Map();
  records.forEach(r=>{
    const p=playerById(r.swimmer_id),time=Number(r.time_seconds);
    if(!p||!Number.isFinite(time)||time<=0)return;
    const key=`${r.swimmer_id}|${r.stroke}|${Number(r.distance)}|${r.course}`;
    const current=yamanashiBestMap.get(key);

  });
  const yamanashiQual=[];
  const yamanashiCandidates=[];
  yamanashiBestMap.forEach(best=>{
    const grade=schoolGrade2026(best.player),gender=String(best.player.gender||'').trim();
    if(!grade||!['男子','女子'].includes(gender))return;
    const standard=window.YAMANASHI_2026_STANDARDS.find(x=>x.gender===gender&&x.grade===grade&&x.stroke===best.stroke&&x.distance===best.distance&&x.course===best.course);
    if(standard&&Number.isFinite(standard.seconds)&&standard.seconds>0){
      const candidate={...best,grade,standard:standard.seconds};
      yamanashiCandidates.push(candidate);
      if(meetsYamanashiStandard(best.time,standard.seconds))yamanashiQual.push(candidate);
    }
  });
  yamanashiQual.sort((a,b)=>a.player.name.localeCompare(b.player.name,'ja')||a.stroke.localeCompare(b.stroke,'ja')||a.distance-b.distance||a.course.localeCompare(b.course,'ja'));
  const yamanashiQualifiedPlayers=new Set(yamanashiQual.map(x=>String(x.player.id))).size;
  const yamanashiUnknownPlayers=PLAYERS.filter(p=>!schoolGrade2026(p)||!['男子','女子'].includes(String(p.gender||'').trim())).length;
  const yamanashiEscape=value=>String(value??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const yamanashiRanking=Object.values(yamanashiCandidates.reduce((best,x)=>{
    const id=String(x.player.id),rate=x.standard/x.time*100;
    const qualified=meetsYamanashiStandard(x.time,x.standard);
    const current=best[id];
    // 突破種目を最優先し、同じ判定内では達成率が高い種目を代表記録にする。
    if(!current||(qualified&&!current.qualified)||(qualified===current.qualified&&rate>current.rate)){
      best[id]={...x,rate,diff:x.time-x.standard,qualified};
    }
    return best;
  },{})).sort((a,b)=>{
    // 10分の1秒判定での突破者を先に表示し、その中で達成率順にする。
    if(a.qualified!==b.qualified)return a.qualified?-1:1;
    return b.rate-a.rate||a.player.name.localeCompare(b.player.name,'ja');
  }).slice(0,20);
  const yamanashiRankingHtml=yamanashiRanking.length?yamanashiRanking.map((x,i)=>{

async function migrateLocalV3(){
  let old=[];
  try{
    old=JSON.parse(localStorage.getItem('swimCoachRecordsV3')||'[]');
  }catch{}

  if(!old.length){
    alert('この端末に旧v3記録はありません。');
    return;
  }

  let byName=Object.fromEntries(PLAYERS.map(p=>[p.name,p]));
  let payload=[];
  let skipped=0;

  for(let r of old){
    let p=byName[r.player];
    if(!p)continue;

    let candidate={
      swimmer_id:p.id,
      stroke:r.event,
      distance:parseInt(r.distance),
      course:r.pool,
      time_seconds:+r.seconds,
      meet_name:r.memo||null,
      record_date:r.date||new Date().toISOString().slice(0,10),
      memo:null,
      is_personal_best:!!r.isBest,
      is_jo_qualified:!!r.jo
    };

    let duplicate=records.some(x=>
      x.swimmer_id===candidate.swimmer_id &&
      x.stroke===candidate.stroke &&
      Number(x.distance)===Number(candidate.distance) &&
      x.course===candidate.course &&
      Math.abs(Number(x.time_seconds)-Number(candidate.time_seconds))<0.001 &&
      x.record_date===candidate.record_date
    );

    if(duplicate){
      skipped++;
    }else{
      payload.push(candidate);
    }
  }

  if(!payload.length){
    alert(
      skipped
        ? `移行対象はすべて登録済みです。（重複 ${skipped}件をスキップ）`
        : '選手名が一致する旧記録がありません。'
    );
    return;
  }

  let {error}=await sb.from('swim_records').insert(payload);

  if(error){
    alert(error.message);
    return;
  }

  await loadCloud();

  alert(
    `${payload.length}件をクラウドへ移行しました。` +
    (skipped ? `\n重複 ${skipped}件はスキップしました。` : '')
  );

  renderAnalysis();
  renderHome();
}

function shareEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shareFmt(v){const n=Number(v);if(!Number.isFinite(n)||n<=0)return '-';const m=Math.floor(n/60);return (m?m+':':'')+(n-m*60).toFixed(2).padStart(m?5:0,'0')}
function shareDate(v){const s=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(s)?s.replace(/-/g,'/'):s||'日付未登録'}
function shareEventKey(r){return [String(r.stroke||''),String(r.distance||''),String(r.course||'')].join('|')}
function sharePublicBest(rows){
  const map=new Map();
  rows.forEach(r=>{const n=Number(r.time_seconds);if(!Number.isFinite(n)||n<=0)return;const k=shareEventKey(r),prev=map.get(k);if(!prev||n<Number(prev.time_seconds)||(n===Number(prev.time_seconds)&&String(r.record_date||'')>String(prev.record_date||'')))map.set(k,r)});
  return [...map.values()].sort((a,b)=>Number(a.distance)-Number(b.distance)||String(a.stroke).localeCompare(String(b.stroke),'ja')||String(a.course).localeCompare(String(b.course),'ja'));
}

function publicLapSegments(r){
  let laps=Array.isArray(r.laps)?r.laps:[];
  const arr=[];let prev=0,prevD=0;
  for(const l of [...laps].sort((a,b)=>Number(a.distance)-Number(b.distance))){
    const d=Number(l.distance);const cumulative=sec(String(l.cumulative_time??''));
    const split=l.split_time?sec(String(l.split_time)):cumulative-prev;
    if(d<=prevD||!Number.isFinite(cumulative)||!Number.isFinite(split)||split<=0)continue;
    arr.push({distance:d,start:prevD,split,cumulative});prev=cumulative;prevD=d;
  }
  return arr;
}
function publicFiftyMeterLaps(r){
  const points=new Map([[0,0]]);
  publicLapSegments(r).forEach(l=>points.set(l.distance,l.cumulative));
  const distance=Number(r.distance),total=Number(r.time_seconds);
  if(Number.isFinite(total)&&total>0)points.set(distance,total);
  const result=[];
  for(let end=50;end<=distance;end+=50){
    const start=end-50,a=points.get(start),b=points.get(end);
    if(Number.isFinite(a)&&Number.isFinite(b)&&b>a)result.push({start,end,split:b-a});
  }
  return result;
}
function publicFiftyMeterLapHtml(r){
  const laps=publicFiftyMeterLaps(r);
  return laps.length?`<div style="margin-top:14px;padding-top:10px;border-top:2px solid #bfdbfe"><b>🏊 50mごとのラップ</b>${laps.map(l=>`<div class="row"><span>${l.start}〜${l.end}m</span><b>${shareFmt(l.split)}</b></div>`).join('')}</div>`:'';
}
function publicJoStandard(swimmer,r){
  // コーチ用と同じSTANDARDSを参照し、公開APIの表記揺れを吸収する。
  // 生年月日を公開側で推測しない（大会当日の年齢による厳密判定はサーバー側で行う）。
  const raw=String(swimmer.age_group??'').trim().replace(/\s/g,'').replace(/～|〜|－|ー/g,'-');
  let division=raw;
  const age=raw.match(/^(\d{1,2})(?:歳)?$/);
  if(age){
    const n=Number(age[1]);
    division=n<=9?'9歳以下':n>=17?'CS':n>=15?'15〜16歳':`${n}歳`;
  }else if(/^15-16歳?$/.test(raw))division='15〜16歳';
  else if(/^17-18歳?$/.test(raw))division='CS';
  else if(/^CS$/i.test(raw))division='CS';
  if(Number(r.distance)===50&&['背泳ぎ','平泳ぎ','バタフライ'].includes(r.stroke)
      &&['13歳','14歳','15〜16歳','CS'].includes(division))division='CS';
  const genderRaw=String(swimmer.gender??'').trim();
  const gender=genderRaw==='女'||genderRaw==='女性'?'女子':genderRaw==='男'||genderRaw==='男性'?'男子':genderRaw;
  if(!['男子','女子'].includes(gender))return null;
  const row=STANDARDS.find(x=>String(x.event).trim()===String(r.stroke).trim()
      &&Number.parseInt(x.distance,10)===Number(r.distance)
      &&String(x.division).trim().replace(/～/g,'〜')===division);
  if(!row)return null;
  const value=gender==='男子'?(r.course==='長水路'?row.maleLC:row.maleSC)
      :(r.course==='長水路'?row.femaleLC:row.femaleSC);
  return value!=null&&value!==''&&Number.isFinite(Number(value))&&Number(value)>0?Number(value):null;
}

}
function validMeetDate(value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return false;
 const [y,m,d]=value.split('-').map(Number);
 const v=new Date(y,m-1,d);
 return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d;
}
function pickMeetDate(initial){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:10050;background:rgba(8,30,51,.65);display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML='<div role="dialog" aria-modal="true" aria-label="大会開催日" style="background:white;border-radius:18px;padding:22px;width:min(100%,390px);box-shadow:0 10px 40px #0003"><h3 style="margin:0 0 14px">📅 大会の開催日</h3><label for="meetDatePicker">日付を選択してください</label><input id="meetDatePicker" type="date" style="width:100%;box-sizing:border-box;font-size:18px;padding:12px;margin:10px 0 18px" value="'+String(initial||'').replace(/[^0-9-]/g,'')+'"><div style="display:flex;gap:12px;justify-content:flex-end"><button type="button" class="secondary" id="meetDateCancel">キャンセル</button><button type="button" id="meetDateOk">決定</button></div></div>';
  document.body.appendChild(overlay);
  const field=overlay.querySelector('#meetDatePicker');
  const done=v=>{overlay.remove();resolve(v)};
  overlay.querySelector('#meetDateCancel').onclick=()=>done(null);
  overlay.querySelector('#meetDateOk').onclick=()=>{if(!field.value||field.value.length!==10){alert('開催日を選択してください');return}done(field.value)};
  field.focus();
 });
}
async function editMeet(id){
 const m=meetList.find(x=>x.id===id),name=prompt('大会名',m?.name||'');if(name===null)return;if(!name.trim())return alert('大会名は必須です');
 const date=await pickMeetDate(m?.meet_date||'');if(date===null)return;if(!validMeetDate(date))return alert('日付を確認してください');
 const venue=prompt('会場名',m?.venue||'');if(venue===null)return;
 const data={name:name.trim(),meet_date:date,venue:venue.trim(),updated_at:new Date().toISOString()};
 const {error}=m?await sb.from('swim_meets').update(data).eq('id',id):await sb.from('swim_meets').insert({...data,created_by:session.user.id});
 if(error)return alert(error.message);await refreshMeets();
}
function editMeetEntry(id,meetId){
 const mid=meetId||meetEntries.find(e=>e.id===id)?.meet_id;
 if(!mid||!meetList.some(m=>m.id===mid)){alert('大会が見つかりません。画面を更新してください。');return}
 if(!PLAYERS.length){alert('先に選手を登録してください。');return}
 const selected=new Set(meetEntries.filter(e=>e.meet_id===mid).map(e=>e.swimmer_id));
 const overlay=document.createElement('div');
 overlay.style.cssText='position:fixed;inset:0;z-index:10060;background:rgba(8,30,51,.7);display:flex;align-items:center;justify-content:center;padding:14px';
 overlay.innerHTML='<form id="meSwimmerForm" style="background:#fff;border-radius:18px;padding:22px;width:min(100%,440px);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #0003"><h3 style="margin:0 0 12px">👥 出場選手を選択</h3><p class="muted" style="font-size:13px">出場する選手にチェックを入れてください。複数選択できます。</p><div style="max-height:48vh;overflow:auto">'+PLAYERS.map(p=>'<label style="display:flex;align-items:center;gap:12px;padding:11px 5px;border-bottom:1px solid #e2eaf0"><input type="checkbox" name="swimmer" value="'+meEsc(p.id)+'"'+(selected.has(p.id)?' checked':'')+' style="width:22px;height:22px;flex-shrink:0">'+meEsc(p.name)+'</label>').join('')+'</div><p class="muted" style="font-size:13px">チェックを外して保存すると、この大会の出場予定から外れます。</p><div id="meSwimmerError" role="alert" style="color:#b42318;margin:8px 0"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="secondary" id="meSwimmerCancel">キャンセル</button><button type="submit" id="meSwimmerSave">保存</button></div></form>';
 document.body.appendChild(overlay);
 const form=overlay.querySelector('#meSwimmerForm');
 overlay.querySelector('#meSwimmerCancel').onclick=()=>overlay.remove();
 form.onsubmit=async ev=>{
  ev.preventDefault();
  const wanted=new Set([...form.querySelectorAll('input[name="swimmer"]:checked')].map(el=>el.value));
  const added=[...wanted].filter(id=>!selected.has(id));
  const removed=[...selected].filter(id=>!wanted.has(id));
  const save=overlay.querySelector('#meSwimmerSave'),error=overlay.querySelector('#meSwimmerError');
  save.disabled=true;error.textContent='';
  try{
   if(added.length){const r=await sb.from('swim_meet_swimmers').insert(added.map(swimmer_id=>({meet_id:mid,swimmer_id})));if(r.error)throw r.error}
   if(removed.length){const r=await sb.from('swim_meet_swimmers').delete().eq('meet_id',mid).in('swimmer_id',removed);if(r.error)throw r.error}
   overlay.remove();await refreshMeets();
  }catch(e){error.textContent='保存できませんでした：'+String(e?.message||e);save.disabled=false;await loadMeets()}
 };
}

// iPhone/PWAでも最新版を検知して自動更新する仕組み
const APP_BUILD_VERSION='20261023-collapsible-laps-v3';
function reloadLatestApp(version){
  const u=new URL(location.href);
  u.searchParams.set('v',version||String(Date.now()));
  location.replace(u.toString());
}
let __versionCheckBusy=false;
async function checkForAppUpdate(){
  if(__versionCheckBusy||!navigator.onLine)return;
  __versionCheckBusy=true;
  try{
    const base=location.href.split('#')[0].split('?')[0];
    const res=await fetch(base+'?__version_check='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/APP_BUILD_VERSION=['\"]([^'\"]+)/);
    if(m&&m[1]!==APP_BUILD_VERSION){
      // 入力中の記録を突然失わないよう、更新は利用者の確認後に行う。
      const banner=document.getElementById('appUpdateNotice');
      if(banner){
        banner.hidden=false;
        banner.querySelector('button').onclick=()=>reloadLatestApp(m[1]);
      }
    }
  }catch(e){console.log('version check skipped',e)}
  finally{__versionCheckBusy=false}
}
window.addEventListener('pageshow',()=>setTimeout(checkForAppUpdate,800));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(checkForAppUpdate,500)});
window.addEventListener('focus',()=>setTimeout(checkForAppUpdate,500));
$$('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.addEventListener('blur',e=>{if(e.target&&e.target.id==='itime')formatTimeInput()},true);init();setTimeout(checkForAppUpdate,1500);
