function sec(t){
  t=String(t).trim();
  if(!t)return NaN;

  // 全角記号を半角へ
  t=t.replace(/：/g,':').replace(/。/g,'.');

  // iPhone入力対応
  // 例 1.13.64 → 1:13.64
  const dots=(t.match(/\./g)||[]).length;
  if(!t.includes(':') && dots===2){
    const p=t.split('.');
    t=p[0]+':'+p[1]+'.'+p[2];
  }

  // 1:13.64 → 秒へ変換
  let p=t.split(':');
  if(p.length===2){
    const m=Number(p[0]);
    const s=Number(p[1]);
    return Number.isFinite(m)&&Number.isFinite(s)
      ? m*60+s
      : NaN;
  }

  // 50mなど 32.45 はそのまま秒
  const n=Number(t);
  return Number.isFinite(n)?n:NaN;
}

function formatTimeInput(){

  // 1.13.64 → 1:13.64
  const dots=(t.match(/\./g)||[]).length;
  if(!t.includes(':') && dots===2){

}

function fmt(v){if(v==null||isNaN(v))return '-';let m=Math.floor(v/60),s=v-m*60;return (m?m+':':'')+s.toFixed(2).padStart(m?5:0,'0')}
function playerById(id){return PLAYERS.find(x=>x.id===id)}
// 日本水泳連盟「Results of Japan Swimming」選手ページとの紐づけ
const JASF_ATHLETE_IDS={
  '龍田小春':'58337328'
};
// 選手ページIDと順位APIの swimmer_code は別番号の場合がある。
const JASF_PROFILE_TO_RANKING_CODES={
  '58366356':['9455451'], // 大森結月: Results of Japan Swimming の順位APIで確認済み
  '57355971':['9118656'], // 飯野舞美・クラブ登録: 取得済み公式順位の競技者コード
  '58640127':['9546708']  // 飯野舞美・学校登録: 公式選手情報APIで確認（2026-10-17）
};
function jasfAthleteIds(player){
  if(!player)return [];
  const ids=[];
  const add=v=>{
    const id=String(v||'').trim();
    if(/^\d+$/.test(id) && !ids.includes(id))ids.push(id);
  };
  if(Array.isArray(player.athlete_ids))player.athlete_ids.forEach(add);
  add(player.athlete_id||player.jasf_athlete_id);
  const key=String(player.name||'').replace(/[ 　]/g,'').trim();
  add(JASF_ATHLETE_IDS[key]);
  // プロフィールIDはURL生成にも使うので先に保持し、順位照合用IDを追加する。
  [...ids].forEach(id=>(JASF_PROFILE_TO_RANKING_CODES[id]||[]).forEach(add));
  return ids;
}
function jasfAthleteId(player){return jasfAthleteIds(player)[0]||'';}
function jasfAthleteUrl(player){
  const athleteId=jasfAthleteId(player);
  return athleteId?`https://result.swim.or.jp/athletes/${athleteId}`:'';
}
function parseAthleteIds(value){
  return [...new Set(String(value||'').split(/[\s,、，]+/).map(v=>v.trim()).filter(Boolean))];
}

function jasfRecordDate(year,dateValue){
  const raw=String(dateValue||'').trim();
  let m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=raw.match(/^(\d{1,2})[\/-](\d{1,2})$/);
  if(!m)return `${year}-04-01`;
  const month=Number(m[1]);
  const calendarYear=month<=3?Number(year)+1:Number(year);
  return `${calendarYear}-${String(month).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
}

// Results of Japan Swimming API のコード対応
const JASF_EVENTS=[
  {stroke:'自由形',styleCode:1,distances:[{m:50,code:2},{m:100,code:3},{m:200,code:4},{m:400,code:5},{m:800,code:6},{m:1500,code:7}]},

];

async function fetchJasfRecord(athleteId,year,waterwayCode,swimmingStyleCode,distanceCode){
  const base=String(window.SUPABASE_URL||'').replace(/\/$/,'');
  const res=await fetch(`${base}/functions/v1/jasf-test`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      athlete_id:String(athleteId),
      year:Number(year),
      waterway_code:Number(waterwayCode),

}

function jasfResultIdFromMemo(memo){
  const m=String(memo||'').match(/result_id:([^\s/]+)/);
  return m&&m[1]&&m[1]!=='-'?m[1]:'';
}


// 完全一致の重複判定：選手・日付・種目・距離・水路・タイムが同じ記録
function recordExactKey(r){
  const t=Number(r?.time_seconds);
  return `${r?.swimmer_id||''}|${r?.record_date||''}|${r?.stroke||''}|${Number(r?.distance)||0}|${r?.course||''}|${Number.isFinite(t)?t.toFixed(3):''}`;
}
function recordSourcePriority(r){
  const memo=String(r?.memo||''), meet=String(r?.meet_name||'');
  if(memo.includes('日本水泳連盟'))return 3;       // 公式を最優先
  if(memo.includes('スクリーンショット解析')||meet.includes('大会速報スクリーンショット'))return 2; // 速報
  return 1;                                         // 手入力
}
function chooseDuplicateKeeper(arr){
  return [...arr].sort((a,b)=>recordSourcePriority(b)-recordSourcePriority(a)
    || String(a.created_at||'').localeCompare(String(b.created_at||''))
    || String(a.id||'').localeCompare(String(b.id||'')))[0];
}
async function recalcPersonalBests(playerIds){
  for(const playerId of [...new Set(playerIds.map(String))]){
    const mine=records.filter(r=>String(r.swimmer_id)===playerId);
    const bestByEvent=new Map();
    mine.forEach(r=>{
      const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
      const t=Number(r.time_seconds); if(!Number.isFinite(t))return;
      const cur=bestByEvent.get(key);
      if(!cur||t<Number(cur.time_seconds)||(Math.abs(t-Number(cur.time_seconds))<0.001&&String(r.record_date||'')>String(cur.record_date||'')))bestByEvent.set(key,r);
    });
    const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
    if(clearErr)throw clearErr;
    for(const r of bestByEvent.values()){
      const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
      if(error)throw error;
    }
  }
}

async function cleanupExactDuplicatesForPlayerSilent(playerId){
  await loadCloud();
  const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
  const groups=new Map();
  mine.forEach(r=>{const k=recordExactKey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  const deleteIds=[];
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    const keep=chooseDuplicateKeeper(arr);
    arr.filter(r=>String(r.id)!==String(keep.id)).forEach(r=>deleteIds.push(r.id));
  }
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error)throw error;
  }
  if(deleteIds.length){
    await loadCloud();
    await recalcPersonalBests([String(playerId)]);
    await loadCloud();
  }
  return deleteIds.length;
}

async function cleanupAllExactDuplicates(){
  if(!confirm('全選手の完全一致した重複記録を整理します。\n\n同じ選手・日付・種目・距離・水路・タイムがすべて同じ記録だけが対象です。\n残す優先順位は「🇯🇵公式 ＞ 📱速報 ＞ 手入力」です。よろしいですか？'))return;
  await loadCloud();
  const groups=new Map();
  records.forEach(r=>{const k=recordExactKey(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);});
  const deleteIds=[], affectedPlayers=new Set();
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    const keep=chooseDuplicateKeeper(arr);
    arr.filter(r=>String(r.id)!==String(keep.id)).forEach(r=>{deleteIds.push(r.id);affectedPlayers.add(String(r.swimmer_id));});
  }
  if(!deleteIds.length){alert('完全一致する重複記録はありませんでした。');return;}
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('重複整理に失敗しました：'+error.message);return;}
  }
  await loadCloud();
  try{await recalcPersonalBests([...affectedPlayers]);}catch(e){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+String(e.message||e));}

async function cleanupJasfDuplicates(playerId){
  const p=playerById(playerId);
  if(!p)return;
  if(!confirm(`${p.name} の日本水泳連盟から同期した重複記録を整理します。\n同じ result_id の公式記録だけを1件残し、手入力記録は削除しません。よろしいですか？`))return;
  await loadCloud();
  const rows=records.filter(r=>String(r.swimmer_id)===String(playerId) && String(r.memo||'').includes('日本水泳連盟'));
  const groups=new Map();
  rows.forEach(r=>{
    const rid=jasfResultIdFromMemo(r.memo);
    if(!rid)return;
    const key=`${playerId}|${rid}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(r);
  });
  const deleteIds=[];
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    arr.sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || String(a.id).localeCompare(String(b.id)));
    deleteIds.push(...arr.slice(1).map(r=>r.id));
  }
  if(!deleteIds.length){alert('整理する重複公式記録はありませんでした。');return;}
  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('重複整理に失敗しました：'+error.message);return;}
  }
  await loadCloud();
  // この選手の自己ベスト印を整理し直す
  const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
  const bestByEvent=new Map();
  mine.forEach(r=>{
    const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
    const t=Number(r.time_seconds);
    if(!Number.isFinite(t))return;
    const cur=bestByEvent.get(key);
    if(!cur||t<Number(cur.time_seconds))bestByEvent.set(key,r);
  });
  const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
  if(clearErr){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+clearErr.message);await loadCloud();renderHome();return;}
  for(const r of bestByEvent.values()){
    const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
    if(error){alert('重複は整理しましたが、ベスト印の再計算でエラー：'+error.message);break;}
  }
  await loadCloud();
  renderHome();
  renderPlayers();
  alert(`重複していた公式記録 ${deleteIds.length}件を削除しました。\n各公式記録は1件ずつ残しています。`);
}


async function cleanupAllJasfDuplicates(){
  if(!confirm(`全選手の日本水泳連盟から同期した重複公式記録を整理します。\n同じ選手・同じ result_id の公式記録だけを1件残します。\n手入力記録や result_id が異なる記録は削除しません。よろしいですか？`))return;
  await loadCloud();

  const official=records.filter(r=>String(r.memo||'').includes('日本水泳連盟'));
  const groups=new Map();
  official.forEach(r=>{
    const rid=jasfResultIdFromMemo(r.memo);
    if(!rid)return;
    const key=`${r.swimmer_id}|${rid}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(r);
  });

  const deleteIds=[];
  const affectedPlayers=new Set();
  for(const arr of groups.values()){
    if(arr.length<2)continue;
    arr.sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || String(a.id).localeCompare(String(b.id)));
    arr.slice(1).forEach(r=>{deleteIds.push(r.id);affectedPlayers.add(String(r.swimmer_id));});
  }

  if(!deleteIds.length){
    alert('全選手を確認しましたが、整理する重複公式記録はありませんでした。');
    return;
  }

  for(let i=0;i<deleteIds.length;i+=100){
    const {error}=await sb.from('swim_records').delete().in('id',deleteIds.slice(i,i+100));
    if(error){alert('全選手の重複整理に失敗しました：'+error.message);return;}
  }

  await loadCloud();

  // 重複があった選手だけ自己ベスト印を再計算
  for(const playerId of affectedPlayers){
    const mine=records.filter(r=>String(r.swimmer_id)===String(playerId));
    const bestByEvent=new Map();
    mine.forEach(r=>{
      const key=`${r.stroke}|${Number(r.distance)}|${r.course}`;
      const t=Number(r.time_seconds);
      if(!Number.isFinite(t))return;
      const cur=bestByEvent.get(key);
      if(!cur || t<Number(cur.time_seconds) || (Math.abs(t-Number(cur.time_seconds))<0.001 && String(r.record_date||'')>String(cur.record_date||''))) bestByEvent.set(key,r);
    });
    const {error:clearErr}=await sb.from('swim_records').update({is_personal_best:false}).eq('swimmer_id',playerId);
    if(clearErr){alert(`重複は整理しましたが、${playerById(playerId)?.name||'選手'}のベスト印再計算でエラー：${clearErr.message}`);continue;}
    for(const r of bestByEvent.values()){
      const {error}=await sb.from('swim_records').update({is_personal_best:true}).eq('id',r.id);
      if(error){alert(`重複は整理しましたが、${playerById(playerId)?.name||'選手'}のベスト印再計算でエラー：${error.message}`);break;}
    }
  }

  await loadCloud();
  renderHome();
  renderPlayers();
  renderAnalysis();
  alert(`全選手の重複整理が完了しました。\n削除した重複公式記録：${deleteIds.length}件\n対象選手：${affectedPlayers.size}名\n\n手入力記録と、result_id が異なる公式記録は残しています。`);
}

async function fetchJasfLatest(playerId){
  const p=playerById(playerId);
  const athleteIds=jasfAthleteIds(p);
  const box=$('#jasfLatestBox');
  if(!box)return;
  if(!athleteIds.length){
    box.innerHTML='<div class="notice">この選手の競技者IDはまだ登録されていません。</div>';
    return;
  }

  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=2024;y<=currentYear;y++)years.push(y);
  box.innerHTML=`<div class="notice">🇯🇵 日本水泳連盟から競技者ID ${athleteIds.join('・')} の${years[0]}〜${years[years.length-1]}年度記録を取得中…</div>`;

  try{
    const jobs=[];
    // period_code=4 は 2024年度以降の年度別データをまとめて返すため、
    // 年度ごとに同じAPIを繰り返し呼ばず、競技者ID×水路×種目×距離につき1回だけ取得する。
    athleteIds.forEach(athleteId=>[1,2].forEach(waterwayCode=>{
      JASF_EVENTS.forEach(ev=>ev.distances.forEach(d=>{
        jobs.push({
  athleteId,
  year:currentYear,
  course:waterwayCode===1?'長水路':'短水路',
  stroke:ev.stroke,
  distance:d.m,
  waterwayCode,
  swimmingStyleCode:ev.styleCode,
  distanceCode:d.code,
  promise:fetchJasfRecord(
    athleteId,
    currentYear,
    waterwayCode,
    ev.styleCode,
    d.code
  )
});
      }));
    }));

    const settled=await Promise.allSettled(jobs.map(j=>j.promise));
    const fetched=[];
    const errors=[];
    settled.forEach((r,i)=>{
      const job=jobs[i];
      if(r.status==='fulfilled'){
        const json=r.value;
        const groups=Array.isArray(json?.data?.result)?json.data.result:[];
        groups.forEach(g=>{
          const rows=Array.isArray(g?.data)?g.data:[];
          rows.forEach(x=>fetched.push({
  x,
  athleteId:job.athleteId,
  course:job.course,
  year:Number(g.year||json.year||job.year),
  stroke:job.stroke,
  distance:job.distance,
  waterwayCode:job.waterwayCode,
  swimmingStyleCode:job.swimmingStyleCode,
  distanceCode:job.distanceCode
}));
        });
      }else{
        const msg=String(r.reason?.message||r.reason||'');
        // 記録なし等は大量表示せず、通信・API異常だけ後で確認できるよう保持
        if(!/invalid|422|記録がありません/i.test(msg))errors.push(`ID ${job.athleteId} / 2024年度以降 ${job.course} ${job.stroke}${job.distance}m: ${msg}`);
      }
    });

    if(!fetched.length)throw new Error('取得できる公式記録がありませんでした。競技者IDと年度を確認してください。');

    fetched.sort((a,b)=>a.year-b.year || String(a.x.result_date||'').localeCompare(String(b.x.result_date||'')));

    // 保存直前にクラウドを再読込し、別端末や直前の同期結果も含めて重複判定する。
    await loadCloud();
    const existingOfficialResultIds=new Set();
    const existingOfficialFallbackKeys=new Set();
    records.forEach(r=>{
      if(String(r.swimmer_id)!==String(playerId))return;
      if(!String(r.memo||'').includes('日本水泳連盟'))return;
      const rid=jasfResultIdFromMemo(r.memo);
      if(rid)existingOfficialResultIds.add(rid);
      existingOfficialFallbackKeys.add(`${r.stroke}|${Number(r.distance)}|${r.course}|${Number(r.time_seconds).toFixed(3)}|${r.record_date||''}`);
    });

    let saved=0,unchanged=0;
    const savedRows=[];

    for(const item of fetched){
      const x=item.x;
      const stroke=item.stroke;
      const distance=item.distance;
      const timeSeconds=sec(x.result_time);
      const recordDate=jasfRecordDate(item.year,x.result_date);
      const meetName=x.game_short_name||x.game_name||'日本水泳連盟公式記録';
      if(!Number.isFinite(timeSeconds))continue;

      const incomingResultId=String(x.result_id||'').trim();
      const fallbackKey=`${stroke}|${Number(distance)}|${item.course}|${Number(timeSeconds).toFixed(3)}|${recordDate}`;
      // result_id がある公式記録は result_id を最優先で判定。
      // result_id が無い場合だけ、公式記録同士の「種目・水路・タイム・日付」で判定する。
      // 手入力記録は重複判定の対象にしない。
      // 同じ result_id はもちろん、result_id が違っていても
      // 「種目・距離・水路・タイム・日付」が完全一致する公式記録は再登録しない。
      // これにより年度別ベスト同期を何度押しても同じ記録が増えない。
      const duplicate=(incomingResultId && existingOfficialResultIds.has(incomingResultId))
        || existingOfficialFallbackKeys.has(fallbackKey);

      // 同じ選手・日付・種目・距離・水路の「大会速報スクリーンショット」があれば、
      // 日本水泳連盟の公式記録を優先するため速報記録を削除する。
      // タイムが速報と公式で違っていても、公式側を正として置き換える。
      const provisionalRows=records.filter(r=>
        String(r.swimmer_id)===String(playerId) &&
        String(r.record_date||'')===String(recordDate) &&
        r.stroke===stroke && Number(r.distance)===Number(distance) && r.course===item.course &&
        (String(r.memo||'').includes('スクリーンショット解析から登録') || String(r.meet_name||'').includes('大会速報スクリーンショット'))
      );
      if(provisionalRows.length){
        const ids=provisionalRows.map(r=>r.id).filter(Boolean);
        if(ids.length){
          const {error:delError}=await sb.from('swim_records').delete().in('id',ids);
          if(delError)throw delError;
        }
        for(const pr of provisionalRows){
          const idx=records.findIndex(r=>String(r.id)===String(pr.id));
          if(idx>=0)records.splice(idx,1);
        }
      }

      // 公式記録が既に保存済みなら、速報だけ整理して新規追加はしない。
      if(duplicate){unchanged++;continue;}

      const currentBest=best(playerId,stroke,distance,item.course);
      const isBest=currentBest==null||timeSeconds<Number(currentBest)-0.001;
      const meet=joMeetInfo(recordDate);
      const st=standard(playerId,stroke,distance,item.course,meet?.date||null);
      const jo=st!=null&&timeSeconds<=st;

      if(isBest&&currentBest!=null){
        const {error:clearError}=await sb.from('swim_records').update({is_personal_best:false})
          .eq('swimmer_id',playerId).eq('stroke',stroke).eq('distance',distance).eq('course',item.course).eq('is_personal_best',true);
        if(clearError)throw clearError;
      }

      const payload={
        swimmer_id:playerId,stroke,distance,course:item.course,time_seconds:timeSeconds,meet_name:meetName,record_date:recordDate,
        memo:`日本水泳連盟 ID:${item.athleteId} / ${item.year}年度 / result_id:${x.result_id||'-'}`,
        is_personal_best:isBest,is_jo_qualified:jo
      };
      const {error}=await sb.from('swim_records').insert(payload);
      if(error)throw error;
      saved++;
      savedRows.push(`${item.year}年度 ${stroke} ${distance}m・${item.course} ${x.result_time}`);
      records.push({...payload,id:`jasf-temp-${Date.now()}-${saved}`});
      if(incomingResultId)existingOfficialResultIds.add(incomingResultId);
      existingOfficialFallbackKeys.add(fallbackKey);
    }
    // ========================================
// 日本水泳連盟公式記録のラップを自動取得
// 100m以上の記録だけを対象にする
// 1件失敗しても同期全体は止めない
// ========================================
let lapUpdated = 0;          // 今回新しく取得・更新
let lapAlreadyExists = 0;    // すでにラップ取得済み
let lapNotTarget = 0;        // 50mなど対象外
let lapFailed = 0;           // 取得失敗

for(const item of fetched){
  const x = item.x;

  // result_id がない記録は対象外
  if(!x?.result_id){
    lapNotTarget++;
    continue;
  }

  // 50m種目は途中ラップがないので対象外
  if(Number(item.distance) < 100){
    lapNotTarget++;
    continue;
  }

  const incomingResultId = String(x.result_id);

  // ==========================================
  // すでにSupabaseに保存されている同じ公式記録を探す
  // memo内の result_id を使って照合
  // ==========================================
  const existingRecord = records.find(r =>
    String(r.swimmer_id) === String(playerId) &&
    String(jasfResultIdFromMemo(r.memo || '')) === incomingResultId
  );

  // laps がすでに入っていれば公式APIへ再アクセスしない
  let existingLaps = existingRecord?.laps;

  // JSON文字列で保存されている場合にも対応
  if(typeof existingLaps === 'string'){
    try{
      existingLaps = JSON.parse(existingLaps);
    }catch(e){
      existingLaps = [];
    }
  }

  if(Array.isArray(existingLaps) && existingLaps.length > 0){
    lapAlreadyExists++;
    continue;
  }

  const timeSeconds = sec(x.result_time);
  const recordDate = jasfRecordDate(item.year, x.result_date);

  if(!Number.isFinite(timeSeconds) || !recordDate){
    lapNotTarget++;
    continue;
  }

  try{
    const lapResult = await importTestJasfLaps({
      silent: true,

      athlete_id: item.athleteId,
      swimmer_id: playerId,

      stroke: item.stroke,
      distance: Number(item.distance),
      course: item.course,

      waterway_code: item.waterwayCode,
      swimming_style_code: item.swimmingStyleCode,
      distance_code: item.distanceCode,
      race_division_code: 0,

      record_date: recordDate,
      time_seconds: timeSeconds,

      meet_name:
        x.game_short_name ||
        x.game_name ||
        '日本水泳連盟公式記録',

      result_id: incomingResultId
    });

    if(lapResult?.success){
      lapUpdated++;

      // 同じ同期処理中に再判定できるよう、
      // ローカルrecordsにも取得結果を反映
      if(existingRecord && Array.isArray(lapResult.laps)){
        existingRecord.laps = lapResult.laps;
      }

    }else{
      lapFailed++;

      console.warn(
        'JASF lap import skipped:',
        item.stroke,
        item.distance,
        x.result_id,
        lapResult
      );
    }

  }catch(err){
    lapFailed++;

    // 1件失敗しても同期全体は止めない
    console.warn(
      'JASF lap import failed:',
      {
        stroke: item.stroke,
        distance: item.distance,
        course: item.course,
        result_id: x.result_id,
        error: String(err?.message || err)
      }
    );
  }
}

console.log(
  `JASF LAP SYNC: updated=${lapUpdated}, existing=${lapAlreadyExists}, notTarget=${lapNotTarget}, failed=${lapFailed}`
);
    // 同期完了時に、この選手の完全一致重複を自動整理する。
    // 公式 ＞ 速報 ＞ 手入力の優先順位で1件だけ残す。
    const autoCleaned=await cleanupExactDuplicatesForPlayerSilent(playerId);
    await loadCloud();
    const yearGroups=years.map(year=>{
      const rows=fetched.filter(v=>v.year===year);
      if(!rows.length)return '';
      return `<div class="result" style="margin-top:12px"><b>📅 ${year}年度 公式記録</b>${rows.map(({x,stroke,distance,course})=>`
        <div class="row"><div><b>${stroke} ${distance}m</b><br><span class="muted">${course} ／ ${x.result_date||''} ${x.game_name||''}</span></div>
        <div style="text-align:right"><b style="font-size:20px">${x.result_time||'-'}</b><br><span class="muted">${x.division?.name||''}${x.is_best_record?' ★':''}</span></div></div>`).join('')}</div>`;
    }).join('');

    box.innerHTML=`
  <div class="result good">
    <b>✅ 日本水泳連盟との同期が完了しました</b>
    <br>
    <span class="small">
      競技者ID：${athleteIds.join('・')}
    </span>

    <div style="
      margin-top:10px;
      padding:10px 12px;
      background:#eef7ff;
      border-radius:10px;
      line-height:1.8;
    ">
      <b>🏊 通過タイム・区間ラップ取得結果</b><br>
🆕 新規取得・更新：<b>${lapUpdated}件</b><br>
✅ 取得済み：<b>${lapAlreadyExists}件</b><br>
⏭️ 対象外：<b>${lapNotTarget}件</b><br>
${lapFailed > 0
  ? `⚠️ 取得失敗：<b>${lapFailed}件</b>`
  : `✨ 取得失敗：<b>0件</b>`
}
    </div>

    ${yearGroups}
  </div>
`;
    renderHome();
  }catch(e){
    await loadCloud();
    box.innerHTML=`<div class="error">公式記録の同期に失敗しました。<br><span class="small">${String(e.message||e)}</span></div>`;
  }
}

  console.warn('ラップ取込失敗:', e);

  if(options.silent){
    return {
      success:false,
      error:String(e?.message || e)
    };
  }

  return {
    success:false,
    error:String(e?.message || e)
  };
}
}
function ageOnDate(birthDate, targetDate){
  if(!birthDate || !targetDate) return null;

  const b = new Date(birthDate + 'T00:00:00');
  const d = new Date(targetDate + 'T00:00:00');

  if(isNaN(b) || isNaN(d)) return null;

  let age = d.getFullYear() - b.getFullYear();

  const birthdayPassed =
    d.getMonth() > b.getMonth() ||
    (d.getMonth() === b.getMonth() && d.getDate() >= b.getDate());

  if(!birthdayPassed) age--;

  return age;
}

function joMeetInfo(recordDate){
  const raw=recordDate||new Date().toISOString().slice(0,10);
  const d=new Date(raw+'T00:00:00');
  if(isNaN(d))return null;
  const y=d.getFullYear(),m=d.getMonth()+1;
  const seasonYear=m>=4?y:y-1;
  const schedules={2026:{summer:'2026-08-22',spring:'2027-03-27'}};
  const sc=schedules[seasonYear];
  if(!sc)return null;
  const summerDate=new Date(sc.summer+'T00:00:00');
  return d<=summerDate
    ? {name:`${seasonYear}年夏季JO`,date:sc.summer}
    : {name:`${seasonYear+1}年春季JO`,date:sc.spring};
}

function joDivisionFor(player,stroke,distance,meetDate){
  if(!player)return null;
  let age=null,division=player.age_group;
  if(player.birth_date&&meetDate)age=ageOnDate(player.birth_date,meetDate);
  if(age!==null){
    if(age<=9)division='9歳以下';
    else if(age===10)division='10歳';
    else if(age===11)division='11歳';
    else if(age===12)division='12歳';
    else if(age===13)division='13歳';
    else if(age===14)division='14歳';
    else if(age===15||age===16)division='15〜16歳';
    else if(age>=17)division='CS';
  }
  if(division==='17-18歳'||division==='17～18歳')division='CS';
  // JO特例：13歳以上の50m背泳ぎ・平泳ぎ・バタフライはCS標準を使用。
  // meetDateが渡されない詳細画面・グラフ等でも、登録済み年齢区分から同じ特例を適用する。
  const cs50AgeDivision=['13歳','14歳','15〜16歳','15～16歳','17-18歳','17～18歳','CS'].includes(String(division||'').trim());
  if(Number(distance)===50 && ['背泳ぎ','平泳ぎ','バタフライ'].includes(stroke) && ((age!==null&&age>=13)||cs50AgeDivision))division='CS';
  return {age,division};
}

function standard(playerId,stroke,distance,course,targetDate=null){
  const p=playerById(playerId);
  if(!p)return null;
  const divInfo=joDivisionFor(p,stroke,distance,targetDate);
  const division=divInfo?.division||p.age_group;
  const x=STANDARDS.find(x=>x.event===stroke&&parseInt(x.distance)===Number(distance)&&x.division===division);
  if(!x)return null;
  return p.gender==='男子'?(course==='長水路'?x.maleLC:x.maleSC):(course==='長水路'?x.femaleLC:x.femaleSC);
}

function tokyoScInfo(playerId,stroke,distance,meetDate=TOKYO_SC_MEET_DATE){
  const p=playerById(playerId);
  const age=p?.birth_date ? ageOnDate(p.birth_date,meetDate) : null;
  if(!p || !Array.isArray(window.TOKYO_SC_STANDARDS)){
    return {date:meetDate,age,ageKey:null,standard:null};
  }

  const g=String(p.gender||'').trim();
  const gender=g.includes('女')?'女子':g.includes('男')?'男子':g;

  // 要項どおり、本大会第1日目 2026/10/30 の満年齢で参加年齢を決定する。
  // 生年月日が未登録の選手だけ、従来の年齢区分をフォールバックとして使う。
  let ageKey=null;
  if(age!==null){
    ageKey=age<=8?'8歳以下':age>=19?'19歳以上':`${age}歳`;
  }else if(meetDate===TOKYO_SC_MEET_DATE){
    const ageRaw=String(p.age_group||'').trim();
    const ageMatch=ageRaw.match(/\d+/);
    if(ageMatch){
      const n=Number(ageMatch[0]);
      ageKey=n<=8?'8歳以下':n>=19?'19歳以上':`${n}歳`;
    }
  }

  if(!ageKey)return {date:meetDate,age,ageKey:null,standard:null};

  const event=String(stroke||'').trim();
  const dist=Number(distance);
  const x=window.TOKYO_SC_STANDARDS.find(r=>
    String(r.gender).trim()===gender &&
    String(r.age).trim()===ageKey &&
    String(r.event).trim()===event &&
    Number(r.distance)===dist
  );

  return {date:meetDate,age,ageKey,standard:x?Number(x.standard):null};
}

function tokyoScStandard(playerId,stroke,distance){
  return tokyoScInfo(playerId,stroke,distance).standard;
}

async function fetchAllRows(table,buildQuery,pageSize=1000){
  const all=[];
  for(let from=0;;from+=pageSize){
    let q=sb.from(table).select('*');
    if(buildQuery)q=buildQuery(q);
    const {data,error}=await q.range(from,from+pageSize-1);
    if(error)throw error;
    const rows=data||[];
    all.push(...rows);
    if(rows.length<pageSize)break;
  }
  return all;
}

async function saveAthleteId(playerId){
  const el=$('#detailAthleteId');
  if(!el)return;
  const athleteIds=parseAthleteIds(el.value);
  if(athleteIds.some(id=>!/^\d+$/.test(id))){
    alert('競技者IDは数字のみで、複数ある場合はカンマ区切りで入力してください。');
    return;
  }
  const {error}=await sb.from('swimmers').update({
    athlete_id:athleteIds[0]||null,
    athlete_ids:athleteIds
  }).eq('id',playerId);

  await loadCloud();

  renderHome();
  alert(athleteIds.length?`日本水泳連盟 競技者IDを${athleteIds.length}件保存しました！`:'競技者IDを解除しました。');

function rankingStatusText(nr){
  if(!nr)return '🇯🇵 同学年順位 未取得（未照会）';
  if(nr.found)return `🇯🇵 同学年 全国 ${nr.gradeRank||nr.rank}位${nr.prefRank?` ／ 🗻 ${nr.prefName||'都道府県内'} ${nr.prefRank}位`:nr.prefStatus==='too_deep'?' ／ 🗻 県順位 取得待ち':nr.prefStatus==='pref_unknown'?' ／ 🗻 県情報なし':' ／ 🗻 県順位 再取得可'}`;
  if(nr.error)return '⚠️ 通信エラー（再取得できます）';
  if(nr.status==='grade_unavailable')return '⚠️ 学年判定不可（要確認）';
  return '🇯🇵 該当記録を確認できず（未掲載とは限りません）';
}
function rankBadgeId(playerId,stroke,distance,course){
  // 日本語を "_" に置換すると別種目・長短水路が同じDOM IDになってしまう。
  // 各文字のコードポイントを16進数化して、種目・水路ごとに一意なIDを作る。
  const key=JSON.stringify([String(playerId),String(stroke),Number(distance),String(course)]);
  return 'nationalRank_'+Array.from(key,ch=>ch.codePointAt(0).toString(16)).join('_');
}
let sharedGoals=[];
function goalTimeKey(id,stroke,distance,course){return JSON.stringify([String(id),String(stroke),Number(distance),String(course)]);}
function goalTimeFor(id,stroke,distance,course){
 const goal=sharedGoals.find(g=>goalTimeKey(g.swimmer_id,g.stroke,g.distance,g.course)===goalTimeKey(id,stroke,distance,course));
 const n=Number(goal?.target_seconds);return goal&&Number.isFinite(n)&&n>0?n:null;
}

}

 if(!value.trim()){
   ({error}=await sb.from('swimmer_goals').delete().eq('swimmer_id',id).eq('stroke',stroke).eq('distance',distance).eq('course',course));
 }else{
   const n=sec(value);

   ({error}=await sb.from('swimmer_goals').upsert({swimmer_id:id,stroke,distance:Number(distance),course,target_seconds:Math.round(n*100)/100,updated_by:session.user.id,updated_at:new Date().toISOString()},{onConflict:'swimmer_id,stroke,distance,course'}));

 const button='<button type="button" class="small secondary" style="margin-top:6px" onclick=\'editGoalTime('+args+')\'>🎯 '+(goal==null?'目標を設定':'目標を変更')+'</button>';

function renderPlayerLapAnalysis(playerId) {
  const target = document.getElementById('playerLapAnalysis');
  if (!target) return;

  const playerRecords = records.filter(
    r => String(r.swimmer_id) === String(playerId)
  );

  const available = playerRecords.filter(r => {
    const official = Array.isArray(r.laps) ? r.laps : [];
    const manual = (typeof manualLaps !== 'undefined' ? manualLaps : [])
      .filter(m => String(m.record_id) === String(r.id));
    return official.length > 0 || manual.length > 0;
  });

  if (!available.length) {
    target.innerHTML = '<p class="muted">比較できるラップがまだありません。</p>';
    return;
  }

  const groups = {};

  available.forEach(r => {
    const key = `${r.stroke}|${r.distance}|${r.course}`;
    (groups[key] ||= []).push(r);
  });

  const options = Object.keys(groups).map(key =>
    `<option value="${key}">${key.replaceAll('|', '・')}</option>`
  ).join('');

  target.innerHTML = `
    <select id="playerLapEvent" onchange="showPlayerLapComparison('${playerId}')">
      ${options}
    </select>
    <div id="playerLapComparison" style="margin-top:12px"></div>
  `;

  showPlayerLapComparison(playerId);
}

function showPlayerLapComparison(playerId) {
  const target = document.getElementById('playerLapComparison');
  const key = document.getElementById('playerLapEvent')?.value;
  if (!target || !key) return;

  const [stroke, distance, course] = key.split('|');

  const selected = records
    .filter(r =>
      String(r.swimmer_id) === String(playerId) &&
      r.stroke === stroke &&
      String(r.distance) === distance &&
      r.course === course
    )
    .sort((a, b) =>
      String(b.record_date || '').localeCompare(String(a.record_date || ''))
    );

  function getLapCheckpoints(r) {
    let official = Array.isArray(r.laps) ? r.laps : [];
    if (typeof r.laps === 'string') {
      try {
        const parsed = JSON.parse(r.laps);
        if (Array.isArray(parsed)) official = parsed;
      } catch (e) {
        official = [];
      }
    }
    const manual = (typeof manualLaps !== 'undefined' ? manualLaps : [])
      .filter(m => String(m.record_id) === String(r.id))
      .map(m => ({
        distance: Number(m.distance),
        cumulative_time: fmt(Number(m.cumulative_seconds))
      }));

    const byDistance = new Map();
    [...official, ...manual].forEach(l => {
      const distance = Number(l.distance);
      if (Number.isFinite(distance)) byDistance.set(distance, l);
    });
    if (!byDistance.size) return [];

    const raceDistance = Number(r.distance);
    const finishTime = Number(r.time_seconds);
    if (Number.isFinite(raceDistance) && Number.isFinite(finishTime)) {
      byDistance.set(raceDistance, {
        distance: raceDistance,
        cumulative_time: fmt(finishTime)
      });
    }

    return [
      { distance: 0, cumulative: 0 },
      ...[...byDistance.values()]
        .map(l => ({
          distance: Number(l.distance),
          cumulative: sec(String(l.cumulative_time ?? ''))
        }))
        .filter(l =>
          Number.isFinite(l.distance) &&
          l.distance > 0 &&
          l.distance <= raceDistance &&
          Number.isFinite(l.cumulative)
        )
    ].sort((a, b) => a.distance - b.distance);
  }

  function getLaps(r) {
    const checkpoints = getLapCheckpoints(r);
    return checkpoints.slice(1).map((point, index) => {
      const previous = checkpoints[index];
      const split = point.cumulative - previous.cumulative;
      return {
        start: previous.distance,
        distance: point.distance,
        cumulative_time: fmt(point.cumulative),
        split,
        split_time: Number.isFinite(split) ? fmt(split) : '-'
      };
    });
  }

  function getFixedLapIntervals(r, intervalMeters) {
    const checkpoints = getLapCheckpoints(r);
    if (!checkpoints.length) return [];
    const times = new Map(checkpoints.map(point => [point.distance, point.cumulative]));
    const distance = Number(r.distance);
    const intervals = [];
    for (let end = intervalMeters; end <= distance; end += intervalMeters) {
      const start = end - intervalMeters;
      const startTime = times.get(start);
      const endTime = times.get(end);
      intervals.push({
        start,
        end,
        time: Number.isFinite(startTime) && Number.isFinite(endTime) && endTime >= startTime
          ? endTime - startTime
          : null
      });
    }
    return intervals;
  }

  const valid = selected.filter(r =>
    Number.isFinite(Number(r.time_seconds))
  );

  const latest = valid.find(r => getLaps(r).length > 0);
  const best = [...valid]
    .filter(r => getLaps(r).length > 0)
    .sort((a, b) => Number(a.time_seconds) - Number(b.time_seconds))[0];

  let summary = '';

  if (latest && best) {
    const latestLaps = getLaps(latest);
    const bestLaps = getLaps(best);
    const bestBySegment = new Map(
      bestLaps.map(l => [String(l.start) + '|' + String(l.distance), l])
    );

    const comparisons = latestLaps
      .filter(l => bestBySegment.has(String(l.start) + '|' + String(l.distance)))
      .map(l => ({
        start: l.start,
        distance: l.distance,
        diff: l.split - bestBySegment.get(String(l.start) + '|' + String(l.distance)).split
      }))
      .filter(c => Number.isFinite(c.diff));

    const totalDiff =
      Number(latest.time_seconds) - Number(best.time_seconds);

    

const signed = n => {
  const sign = n > 0.005 ? '+' : n < -0.005 ? '-' : '±';
  return sign + Math.abs(n).toFixed(2) + '秒';
};



    const rows = comparisons.map(c => {
      const faster = c.diff < -0.005;
      const slower = c.diff > 0.005;
      return `
        <div style="display:flex;justify-content:space-between;
                    align-items:center;gap:8px;padding:6px 0">
          <span>${faster ? '🟢' : slower ? '🔴' : '⚪'}
            ${c.distance}m区間</span>
          <b style="color:${faster ? '#16803b' : slower ? '#b42318' : '#526575'}">
            ${signed(c.diff)}
          </b>
        </div>`;
    }).join('');

    let advice = '';

    if (String(latest.id) === String(best.id)) {
      advice = '最新レースが自己ベストです。現在のペース配分を確認し、次の目標につなげましょう。';
    } else if (!comparisons.length) {
      advice = '比較できる共通のラップ区間がありません。';
    } else {
      const worst = [...comparisons].sort((a,b) => b.diff - a.diff)[0];
      const improved = comparisons.filter(c => c.diff < -0.005);
      const slower = comparisons.filter(c => c.diff > 0.005);

      if (totalDiff < -0.005) {
        advice = `自己ベストを${Math.abs(totalDiff).toFixed(2)}秒更新しています。`;
      } else if (Math.abs(totalDiff) <= 0.005) {
        advice = '自己ベストとほぼ同じタイムです。';
      } else {
        advice = `自己ベストまで${totalDiff.toFixed(2)}秒です。`;
      }

      if (slower.length) {
        advice += ` ${worst.distance}m区間の差が最も大きく、BESTより${worst.diff.toFixed(2)}秒遅くなっています。この区間の泳速維持やターン前後の動きを確認しましょう。`;
      }

      if (improved.length) {
        advice += ` ${improved.map(c => c.distance + 'm').join('・')}区間はBESTより速く泳げています。この良い泳ぎを継続しましょう。`;
      }

      if (!slower.length && !improved.length) {
        advice += ' 各区間ともBESTに近いペースで泳げています。';
      }
    }

    // 前半・後半ペース分析：中間地点の累計タイムがある場合だけ表示
    let paceHtml = '';
    const raceDistance = Number(distance);
    const halfway = raceDistance / 2;
    const midpointLap = latestLaps.find(l => l.distance === halfway);
    const bestMidpointLap = bestLaps.find(l => l.distance === halfway);
    if (raceDistance >= 100 && midpointLap && bestMidpointLap) {
      const first = sec(midpointLap.cumulative_time);
      const total = Number(latest.time_seconds);
      const bestFirst = sec(bestMidpointLap.cumulative_time);
      const bestTotal = Number(best.time_seconds);
      const second = total - first;
      const bestSecond = bestTotal - bestFirst;
      if ([first, second, bestFirst, bestSecond].every(v => Number.isFinite(v) && v > 0)) {
        const slowdown = (second / first - 1) * 100;
        const bestSlowdown = (bestSecond / bestFirst - 1) * 100;
        const paceLabel = slowdown > 0.05 ? '後半が前半より遅い' :
          slowdown < -0.05 ? '後半が前半より速い' : '前後半ほぼ均等';
        const signedPercent = n => (n > 0.05 ? '+' : n < -0.05 ? '-' : '±') +
          Math.abs(n).toFixed(1) + '%';
        paceHtml = `
          <div style="background:white;border-radius:10px;padding:12px;margin-top:10px;line-height:1.7">
            <b>📊 前半・後半のペース分析</b>
            <div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px">
              <span>前半 ${halfway}m</span><b>${fmt(first)}（BEST比 ${signed(first-bestFirst)}）</b>
            </div>
            <div style="display:flex;justify-content:space-between;gap:8px">
              <span>後半 ${halfway}m</span><b>${fmt(second)}（BEST比 ${signed(second-bestSecond)}）</b>
            </div>
            <div style="margin-top:8px;padding-top:8px;border-top:1px solid #e7edf2">
              <b>後半のペース変化 ${signedPercent(slowdown)}</b>
              <div class="muted small">${paceLabel} ／ BEST時 ${signedPercent(bestSlowdown)}</div>
              <div class="muted small">※後半タイム ÷ 前半タイム − 1。プラスは後半の方が遅いことを示します。</div>
            </div>
          </div>`;
      }
    }

    summary = `
      <div style="background:#eef7ff;border-radius:12px;
                  padding:12px;margin-bottom:14px">
        <b>🔍 最新レース vs BEST</b>
        <div class="muted small" style="margin:6px 0 10px">
          最新 ${latest.record_date || '-'} ／ BEST ${best.record_date || '-'}
        </div>
        <div style="display:flex;justify-content:space-between;
                    gap:8px;padding-bottom:8px;font-weight:700">
          <span>TOTAL</span>
          <span>${signed(totalDiff)}</span>
        </div>
        ${rows || '<p class="muted small">共通のラップ区間がありません。</p>'}
        ${paceHtml}
        <div style="background:white;border-radius:10px;
                    padding:12px;margin-top:10px;line-height:1.7">
          <b>🧠 レース分析・練習アドバイス</b>
          <div style="margin-top:6px;font-size:14px">${advice}</div>
        </div>
      </div>`;
  } else {
    summary = '<p class="muted small">比較できるラップ付き記録が不足しています。</p>';
  }

  // JO目標ラップ：自己ベストの実際の区間ラップを基準にした参考シミュレーション。
  // レース記録や公式標準記録そのものは変更しない。
  let joTargetHtml = '';
  const raceMeters = Number(distance);
  const joDate = joMeetInfo(new Date().toISOString().slice(0,10))?.date || null;
  const joStandard = standard(playerId, stroke, raceMeters, course, joDate);
  const fastest = [...valid].sort((a,b) => Number(a.time_seconds)-Number(b.time_seconds))[0];
  const fastestLaps = fastest ? getLaps(fastest) : [];
  const segments = [];
  let previousMeters = 0;
  for (const lap of fastestLaps) {
    if (lap.distance > previousMeters && lap.distance <= raceMeters && Number.isFinite(lap.split) && lap.split > 0) {
      segments.push({distance:lap.distance, start:previousMeters, split:lap.split});
      previousMeters = lap.distance;
    }
  }
  const fullLaps = segments.length > 0 && previousMeters === raceMeters &&
    Math.abs(segments.reduce((sum,l)=>sum+l.split,0)-Number(fastest.time_seconds)) < 0.15;
  if (Number.isFinite(joStandard) && joStandard > 0 && fastest && fullLaps) {
    const bestSeconds = Number(fastest.time_seconds);
    const required = bestSeconds - joStandard;
    const eventLabel = `${stroke} ${raceMeters}m・${course}`;
    const targetCents = Math.round(joStandard * 100);
    const currentCents = segments.map(x=>Math.round(x.split*100));
    const allocate = (weights) => {
      // 合計がJO標準と完全一致するよう0.01秒単位で端数を調整。
      const weightTotal = weights.reduce((a,b)=>a+b,0);
      const improvement = Math.round(bestSeconds*100)-targetCents;
      const raw = weights.map(w=>improvement*w/weightTotal);
      const cuts = raw.map(v=>Math.floor(v));
      let remainder = improvement-cuts.reduce((a,b)=>a+b,0);
      const order = raw.map((v,i)=>({i,fraction:v-Math.floor(v)})).sort((a,b)=>b.fraction-a.fraction);
      for(let j=0;j<remainder;j++) cuts[order[j%order.length].i]++;
      const out = currentCents.map((v,i)=>v-cuts[i]);
      // 記録の丸め誤差も最後の区間で補正する。
      out[out.length-1] += targetCents-out.reduce((a,b)=>a+b,0);
      return out;
    };
    const formatCents = cents => fmt(cents/100);
    if (required > 0.005) {
      const midpoint = raceMeters/2;
      const plans = [
        {name:'均等短縮型',weights:segments.map(()=>1),note:'各区間をほぼ同じ秒数ずつ短縮'},
        {name:'後半強化型',weights:segments.map(x=>x.start>=midpoint?2:1),note:'後半の区間に短縮目標を多めに配分'},
        {name:'前半強化型',weights:segments.map(x=>x.start<midpoint?2:1),note:'前半の区間に短縮目標を多めに配分'}
      ];
      const tables = plans.map((plan,i)=>{
        const targets = allocate(plan.weights);
        const possible = targets.every(x=>x>0);
        if (!possible) return '';
        let cumulative=0;
        const rows = targets.map((t,j)=>{
          cumulative+=t;
          const diff=(currentCents[j]-t)/100;
          return `<div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 0;border-bottom:1px solid #e6eef4;align-items:center">
            <span>${segments[j].distance}m区間</span><span style="color:#64748b">${formatCents(currentCents[j])}</span><b>${formatCents(t)} <span style="color:#16803b;font-size:12px">(-${diff.toFixed(2)})</span></b>
          </div>`;
        }).join('');
        return `<div class="jo-lap-plan" data-jo-plan="${i}" style="display:${i===0?'block':'none'}">
          <div class="muted small" style="margin:8px 0">${plan.note} ／ 左：BEST区間、右：目標区間</div>${rows}
          <div style="display:flex;justify-content:space-between;margin-top:10px"><b>目標合計</b><b>${formatCents(cumulative)}</b></div>
        </div>`;
      }).join('');
      joTargetHtml = `<div style="background:#f0fdf4;border:1px solid #bbebcb;border-radius:12px;padding:14px;margin:14px 0;line-height:1.6">
        <b>🎯 JO突破への目標ラップ</b><div class="small muted">${eventLabel} ／ ${joDate||'登録区分'}基準</div>
        <div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><span>現在BEST</span><b>${fmt(bestSeconds)}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span>JO標準</span><b>${fmt(joStandard)}</b></div>
        <div style="display:flex;justify-content:space-between;gap:8px"><span>必要な短縮</span><b style="color:#15803d">${required.toFixed(2)}秒</b></div>
        <label class="small" style="display:block;margin-top:12px;font-weight:700" for="joLapPlanSelect">目標の立て方</label>
        <select id="joLapPlanSelect" style="margin-top:5px" onchange="document.querySelectorAll('.jo-lap-plan').forEach((e,i)=>e.style.display=i===Number(this.value)?'block':'none')">
          ${plans.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('')}
        </select>${tables}
        <p class="muted small" style="margin:10px 0 0">※BESTのラップから逆算した参考目標です。実現可能性や理想的な配分を保証するものではありません。泳法・体力・レース展開に合わせてコーチが調整してください。</p>
      </div>`;
    } else {
      joTargetHtml = `<div class="result good" style="margin:12px 0"><b>🏆 JO標準突破済み！</b><div class="small">BEST ${fmt(bestSeconds)} ／ JO標準 ${fmt(joStandard)}</div></div>`;
    }
  } else if (joStandard == null) {
    joTargetHtml = '<div class="result small muted">🎯 JO目標ラップ：この種目・年齢区分の標準記録が見つかりません。</div>';
  } else {
    joTargetHtml = '<div class="result small muted">🎯 JO目標ラップ：BESTの全区間ラップがそろうと表示できます。</div>';
  }

  const history = selected.map(r => {
    if (!getLaps(r).length) return '';
    const renderIntervals = intervalMeters =>
      getFixedLapIntervals(r, intervalMeters).map(l => `
        <div style="display:flex;justify-content:space-between;gap:5px;
                    padding:3px 0;border-bottom:1px solid #edf1f3;font-size:13px">
          <span>${l.start}–${l.end}m</span>
          <b>${l.time == null ? '—' : fmt(l.time)}</b>
        </div>
      `).join('') || '<span class="muted small">データなし</span>';

    return `
      <details class="player-lap-record">
        <summary>${videoEscape(r.record_date || '')}　<b>${fmt(r.time_seconds)}</b><span class="muted small">ラップを表示</span></summary>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
                    gap:12px;margin-top:8px">
          <div>
            <b class="small">25mごとのラップ</b>
            ${renderIntervals(25)}
          </div>
          <div>
            <b class="small">50mごとのラップ</b>
            ${renderIntervals(50)}
          </div>
        </div>
      </details>`;
  }).join('');

  target.innerHTML =
    summary +
    joTargetHtml +
    '<h4 style="margin:16px 0 6px">📋 ラップ履歴</h4>' +
    (history || '<p class="muted">ラップデータがありません。</p>');
}

function renderTrendChart(playerId){
  const select=$('#trendSelect');
  const chart=$('#trendChart');
  if(!select || !chart)return;
  const key=select.value;if(!key)return;
  const [stroke,distance,course]=key.split('|');
  const data=records.filter(r=>String(r.swimmer_id)===String(playerId)&&r.stroke===stroke&&Number(r.distance)===Number(distance)&&r.course===course&&Number.isFinite(Number(r.time_seconds)))
    .sort((a,b)=>String(a.record_date||'').localeCompare(String(b.record_date||'')));
  if(!data.length){chart.innerHTML='<p class="muted">グラフにできる記録がありません。</p>';return;}

  const years=[...new Set(data.map(r=>swimFiscalYear(r.record_date)).filter(y=>y!=null))].sort((a,b)=>a-b);
  const currentFY=swimFiscalYear(new Date().toISOString().slice(0,10));
  const defaultFY=years.includes(currentFY)?currentFY:years[years.length-1];
  chart.innerHTML=`
    <div class="actions" style="margin:8px 0 12px">
      <button id="trendAnnualBtn" onclick="renderTrendMode('${playerId}','annual')">🏅 年度ベスト推移</button>
      <button id="trendRaceBtn" class="secondary" onclick="renderTrendMode('${playerId}','race')">🏊 年度内レース推移</button>
    </div>
    <div id="trendYearField" class="field hidden"><label>表示する年度</label><select id="trendYearSelect" onchange="renderTrendMode('${playerId}','race')">${years.slice().reverse().map(y=>`<option value="${y}" ${y===defaultFY?'selected':''}>${y}年度</option>`).join('')}</select></div>
    <div id="trendModeChart"></div>`;
  renderTrendMode(playerId,'annual');
}

function renderTrendMode(playerId,mode){
  const select=$('#trendSelect'), box=$('#trendModeChart');if(!select||!box)return;
  const [stroke,distance,course]=select.value.split('|');
  const all=records.filter(r=>String(r.swimmer_id)===String(playerId)&&r.stroke===stroke&&Number(r.distance)===Number(distance)&&r.course===course&&Number.isFinite(Number(r.time_seconds)))
    .sort((a,b)=>String(a.record_date||'').localeCompare(String(b.record_date||'')));
  const annualBtn=$('#trendAnnualBtn'),raceBtn=$('#trendRaceBtn'),yearField=$('#trendYearField');
  if(annualBtn)annualBtn.className=mode==='annual'?'':'secondary';
  if(raceBtn)raceBtn.className=mode==='race'?'':'secondary';
  if(yearField)yearField.classList.toggle('hidden',mode!=='race');

  let graphData=[],title='',footer='';
  if(mode==='annual'){
    const byYear={};
    all.forEach(r=>{const fy=swimFiscalYear(r.record_date);if(fy==null)return;const t=Number(r.time_seconds);if(!byYear[fy]||t<byYear[fy].time)byYear[fy]={time:t,date:r.record_date,meet:r.meet_name||''};});
    graphData=Object.entries(byYear).sort((a,b)=>Number(a[0])-Number(b[0])).map(([fy,v])=>({label:`${fy}年度`,time:v.time,date:v.date,meet:v.meet}));
    title='🏅 年度ベスト推移';footer=`4月1日〜翌年3月31日を1年度として、各年度の最速タイムを表示（${graphData.length}年度）`;
  }else{
    const fy=Number($('#trendYearSelect')?.value);
    const raceRows=all.filter(r=>swimFiscalYear(r.record_date)===fy);
    // グラフ表示だけ、同日・同タイムの重複点を1点にまとめる。
    // DB上の記録は削除しないため、予選・決勝など別記録の元データはそのまま残る。
    const seenRacePoints=new Set();
    graphData=raceRows.filter(r=>{
      const pointKey=`${r.record_date||''}|${Number(r.time_seconds).toFixed(3)}`;
      if(seenRacePoints.has(pointKey))return false;
      seenRacePoints.add(pointKey);
      return true;
    }).map(r=>({label:String(r.record_date||'').slice(5).replace('-','/'),time:Number(r.time_seconds),date:r.record_date||'',meet:r.meet_name||''}));
    title=`🏊 ${fy}年度 レース推移`;footer=`${fy}/4/1〜${fy+1}/3/31 のレース推移（表示 ${graphData.length}点／保存 ${raceRows.length}記録）`;
  }
  if(!graphData.length){box.innerHTML='<p class="muted">この条件の記録がありません。</p>';return;}

  const joStandard=standard(playerId,stroke,distance,course);
  let vals=graphData.map(x=>x.time);if(joStandard!=null)vals.push(joStandard);
  const min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.25,1),yMin=min-pad,yMax=max+pad;
  const W=620,H=300,left=58,right=22,top=45,bottom=70,pw=W-left-right,ph=H-top-bottom;
  const x=i=>graphData.length===1?left+pw/2:left+i/(graphData.length-1)*pw;
  // 速いタイムほど上に表示
  const y=v=>top+(v-yMin)/(yMax-yMin)*ph;
  const line=graphData.map((r,i)=>`${x(i)},${y(r.time)}`).join(' ');
  let running=Infinity;
  const points=graphData.map((r,i)=>{const best=r.time<running-.001;running=Math.min(running,r.time);const cx=x(i),cy=y(r.time);return `<circle cx="${cx}" cy="${cy}" r="${best?6:5}" fill="${best?'#16a34a':'#087fd1'}"><title>${r.date} ${r.meet||''} ${fmt(r.time)}</title></circle>${best?`<text x="${cx}" y="${cy-25}" text-anchor="middle" font-size="10" font-weight="800" fill="#16803b">🔥 BEST</text>`:''}<text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#123">${fmt(r.time)}</text><text x="${cx}" y="${H-28}" text-anchor="middle" font-size="10" fill="#71808a">${r.label}</text>`}).join('');
  let joLine='';if(joStandard!=null){const jy=y(joStandard);joLine=`<line x1="${left}" x2="${W-right}" y1="${jy}" y2="${jy}" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"></line><text x="${W-right}" y="${jy-6}" text-anchor="end" font-size="11" font-weight="700" fill="#b85d00">JO ${fmt(joStandard)}</text>`;}
  const best=Math.min(...graphData.map(r=>r.time)),first=graphData[0].time,last=graphData[graphData.length-1].time;
  box.innerHTML=`<div style="font-weight:800;margin:10px 0">${title}</div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px"><div style="background:#f5f9fc;border-radius:12px;padding:10px"><div class="muted small">BEST</div><b>${fmt(best)}</b></div><div style="background:#f5f9fc;border-radius:12px;padding:10px"><div class="muted small">最初→最新</div><b>${last<first?'−':''}${Math.abs(first-last).toFixed(2)}秒</b></div><div style="background:#f5f9fc;border-radius:12px;padding:10px"><div class="muted small">記録数</div><b>${graphData.length}</b></div></div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:540px;background:#fff;border-radius:14px"><text x="${left}" y="20" font-size="11" fill="#71808a">↑ タイムが速い</text>${joLine}${graphData.length>1?`<polyline points="${line}" fill="none" stroke="#087fd1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>`:''}${points}</svg></div><div class="muted small" style="text-align:center;margin-top:8px">${stroke} ${distance}m・${course} ／ ${footer}</div>`;

  async function addManualLap(recordId){
  const r=records.find(x=>String(x.id)===String(recordId));
  if(!r){
    alert('記録が見つかりません。');
    return;
  }

  const distanceText=prompt(
    '通過距離を入力してください（例：25、75、150）'
  );
  if(distanceText===null)return;

  const distance=Number(distanceText);
  if(
    !Number.isInteger(distance) ||
    distance<=0 ||
    distance>=Number(r.distance)
  ){
    alert('レース距離より短い正しい通過距離を入力してください。');
    return;
  }

  const existingManual=manualLaps.find(m=>
    String(m.record_id)===String(recordId) &&
    Number(m.distance)===distance
  );

  if(existingManual){
    alert('この距離には手入力データがあります。');
    return;
  }

  let official=[];
  try{
    official=Array.isArray(r.laps)
      ? r.laps
      : JSON.parse(r.laps||'[]');
  }catch(e){
    official=[];
  }

  if(official.some(l=>Number(l.distance)===distance)){
    alert('この距離には公式通過タイムがあります。公式データは変更できません。');
    return;
  }

  const timeText=prompt(
    `${distance}mの通過タイムを入力してください\n例：15.20 または 1:02.35`
  );
  if(timeText===null)return;

  const timeSeconds=sec(timeText.trim());

  if(!Number.isFinite(timeSeconds)||timeSeconds<=0){
    alert('正しいタイムを入力してください。');
    return;
  }

  if(timeSeconds>=Number(r.time_seconds)){
    alert('通過タイムはゴールタイムより短くしてください。');
    return;
  }

  const checkpoints=[
    {distance:0,time:0},
    ...official.map(l=>({
      distance:Number(l.distance),
      time:sec(String(l.cumulative_time||''))
    })),
    ...manualLaps
      .filter(m=>String(m.record_id)===String(recordId))
      .map(m=>({
        distance:Number(m.distance),
        time:Number(m.cumulative_seconds)
      })),
    {distance:Number(r.distance),time:Number(r.time_seconds)}
  ].filter(x=>Number.isFinite(x.distance)&&Number.isFinite(x.time));

  const before=checkpoints
    .filter(x=>x.distance<distance)
    .sort((a,b)=>b.distance-a.distance)[0];

  const after=checkpoints
    .filter(x=>x.distance>distance)
    .sort((a,b)=>a.distance-b.distance)[0];

  if(
    !before || !after ||
    timeSeconds<=before.time ||
    timeSeconds>=after.time
  ){
    alert('前後の通過タイムと矛盾しています。入力値を確認してください。');
    return;
  }

  const {data,error}=await sb
    .from('swim_manual_laps')
    .insert({
      record_id:r.id,
      distance,
      cumulative_seconds:timeSeconds
    })
    .select()
    .single();

  if(error){
    alert('保存できませんでした：'+error.message);
    return;
  }

  manualLaps.push(data);
  renderRecords();
  alert(`${distance}mの通過タイムを保存しました。`);
}

    .sort((a,b)=>a.distance-b.distance)[0];

  if(
    !before||!after||
    timeSeconds<=before.time||
    timeSeconds>=after.time
  ){
    alert('前後の通過タイムと矛盾しています。入力値を確認してください。');
    return;
  }

  const {data,error}=await sb
    .from('swim_manual_laps')
    .update({cumulative_seconds:timeSeconds})
    .eq('id',lap.id)
    .eq('record_id',r.id)
    .select()
    .single();

  if(error){
    alert('修正できませんでした：'+error.message);
    return;
  }

  const index=manualLaps.findIndex(m=>String(m.id)===String(lap.id));
  if(index>=0)manualLaps[index]=data;
  renderRecords();
  alert(`${Number(lap.distance)}mの通過タイムを修正しました。`);
}

// 選手別・同学年ランキング自動照合
function jasfEventCodes(stroke,distance){
  const ev=JASF_EVENTS.find(x=>x.stroke===stroke);
  const d=ev?.distances?.find(x=>Number(x.m)===Number(distance));
  return ev&&d?{styleCode:ev.styleCode,distanceCode:d.code}:null;
}
function jasfGenderCode(player){return String(player?.gender||'').includes('女')?2:1;}
function normalizeJasfName(v){return String(v||'').normalize('NFKC').replace(/[\s　]/g,'').trim();}
async function fetchJasfRankingPage(player,stroke,distance,course,year=2026,schoolClassCode='99',schoolGrade='99',swimmerName='',page=1){
  const codes=jasfEventCodes(stroke,distance);
  if(!codes)throw new Error(`${stroke}${distance}m はランキングAPIのコード対応がありません。`);
  const {data:{session:activeSession},error:sessionError}=await sb.auth.getSession();
  if(sessionError||!activeSession?.access_token)throw new Error('ログインし直してください。');
  const url=String(window.SUPABASE_URL||'').replace(/\/$/,'')+'/functions/v1/jasf-ranking';
  const body={year:Number(year),waterway_code:course==='短水路'?2:1,gender_code:jasfGenderCode(player),distance_code:codes.distanceCode,swimming_style_code:codes.styleCode,school_class_code:String(schoolClassCode??99),school_grade:String(schoolGrade??99),swimmer_name:swimmerName,page:Number(page)};
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),22000);
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+activeSession.access_token},body:JSON.stringify(body),signal:controller.signal});
    const json=await res.json();
    if(!res.ok||!json.success)throw new Error([json.error,json.detail].filter(Boolean).join(' / ')||`HTTP ${res.status}`);
    if(!Array.isArray(json.data))throw new Error('ランキング応答形式が不正です');
    return json.data;
  }finally{clearTimeout(timer);}
}

function jasfSchoolInfo(x){
  const sc=x?.swimmers?.school_class||x?.school_class||{};
  let grade=x?.swimmers?.school_grade??x?.school_grade??null;
  if(grade&&typeof grade==='object')grade=grade.code??grade.value??grade.id??null;
  const gs=x?.swimmers?.school_grades||x?.school_grades;
  if((grade==null||grade==='')&&Array.isArray(gs)){const g=gs.find(Boolean);grade=typeof g==='object'?(g.code??g.value??g.id):g;}
  return {schoolClassCode:sc?.code??99,schoolClassName:sc?.name||'',schoolGrade:grade??99};
}
function jasfPrefInfo(x){
  const s=x?.swimmers||x||{};
  // APIの版によって都道府県情報の格納場所が異なるため候補を順に確認する。
  const candidates=[s.prefecture,s.prefectures,s.entry_group?.prefecture,s.non_entry_group?.prefecture,s.non_entry_group?.member_group,s.entry_group?.member_group];
  for(const c of candidates){
    if(c&&typeof c==='object'&&(c.code!=null||c.id!=null||c.name))return {code:c.code??c.id??'',name:c.name||c.prefecture_name||''};
  }
  return {code:'',name:''};
}
function jasfGradeFromBirthDate(player,year=2026){
  if(!player?.birth_date)return null;
  // 日本の学年は年度開始時点（4/1）の年齢から算出。小1=1 … 高3=12。
  const ageApr1=ageOnDate(player.birth_date,`${year}-04-01`);
  if(ageApr1==null)return null;
  const n=ageApr1-5;
  if(n>=1&&n<=6)return {schoolClassCode:1,schoolClassName:'小学',schoolGrade:n,label:`小学${n}年`};
  if(n>=7&&n<=9)return {schoolClassCode:2,schoolClassName:'中学',schoolGrade:n-6,label:`中学${n-6}年`};
  if(n>=10&&n<=12)return {schoolClassCode:3,schoolClassName:'高校',schoolGrade:n-9,label:`高校${n-9}年`};
  return null;
}
function jasfSameSwimmer(row,player,athleteIds=[]){
  const code=String(row?.swimmers?.swimmer_code||row?.swimmer_code||'').replace(/\D/g,'');
  const ids=(athleteIds||[]).map(v=>String(v||'').replace(/\D/g,'')).filter(Boolean);
  // 競技者IDが登録されている場合はIDを優先する。
  // 同姓同名の別選手を氏名だけで誤照合し、別県の順位を表示することを防ぐ。
  if(ids.length){
    if(code)return ids.includes(code);
    // 競技者IDが登録済みなのにAPI行にコードがない場合、
    // 氏名だけでは同姓同名を区別できないため一致扱いにしない。
    // 誤った選手の順位・都道府県順位を表示するより、順位未確認にする。
    if(!code)return false;
    return ids.includes(code);
  }
  const name=normalizeJasfName(row?.swimmers?.swimmer_name||row?.swimmer_name);
  const playerName=normalizeJasfName(player?.name);
  return !!name && !!playerName && name===playerName;
}

// 競技者コードを返さないAPI応答では、学年・性別・種目を絞った氏名検索結果が
// 1件だけで、かつ公式名が完全一致するときに限って本人として扱う。
// 同姓同名の公式選手が確認できた場合は、登録済みの競技者番号に都道府県を対応付ける。
// ランキングAPIが競技者番号を返さない場合でも、別県の同姓同名を選ばないために使う。
const JASF_ATHLETE_IDENTITIES={
  // 同姓同名の選手がいるため、JASFで確認した競技者番号と所属・都道府県を照合に使う。
  '58366356':{prefecture:'山梨',teamTokens:['フィッツ','竜王']}
};
function jasfNormalizedText(value){
  return String(value||'').normalize('NFKC').replace(/[\\s　・.．,，、()（）［］【】【：:・]/g,'');
}
function jasfExpectedIdentity(athleteIds=[]){
  return (athleteIds||[]).map(id=>JASF_ATHLETE_IDENTITIES[String(id||'').replace(/\\D/g,'')]).find(Boolean)||null;
}
function jasfRowSearchText(row){
  // APIの所属欄は応答ごとに階層が異なるため、行内の文字列をまとめて照合する。
  try{return jasfNormalizedText(JSON.stringify(row));}catch(e){return '';}
}

// 競技者コードを返さないAPI応答では、学年・性別・種目を絞った氏名検索結果を使う。
// 同姓同名が複数なら、登録済みの競技者番号に対応する所属・都道府県まで一致した1件だけを本人として扱う。
function jasfFindSameSwimmer(rows,player,athleteIds=[],allowUniqueNameFallback=false,year=2026){
  const list=Array.isArray(rows)?rows:[];
  const ids=(athleteIds||[]).map(v=>String(v||'').replace(/\\D/g,'')).filter(Boolean);
  const byId=list.find(row=>{
    const code=String(row?.swimmers?.swimmer_code||row?.swimmer_code||'').replace(/\\D/g,'');
    return !!code&&ids.includes(code);
  });
  if(byId)return byId;
  if(!ids.length)return list.find(row=>jasfSameSwimmer(row,player,ids))||null;
  if(!allowUniqueNameFallback)return null;
  const name=normalizeJasfName(player?.name);
  const candidates=list.filter(row=>{
    const rowName=normalizeJasfName(row?.swimmers?.swimmer_name||row?.swimmer_name);
    // 選手ページIDと順位APIの競技者コードは異なることがある。
    // 氏名・学年の候補が1名なら、その公式順位行を本人として採用する。
    if(!name||rowName!==name)return false;
    const info=jasfSchoolInfo(row);
    const playerGrade=jasfGradeFromBirthDate(player,year);
    if(playerGrade&&String(info.schoolClassCode)!=='99'&&String(info.schoolClassCode)!==String(playerGrade.schoolClassCode))return false;
    if(playerGrade&&String(info.schoolGrade)!=='99'&&String(info.schoolGrade)!==String(playerGrade.schoolGrade))return false;
    return true;
  });
  if(candidates.length===1)return candidates[0];

  const identity=jasfExpectedIdentity(ids);
  if(!identity)return null;
  const prefecture=jasfNormalizedText(identity.prefecture);
  const tokens=(identity.teamTokens||[]).map(jasfNormalizedText).filter(Boolean);
  const matches=candidates.map(row=>{
    const text=jasfRowSearchText(row);
    return {row,prefecture:!!prefecture&&text.includes(prefecture),team:tokens.length>0&&tokens.every(token=>text.includes(token))};
  });
  const both=matches.filter(x=>x.prefecture&&x.team);
  if(both.length===1)return both[0].row;
  const team=matches.filter(x=>x.team);
  if(team.length===1)return team[0].row;
  const pref=matches.filter(x=>x.prefecture);
  return pref.length===1?pref[0].row:null;
}

function jasfSleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function withJasfRetry(task,{retries=2,baseDelay=1800}={}){
  let lastError=null;
  for(let attempt=0;attempt<=retries;attempt++){
    try{return await task();}
    catch(e){
      lastError=e;
      if(attempt>=retries)break;
      await jasfSleep(baseDelay*(attempt+1));
    }
  }
  throw lastError||new Error('ランキング通信に失敗しました');
}

async function safeFetchJasfRankingPage(...args){
  return withJasfRetry(()=>fetchJasfRankingPage(...args),{retries:2,baseDelay:1800});
}
async function fetchJasfRankingForPlayer(player,stroke,distance,course,year=2026){
  const target=normalizeJasfName(player.name), athleteIds=jasfAthleteIds(player);
  const derived=jasfGradeFromBirthDate(player,year);

  // まず「同学年＋氏名」で本人を直接検索する。
  // 全順位を500ページ走査する方式をやめ、iPhoneでも止まりにくくする。
  let schoolClassCode=derived?.schoolClassCode??null;
  let schoolGrade=derived?.schoolGrade??null;
  let schoolClassName=derived?.schoolClassName||'';

  // 生年月日から学年が出せない場合だけ、全体の氏名検索から学校区分を補完。
  let base=null;
  if(schoolClassCode==null||schoolGrade==null){
    const overall=await safeFetchJasfRankingPage(player,stroke,distance,course,year,'99','99',target,1);
    base=overall.find(x=>jasfSameSwimmer(x,player,athleteIds))||null;
    if(!base)return {rows:overall,matched:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'not_listed'};
    const apiSchool=jasfSchoolInfo(base);
    schoolClassCode=String(apiSchool.schoolClassCode)!=='99'?apiSchool.schoolClassCode:null;
    schoolGrade=String(apiSchool.schoolGrade)!=='99'?apiSchool.schoolGrade:null;
    schoolClassName=apiSchool.schoolClassName||'';
  }
  if(schoolClassCode==null||schoolGrade==null){
    return {rows:[],matched:base?[base]:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'grade_unavailable'};
  }

  const named=await safeFetchJasfRankingPage(player,stroke,distance,course,year,schoolClassCode,schoolGrade,target,1);
  let self=jasfFindSameSwimmer(named,player,athleteIds,true,year);

  // 見つからない場合だけ全体氏名検索を1回補助的に使う。
  // 再検索でも初回と同じ本人照合を使う。選手ページIDと競技者コードが
  // 異なる登録では、ID一致だけに戻すと公式行があっても見失ってしまう。
  if(!self){
    const overall=await safeFetchJasfRankingPage(player,stroke,distance,course,year,'99','99',target,1);
    base=jasfFindSameSwimmer(overall,player,athleteIds,true,year);
    if(base){
      const apiSchool=jasfSchoolInfo(base);
      const sc=String(apiSchool.schoolClassCode)!=='99'?apiSchool.schoolClassCode:schoolClassCode;
      const sg=String(apiSchool.schoolGrade)!=='99'?apiSchool.schoolGrade:schoolGrade;
      const retry=await safeFetchJasfRankingPage(player,stroke,distance,course,year,sc,sg,target,1);
      self=jasfFindSameSwimmer(retry,player,athleteIds,true,year);
      if(self){schoolClassCode=sc;schoolGrade=sg;schoolClassName=apiSchool.schoolClassName||schoolClassName;}
    }
  }
  if(!self){
    return {rows:named,matched:base?[base]:[],gradeMatched:[],gradeRank:null,prefRank:null,prefName:'',status:'not_listed'};
  }

  const gradeRank=Number(self?.ranking??self?.ranking_in_overall??0)||null;
  const pi=jasfPrefInfo(self);
  let prefRank=null;
  let prefStatus=(pi.code!==''||pi.name)?'pending':'pref_unknown';

  // 都道府県順位は全国順位とは独立して計算。
  // 本人の全国同学年順位までに必要なページだけ取得する（最大40ページ=約2000位まで）。
  // それより下位でも全国順位は表示し、県順位だけ「取得待ち」にする。
  if((pi.code!==''||pi.name) && gradeRank){
    const pageSize=50;
    const neededPages=Math.max(1,Math.ceil(gradeRank/pageSize));
    const maxPrefPages=40;
    const pagesToFetch=Math.min(neededPages,maxPrefPages);
    let samePrefCount=0;
    let reachedSelf=false;

    // 県順位の通信だけ失敗しても、ここまで取得済みの全国順位は必ず返す。
    try{
      for(let page=1;page<=pagesToFetch;page++){
        const rows=await safeFetchJasfRankingPage(player,stroke,distance,course,year,schoolClassCode,schoolGrade,'',page);
        if(!rows.length)break;
        for(const row of rows){
          const rr=Number(row?.ranking??row?.ranking_in_overall??0)||0;
          if(rr && rr>gradeRank){reachedSelf=true;break;}
          const rpi=jasfPrefInfo(row);
          const samePref=pi.code!=='' ? String(rpi.code)===String(pi.code) : (!!pi.name&&rpi.name===pi.name);
          if(samePref)samePrefCount++;
          if(jasfSameSwimmer(row,player,athleteIds)){reachedSelf=true;break;}
        }
        if(reachedSelf)break;
        if(rows.length<pageSize)break;
        await jasfSleep(650);
      }
      if(reachedSelf && samePrefCount>0){
        prefRank=samePrefCount;
        prefStatus='found';
      }else if(neededPages>maxPrefPages){
        prefStatus='too_deep';
      }else{
        prefStatus='not_found';
      }
    }catch(prefError){
      console.warn('都道府県順位取得失敗（全国順位は保持）',player?.name,stroke,distance,course,prefError);
      prefStatus='error';
    }
  }

  return {
    rows:named,matched:base?[base]:[self],gradeMatched:[self],
    gradeRank,prefRank,prefName:pi.name||'',
    schoolClassName,schoolGrade,
    gradeLabel:derived?.label||`${schoolClassName}${schoolGrade}年`,
    status:'found',prefStatus
  };
}
function escapeRankingError(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function updatePlayerSameGradeRankings(playerId,{skipCached=false,silent=false,eventKey=null}={}){
  const p=playerById(playerId);
  const box=$('#playerJasfRankingBox');
  if(!p)return {ok:false,found:0,total:0,processed:0,skipped:0};
  const athleteIds=jasfAthleteIds(p);
  if(!athleteIds.length){if(box&&!silent)box.innerHTML='<div class="notice">先に日本水泳連盟の競技者IDを登録してください。</div>';return {ok:false,found:0,total:0,processed:0,skipped:0};}
  const mine=records.filter(r=>String(r.swimmer_id)===String(playerId)&&Number.isFinite(Number(r.time_seconds))),bestMap=new Map();
  mine.forEach(r=>{const k=`${r.stroke}|${Number(r.distance)}|${r.course}`;const old=bestMap.get(k);if(!old||Number(r.time_seconds)<Number(old.time_seconds))bestMap.set(k,r);});
  const bests=[...bestMap.values()].filter(r=>jasfEventCodes(r.stroke,r.distance)&&(!eventKey||eventKey===`${r.stroke}|${Number(r.distance)}|${r.course}`));
  if(!bests.length){if(box&&!silent)box.innerHTML='<div class="notice">照合できるベスト記録がありません。</div>';return {ok:true,found:0,total:0,processed:0,skipped:0};}
  if(box&&!silent)box.innerHTML=`<div class="notice">🇯🇵 ${p.name} の同学年全国順位・都道府県内順位を ${bests.length}種目照合中…</div>`;
  const year=2026,results=[]; let processed=0,skipped=0;
  for(const r of bests){
    const cached=getNationalRankCache(playerId,r.stroke,r.distance,r.course,year);
    if(skipCached && cached && !cached.error){results.push({r,cached,skipped:true});skipped++;continue;}
    try{
      const q=await fetchJasfRankingForPlayer(p,r.stroke,r.distance,r.course,year);const x=q.gradeMatched?.[0]||null;
      const data=x?{found:true,rank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||'-'),gradeRank:(q.gradeRank||x?.ranking||x?.ranking_in_overall||'-'),prefRank:q.prefRank??null,prefName:q.prefName||'',prefStatus:q.prefStatus||'pending',officialTime:x?.record?.record||x?.record||'-',swimmerCode:x?.swimmers?.swimmer_code||x?.swimmer_code||'-',updatedAt:new Date().toISOString()}:{found:false,status:q?.status||'not_listed',updatedAt:new Date().toISOString()};
      // 再照会で見つからない場合は、以前に確認できた順位を消さない。
      // 検索不一致は公式ランキングへの未掲載を証明しないため、既存の成功結果を保持する。
      const preserved=(!x&&cached?.found)?{
        ...cached,
        refreshStatus:q?.status||'not_confirmed',
        refreshCheckedAt:new Date().toISOString()
      }:data;
      // 1種目終わるたびに保存。途中停止しても取得済み結果を失わない。
      setNationalRankCache(playerId,r.stroke,r.distance,r.course,preserved,year);

    }catch(e){

      if(!cached?.found)setNationalRankCache(playerId,r.stroke,r.distance,r.course,data,year);
      results.push({r,error:data.errorMessage,cached:cached?.found?cached:data}); processed++;
      if(!eventKey)await jasfSleep(1200);
    }
    if(!eventKey)await new Promise(res=>setTimeout(res,350));
  }
  const found=results.filter(v=>v.x||v.cached?.found).length;
  if(box&&!silent){
    const rows=results.map(v=>{const r=v.r,c=v.cached||{};if(v.error&&!c.found)return `<div class="row"><div><b>${r.stroke} ${r.distance}m</b><br><span class="muted">${r.course}</span></div><span class="small" style="color:#a61b1b;overflow-wrap:anywhere">${escapeRankingError(v.error)}</span></div>`;if(!c.found)return `<div class="row"><div><b>${r.stroke} ${r.distance}m</b><br><span class="muted">${r.course}</span></div><span class="muted">同学年で該当なし</span></div>`;return `<div class="row"><div><b>${r.stroke} ${r.distance}m・${r.course}</b><br><span class="muted">競技者コード ${c.swimmerCode||'-'} ／ アプリBEST ${fmt(r.time_seconds)}</span></div><div style="text-align:right"><b style="font-size:20px">全国 ${c.gradeRank||c.rank}位</b><br><span class="muted">${c.prefRank?`🗻 ${c.prefName||'都道府県内'} ${c.prefRank}位 ／ `:(c.prefStatus==='too_deep'?'🗻 県順位 取得待ち ／ ':c.prefStatus==='pref_unknown'?'🗻 県情報なし ／ ':c.prefStatus==='error'?'🗻 県順位 通信エラー・再取得可 ／ ':'🗻 県順位 再取得可 ／ ')}公式 ${c.officialTime||'-'}</span></div></div>`;}).join('');
    const failures=results.filter(v=>v.error).length;
    box.innerHTML=`<div class="result ${failures?'':'good'}"><b>${failures?'⚠️ ランキング照合が終了しました（一部通信エラー）':'✅ 同学年ランキングを更新しました'}</b><br><span class="small">${year}年度 ／ ${found}/${results.length}種目で同学年順位を確認${failures?` ／ 通信エラー ${failures}種目`:''}</span>${failures?'<p class="small">各種目のエラー詳細を下に表示しています。通信先の制限（CORS等）の場合は、サーバー側の対応が必要です。</p>':''}</div><div class="result" style="margin-top:10px">${rows}</div>`;
  }

async function loadSharedRankingBulkProgress(){

 try{

   const localCache=rankingCacheSnapshot(2026);
   applyRankingCacheSnapshot(cloud.rankingCache);

function sameGradeRankingSummaryHtml(year=2026,limit=30){
  const rows=[];

    });
