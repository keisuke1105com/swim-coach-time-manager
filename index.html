<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b84d8"><link rel="manifest" href="manifest.json"><title>水泳コーチ・タイム管理</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#eef7fc;color:#123}header{background:linear-gradient(135deg,#087fd1,#38bdf8);color:white;padding:18px 16px 22px;border-radius:0 0 24px 24px}h1{font-size:22px;margin:0 0 5px}header small{opacity:.9}.wrap{max-width:760px;margin:auto;padding:14px 12px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 14px #0b84d81a;margin-bottom:12px}.stat{font-size:27px;font-weight:800;margin-top:5px}.label{font-size:13px;color:#637786}button,select,input{font:inherit}button{border:0;border-radius:14px;padding:14px 16px;background:#087fd1;color:white;font-weight:700;cursor:pointer}.secondary{background:#e7f3fb;color:#0869a8}.danger{background:#ffe8e8;color:#b42318}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#47606f}select,input{width:100%;padding:14px;border:1px solid #c9dce8;border-radius:13px;background:#fff}input.time{font-size:28px;text-align:center;font-weight:800;letter-spacing:1px}.eventgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.eventgrid button{padding:12px 5px;background:#e8f5fd;color:#0869a8}.eventgrid button.active{background:#087fd1;color:white}.result{border-radius:16px;padding:14px;background:#f1f8fc;margin-top:12px}.good{background:#e8f8ef;color:#14753b}.bad{background:#fff2e8;color:#a64b00}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d6e5ed;display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));z-index:5}.tabs button{background:none;color:#55717f;padding:7px 2px;font-size:11px}.tabs button.active{color:#087fd1}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f3}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8f8ef;color:#14753b;font-size:12px;font-weight:700}.muted{color:#71808a}.hidden{display:none}.search{margin-bottom:10px}@media(min-width:650px){.eventgrid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>🏊 水泳コーチ・タイム管理</h1><small>選手の記録・ベスト・JO突破状況をスマホで管理</small></div></header><main class="wrap"><section id="home"></section><section id="players" class="hidden"></section><section id="input" class="hidden"></section><section id="records" class="hidden"></section><section id="analysis" class="hidden"></section></main><nav class="tabs"><button data-tab="home">🏠<br>ホーム</button><button data-tab="players">👥<br>選手</button><button data-tab="input">⏱️<br>入力</button><button data-tab="records">📋<br>記録</button><button data-tab="analysis">📊<br>分析</button></nav><script src="data.js"></script><script>
const KEY='swimCoachRecordsV3';let records=JSON.parse(localStorage.getItem(KEY)||'[]');let selectedPlayer='';let selectedEvent='自由形',selectedDistance='50m',selectedPool='長水路';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const events=[...new Set(STANDARDS.map(x=>x.event))], distances=[...new Set(STANDARDS.map(x=>x.distance))];
function save(){localStorage.setItem(KEY,JSON.stringify(records))}function sec(t){let p=String(t).trim().split(':');if(p.length===2)return +p[0]*60+ +p[1];return NaN}function fmt(v){if(v==null||isNaN(v))return '-';let m=Math.floor(v/60),s=v-m*60;return (m?m+':':'')+s.toFixed(2).padStart(m?5:0,'0')}function standard(player,event,distance,pool){let p=PLAYERS.find(x=>x.name===player);if(!p)return null;let x=STANDARDS.find(x=>x.event===event&&x.distance===distance&&x.division===p.division);if(!x)return null;return p.gender==='男子'?(pool==='長水路'?x.maleLC:x.maleSC):(pool==='長水路'?x.femaleLC:x.femaleSC)}
function best(player,event,distance,pool){let a=records.filter(r=>r.player===player&&r.event===event&&r.distance===distance&&r.pool===pool).map(r=>r.seconds);return a.length?Math.min(...a):null}
function renderHome(){let today=new Date().toISOString().slice(0,10), td=records.filter(r=>r.date===today).length, b=records.filter(r=>r.isBest).length, j=records.filter(r=>r.jo).length;$('#home').innerHTML=`<div class="grid"><div class="card"><div class="label">今日の入力</div><div class="stat">${td}</div></div><div class="card"><div class="label">ベスト更新</div><div class="stat">${b}</div></div><div class="card"><div class="label">JO突破記録</div><div class="stat">${j}</div></div><div class="card"><div class="label">登録選手</div><div class="stat">${PLAYERS.length}</div></div></div><div class="card"><h3>🚀 すぐ入力</h3><button style="width:100%" onclick="go('input')">タイムを入力する</button></div><div class="card"><h3>最近の記録</h3>${records.slice(-5).reverse().map(r=>`<div class="row"><div><b>${r.player}</b><br><span class="muted">${r.event} ${r.distance}・${r.pool}</span></div><b>${r.time}</b></div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}</div>`}
function renderPlayers(){let q='';$('#players').innerHTML=`<div class="card"><h2>👥 選手一覧</h2><input class="search" id="pq" placeholder="選手名で検索" oninput="filterPlayers()"><div id="plist"></div></div>`;filterPlayers()}function filterPlayers(){let q=($('#pq')?.value||'').toLowerCase();$('#plist').innerHTML=PLAYERS.filter(p=>p.name.toLowerCase().includes(q)).map(p=>{let n=records.filter(r=>r.player===p.name).length;let j=records.filter(r=>r.player===p.name&&r.jo).length;return `<div class="row"><div><b>${p.name}</b><br><span class="muted">${p.division}・${p.gender}・${n}件</span></div><div>${j?'<span class="badge">JO突破あり</span>':''}<button class="secondary" onclick="selectPlayer('${p.name.replaceAll("'","\\'")}');go('input')">入力</button></div></div>`}).join('')}
function renderInput(){if(!selectedPlayer)selectedPlayer=PLAYERS[0]?.name||'';$('#input').innerHTML=`<div class="card"><h2>⏱️ タイム入力</h2><div class="field"><label>選手</label><select id="ip">${PLAYERS.map(p=>`<option ${p.name===selectedPlayer?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label>種目</label><div class="eventgrid">${events.filter(e=>!e.includes('リレー')).map(e=>`<button class="${e===selectedEvent?'active':''}" onclick="setEvent('${e}')">${e}</button>`).join('')}</div></div><div class="field"><label>距離</label><div class="eventgrid">${distances.filter(d=>!d.includes('4×')).map(d=>`<button class="${d===selectedDistance?'active':''}" onclick="setDistance('${d}')">${d}</button>`).join('')}</div></div><div class="field"><label>水路</label><div class="eventgrid"><button class="${selectedPool==='長水路'?'active':''}" onclick="setPool('長水路')">長水路</button><button class="${selectedPool==='短水路'?'active':''}" onclick="setPool('短水路')">短水路</button></div></div><div class="field"><label>タイム（例 1:02.35 / 28.52）</label><input class="time" id="itime" inputmode="decimal" placeholder="1:02.35" oninput="preview()"></div><div class="field"><label>大会名・メモ（任意）</label><input id="ime" placeholder="○○大会"></div><div id="preview"></div><button style="width:100%;font-size:18px" onclick="addRecord()">記録を保存</button></div>`;preview()}
function selectPlayer(n){selectedPlayer=n;renderInput()}function setEvent(e){selectedEvent=e;renderInput()}function setDistance(d){selectedDistance=d;renderInput()}function setPool(p){selectedPool=p;renderInput()}
function preview(){let t=$('#itime')?.value||'',s=sec(t),st=standard($('#ip')?.value||selectedPlayer,selectedEvent,selectedDistance,selectedPool),b=best($('#ip')?.value||selectedPlayer,selectedEvent,selectedDistance,selectedPool);if(isNaN(s)){if($('#preview'))$('#preview').innerHTML='';return}let jo=st!=null&&s<=st, upd=b==null||s<b;$('#preview').innerHTML=`<div class="result ${jo?'good':'bad'}"><b>${jo?'🏆 JO突破':'🎯 JO未突破'}</b><br>JO標準：${fmt(st)}　${st!=null?(jo?'（'+(st-s).toFixed(2)+'秒クリア）':'（あと '+(s-st).toFixed(2)+'秒）'):'（標準記録なし）'}<br>自己ベスト：${fmt(b)}　${upd&&b!=null?'🔥 '+(b-s).toFixed(2)+'秒更新':''}</div>`}
function addRecord(){let player=$('#ip').value,t=$('#itime').value,s=sec(t);if(!player||isNaN(s)){alert('選手と正しいタイムを入力してください。');return}let st=standard(player,selectedEvent,selectedDistance,selectedPool),b=best(player,selectedEvent,selectedDistance,selectedPool),jo=st!=null&&s<=st,isBest=b==null||s<b;records.push({id:Date.now(),date:new Date().toISOString().slice(0,10),player,event:selectedEvent,distance:selectedDistance,pool:selectedPool,time:t,seconds:s,standard:st,jo,isBest,memo:$('#ime').value||''});save();alert(isBest?(jo?'🏆 JO突破＆自己ベスト更新！':'🔥 自己ベスト更新！'):(jo?'🏆 JO突破！':'記録を保存しました'));$('#itime').value='';$('#ime').value='';renderHome();renderInput()}
function renderRecords(){let rs=[...records].reverse();$('#records').innerHTML=`<div class="card"><h2>📋 タイム履歴</h2>${rs.map(r=>`<div class="row"><div><b>${r.player}</b><br><span class="muted">${r.date}・${r.event} ${r.distance}・${r.pool}</span><br>${r.jo?'<span class="badge">JO突破</span> ':''}${r.isBest?'<span class="badge">BEST</span> ':''}</div><div style="text-align:right"><b>${r.time}</b><br><button class="danger" onclick="del(${r.id})">削除</button></div></div>`).join('')||'<p class="muted">記録がありません。</p>'}</div>`}function del(id){if(confirm('この記録を削除しますか？')){records=records.filter(r=>r.id!==id);save();renderRecords();renderHome()}}
function renderAnalysis(){let jo=records.filter(r=>r.jo).length,b=records.filter(r=>r.isBest).length;let counts={};records.forEach(r=>counts[r.player]=(counts[r.player]||0)+1);let ranking=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$('#analysis').innerHTML=`<div class="grid"><div class="card"><div class="label">記録件数</div><div class="stat">${records.length}</div></div><div class="card"><div class="label">JO突破</div><div class="stat">${jo}</div></div><div class="card"><div class="label">ベスト更新</div><div class="stat">${b}</div></div></div><div class="card"><h2>🏆 入力件数ランキング</h2>${ranking.map((x,i)=>`<div class="row"><b>${i+1}. ${x[0]}</b><span>${x[1]}件</span></div>`).join('')||'<p class="muted">記録を入力すると表示されます。</p>'}</div><div class="card"><h3>☁️ クラウド共有について</h3><p class="muted">現在はスマホ内に保存する試作版です。次の段階で、Firebase / Supabase等を接続して、複数コーチの端末で同じデータを共有できる構成にできます。</p></div>`}
function go(tab){$$('main section').forEach(s=>s.classList.add('hidden'));$('#'+tab).classList.remove('hidden');$$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')renderHome();if(tab==='players')renderPlayers();if(tab==='input')renderInput();if(tab==='records')renderRecords();if(tab==='analysis')renderAnalysis()}$$('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));go('home');
</script></body></html>
