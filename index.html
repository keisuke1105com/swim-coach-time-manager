function sec(t){
  t=String(t).trim();
  if(!t)return NaN;

  // 全角記号を半角へ
  t=t.replace(/：/g,':').replace(/。/g,'.');

  // iPhone入力対応
  // 例 1.13.64 → 1:13.64
  const dots=(t.match(/\./g)||[]).length;
  if(!t.includes(':') && dots===2){
    const p=t.split('.');
    t=p[0]+':'+p[1]+'.'+p[2];
  }

  // 1:13.64 → 秒へ変換
  let p=t.split(':');
  if(p.length===2){
    const m=Number(p[0]);
    const s=Number(p[1]);
    return Number.isFinite(m)&&Number.isFinite(s)
      ? m*60+s
      : NaN;
  }

  // 50mなど 32.45 はそのまま秒
  const n=Number(t);
  return Number.isFinite(n)?n:NaN;
}

function fmt(v){if(v==null||isNaN(v))return '-';let m=Math.floor(v/60),s=v-m*60;return (m?m+':':'')+s.toFixed(2).padStart(m?5:0,'0')}
function playerById(id){return PLAYERS.find(x=>x.id===id)}
function ageOnDate(birthDate, targetDate){
  if(!birthDate || !targetDate) return null;

  const b = new Date(birthDate + 'T00:00:00');
  const d = new Date(targetDate + 'T00:00:00');

  if(isNaN(b) || isNaN(d)) return null;

  let age = d.getFullYear() - b.getFullYear();

  const birthdayPassed =
    d.getMonth() > b.getMonth() ||
    (d.getMonth() === b.getMonth() && d.getDate() >= b.getDate());

  if(!birthdayPassed) age--;

  return age;
}
function standard(playerId,stroke,distance,course,targetDate=null){
  let p=playerById(playerId);
  if(!p)return null;

  let division=p.age_group;
// 大会当日の満年齢を計算
let meetAge = null;

if(p.birth_date && targetDate){
  meetAge = ageOnDate(p.birth_date, targetDate);
}
// 大会当日の年齢からJO区分を自動判定
if(meetAge !== null){
  if(meetAge <= 9){
    division = '9歳以下';
  }else if(meetAge === 10){
    division = '10歳';
  }else if(meetAge === 11){
    division = '11歳';
  }else if(meetAge === 12){
    division = '12歳';
  }else if(meetAge === 13){
    division = '13歳';
  }else if(meetAge === 14){
    division = '14歳';
  }else if(meetAge === 15 || meetAge === 16){
    division = '15〜16歳';
  }else if(meetAge >= 17){
    division = 'CS';
  }
}
  // 17-18歳はCS
  if(division==='17-18歳' || division==='17～18歳'){
    division='CS';
  }

  // 13歳以上の50m 背泳ぎ・平泳ぎ・バタフライはCS
const ageMatch=String(p.age_group||'').match(/\d+/);
const age=ageMatch ? Number(ageMatch[0]) : null;

if(
  age!==null &&
  age>=13 &&
  Number(distance)===50 &&
  ['背泳ぎ','平泳ぎ','バタフライ'].includes(stroke)
){
  division='CS';
}

  let x=STANDARDS.find(x=>
    x.event===stroke &&
    parseInt(x.distance)===Number(distance) &&
    x.division===division
  );

  return p.gender==='男子'
    ? (course==='長水路'?x.maleLC:x.maleSC)
    : (course==='長水路'?x.femaleLC:x.femaleSC);
}
function tokyoScStandard(playerId,stroke,distance){
  const p=playerById(playerId);

  if(!p || !Array.isArray(window.TOKYO_SC_STANDARDS)){
    return null;
  }

  // 性別を統一
  const g=String(p.gender||'').trim();
  const gender=
    g.includes('女') ? '女子' :
    g.includes('男') ? '男子' :
    g;

  // 年齢を統一
  const ageRaw=String(p.age_group||'').trim();

  // 東京SCは15歳・16歳を別基準にしているので一旦対象外
  if(
    ageRaw.includes('15〜16') ||
    ageRaw.includes('15～16') ||
    ageRaw==='CS'
  ){
    return null;
  }

  let age=ageRaw;

  // 「14」「14才」「14歳」などをすべて「14歳」に統一
  const ageMatch=ageRaw.match(/\d+/);

  if(ageMatch){
    const n=Number(ageMatch[0]);

    if(n<=8){
      age='8歳以下';
    }else if(n>=19){
      age='19歳以上';
    }else{
      age=`${n}歳`;
    }
  }

  const event=String(stroke||'').trim();
  const dist=Number(distance);
console.log('東京SC確認', {gender, age, event, dist, total:window.TOKYO_SC_STANDARDS.length});
  const x=window.TOKYO_SC_STANDARDS.find(r=>
    String(r.gender).trim()===gender &&
    String(r.age).trim()===age &&
    String(r.event).trim()===event &&
    Number(r.distance)===dist
  );

  return x ? Number(x.standard) : null;
}

  function renderTrendChart(playerId){
  const select=$('#trendSelect');
  const chart=$('#trendChart');

  if(!select || !chart)return;

  const key=select.value;
  if(!key)return;

  const [stroke,distance,course]=key.split('|');

  const data=records
    .filter(r=>
      String(r.swimmer_id)===String(playerId) &&
      r.stroke===stroke &&
      Number(r.distance)===Number(distance) &&
      r.course===course
    )
    .sort((a,b)=>
      String(a.record_date||'').localeCompare(String(b.record_date||''))
    );

  if(!data.length){
    chart.innerHTML='<p class="muted">グラフにできる記録がありません。</p>';
    return;
  }

  const times=data.map(r=>Number(r.time_seconds));
  const joStandard=standard(playerId,stroke,distance,course);

  let values=[...times];
  if(joStandard!=null)values.push(joStandard);

  const min=Math.min(...values);
  const max=Math.max(...values);

  const padding=Math.max((max-min)*0.25,1);

  const yMin=min-padding;
  const yMax=max+padding;

  const W=600;
  const H=260;

  const left=55;
  const right=20;
  const top=25;
  const bottom=45;

  const plotW=W-left-right;
  const plotH=H-top-bottom;

  const x=i=>{
    if(data.length===1)return left+plotW/2;
    return left+(i/(data.length-1))*plotW;
  };

  const y=value=>{
    return top+((value-yMin)/(yMax-yMin))*plotH;
  };

  const linePoints=data
    .map((r,i)=>`${x(i)},${y(Number(r.time_seconds))}`)
    .join(' ');

  const points=data.map((r,i)=>{
    const cx=x(i);
    const cy=y(Number(r.time_seconds));
    const date=String(r.record_date||'').slice(5).replace('-','/');

    return `
      <circle cx="${cx}" cy="${cy}" r="5" fill="#087fd1"></circle>

      <text
        x="${cx}"
        y="${cy-10}"
        text-anchor="middle"
        font-size="12"
        font-weight="700"
        fill="#123">
        ${fmt(Number(r.time_seconds))}
      </text>

      <text
        x="${cx}"
        y="${H-15}"
        text-anchor="middle"
        font-size="11"
        fill="#71808a">
        ${date}
      </text>
    `;
  }).join('');

  let joLine='';

  if(joStandard!=null){
    const jy=y(joStandard);

    joLine=`
      <line
        x1="${left}"
        x2="${W-right}"
        y1="${jy}"
        y2="${jy}"
        stroke="#e67e22"
        stroke-width="2"
        stroke-dasharray="7 5">
      </line>

      <text
        x="${W-right}"
        y="${jy-6}"
        text-anchor="end"
        font-size="12"
        font-weight="700"
        fill="#b85d00">
        JO ${fmt(joStandard)}
      </text>
    `;
  }

  chart.innerHTML=`
    <div style="margin-top:12px;overflow-x:auto">
      <svg
        viewBox="0 0 ${W} ${H}"
        style="width:100%;min-width:520px;background:#fff;border-radius:14px"
      >

        <text
          x="${left}"
          y="16"
          font-size="11"
          fill="#71808a">
          ↑ タイムが速い
        </text>

        ${joLine}

        ${
          data.length>1
            ? `<polyline
                 points="${linePoints}"
                 fill="none"
                 stroke="#087fd1"
                 stroke-width="4"
                 stroke-linecap="round"
                 stroke-linejoin="round">
               </polyline>`
            : ''
        }

        ${points}
      </svg>
    </div>

    <div class="muted" style="margin-top:8px;text-align:center">
      ${stroke} ${distance}m・${course}
      ／ ${data.length}記録
    </div>
  `;
}

async function editRecord(id){
  const r=records.find(x=>String(x.id)===String(id));
  if(!r){
    alert('記録が見つかりません。');
    return;
  }

  const newDate=prompt(
    '大会日を入力してください（例：2026-07-12）',
    r.record_date || ''
  );

  if(newDate===null)return;

  const newTime=prompt(
    'タイムを入力してください（例：26.87 または 1:02.35）',
    fmt(r.time_seconds)
  );

  if(newTime===null)return;

  const newSeconds=sec(newTime);

  if(isNaN(newSeconds)){
    alert('正しいタイムを入力してください。');
    return;
  }

  const {error}=await sb
    .from('swim_records')
    .update({
      record_date:newDate,
      time_seconds:newSeconds
    })
    .eq('id',id);

  if(error){
    alert(error.message);
    return;
  }

  await loadCloud();
  renderRecords();
  renderHome();
  alert('記録を更新しました！');
}

function renderAnalysis(){
  let jo=records.filter(r=>r.is_jo_qualified).length;
  let bestRecords=records.filter(r=>r.is_personal_best).length;

  let counts={};
  records.forEach(r=>{
    counts[r.swimmer_id]=(counts[r.swimmer_id]||0)+1;
  });

  let ranking=Object.entries(counts)
    .sort((a,b)=>b[1]-a[1]);

  // JOに近い選手・種目ランキングを作成
  let joBestMap={};

  records.forEach(r=>{
    let player=playerById(r.swimmer_id);
    if(!player)return;

    let st=standard(
      r.swimmer_id,
      r.stroke,
      r.distance,
      r.course
    );

    if(st==null)return;

    let time=Number(r.time_seconds);
    if(!Number.isFinite(time) || time<=0)return;

    let key=`${r.swimmer_id}|${r.stroke}|${r.distance}|${r.course}`;

    if(!joBestMap[key] || time<joBestMap[key].time){
      joBestMap[key]={
        player,
        stroke:r.stroke,
        distance:r.distance,
        course:r.course,
        time,
        standard:st
      };
    }
  });

let joRanking=Object.values(
  Object.values(joBestMap).reduce((best,x)=>{
    const id=String(x.player.id);
    const rate=(x.standard/x.time)*100;

    if(!best[id] || rate>best[id].rate){
      best[id]={
        ...x,
        swimmer_id:x.player.id,
        rate:rate,
        diff:x.time-x.standard,
        qualified:x.time<=x.standard
      };
    }

    return best;
  },{})
).sort((a,b)=>{
  // JO突破済みを先頭、その後は達成率が高い順
  if(a.qualified!==b.qualified){
    return a.qualified ? -1 : 1;
  }
  return b.rate-a.rate;
});

  let joRankingHtml=joRanking.length
    ? joRanking.map((x,i)=>{
        let medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}位`;

        let status=x.qualified
          ? `🏆 JO突破！ 達成率 ${x.rate.toFixed(1)}%`
          : `JOまであと ${x.diff.toFixed(2)}秒　達成率 ${x.rate.toFixed(1)}%`;

        return `
          <div class="row">
            <div>
              <b>${medal} ${x.player.name}</b><br>
              <span class="muted">
                ${x.stroke} ${x.distance}m・${x.course}
              </span><br>
              <span class="muted">${status}</span>
            </div>

            <div style="text-align:right">
              <b>${fmt(x.time)}</b><br>
              <span class="muted">JO ${fmt(x.standard)}</span>
            </div>
          </div>
        `;
      }).join('')
    : '<p class="muted">JO標準と比較できる記録がまだありません。</p>';

  $('#analysis').innerHTML=`
    <div class="grid">
      <div class="card">
        <div class="label">記録件数</div>
        <div class="stat">${records.length}</div>
      </div>

      <div class="card">
        <div class="label">JO突破数</div>
        <div class="stat">${jo}</div>
      </div>

      <div class="card">
        <div class="label">ベスト更新</div>
        <div class="stat">${bestRecords}</div>
      </div>
    </div>

    <div class="card">
      <h2>🏆 JOに近い選手・種目ランキング</h2>
      <p class="muted">
        全選手のベストタイムをJO標準記録と比較しています。
      </p>
      ${joRankingHtml}
    </div>

    <div class="card">
      <h2>🏅 入力件数ランキング</h2>
      ${
        ranking.map((x,i)=>`
          <div class="row">
            <b>${i+1}. ${playerById(x[0])?.name||'選手'}</b>
            <span>${x[1]}件</span>
          </div>
        `).join('') ||
        '<p class="muted">記録を入力すると表示されます。</p>'
      }
    </div>

    <div class="card">
      <h3>☁️ クラウド共有</h3>
      <p>
        現在の選手数：<b>${PLAYERS.length}名</b>
      </p>
      <p class="muted">
        「選手」→「＋ 選手追加」から人数を増やせます。
        Mac・iPhoneで同じ一覧と記録を共有します。
      </p>
      <button class="secondary" onclick="migrateLocalV3()">
        このMacの旧v3記録をクラウドへ移行
      </button>
    </div>
  `;
}
async function migrateLocalV3(){
  let old=[];
  try{
    old=JSON.parse(localStorage.getItem('swimCoachRecordsV3')||'[]');
  }catch{}

  if(!old.length){
    alert('この端末に旧v3記録はありません。');
    return;
  }

  let byName=Object.fromEntries(PLAYERS.map(p=>[p.name,p]));
  let payload=[];
  let skipped=0;

  for(let r of old){
    let p=byName[r.player];
    if(!p)continue;

    let candidate={
      swimmer_id:p.id,
      stroke:r.event,
      distance:parseInt(r.distance),
      course:r.pool,
      time_seconds:+r.seconds,
      meet_name:r.memo||null,
      record_date:r.date||new Date().toISOString().slice(0,10),
      memo:null,
      is_personal_best:!!r.isBest,
      is_jo_qualified:!!r.jo
    };

    let duplicate=records.some(x=>
      x.swimmer_id===candidate.swimmer_id &&
      x.stroke===candidate.stroke &&
      Number(x.distance)===Number(candidate.distance) &&
      x.course===candidate.course &&
      Math.abs(Number(x.time_seconds)-Number(candidate.time_seconds))<0.001 &&
      x.record_date===candidate.record_date
    );

    if(duplicate){
      skipped++;
    }else{
      payload.push(candidate);
    }
  }

  if(!payload.length){
    alert(
      skipped
        ? `移行対象はすべて登録済みです。（重複 ${skipped}件をスキップ）`
        : '選手名が一致する旧記録がありません。'
    );
    return;
  }

  let {error}=await sb.from('swim_records').insert(payload);

  if(error){
    alert(error.message);
    return;
  }

  await loadCloud();

  alert(
    `${payload.length}件をクラウドへ移行しました。` +
    (skipped ? `\n重複 ${skipped}件はスキップしました。` : '')
  );

  renderAnalysis();
  renderHome();
}
